   <radialGradient id="${p}Vig" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>`;
  let gN=0;const glow=(x,y,r,col,o=.5)=>{const id=`${p}Gw${gN++}`;defs+=`<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity="${o}"/><stop offset=".4" stop-color="${col}" stop-opacity="${(o*.45).toFixed(2)}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`;return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id})"/>`};

  if(K==='Cozy nook'){ // warm lamp, fairy lights, potted sprout, moss and toadstools

        <path d="M-15 204 h30 l-3.5 20 h-23z" fill="#b8693f"/><rect x="-17" y="199" width="34" height="7" rx="2.5" fill="#d07f4f"/><path d="M-8 212 h16" stroke="#9c5733" stroke-width="2" stroke-linecap="round"/></g>
      <ellipse cx="312" cy="222" rx="32" ry="10" fill="#3f6b3a"/><ellipse cx="300" cy="219" rx="16" ry="8" fill="#52844a"/><ellipse cx="324" cy="218" rx="13" ry="7" fill="#4a7a43"/>

    back=`<circle cx="230" cy="-40" r="290" fill="url(#${p}Lamp)"/>

      <rect x="-120" y="140" width="640" height="70" fill="#d8efe0" opacity=".07"/>

      ${[[20,206,170],[384,208,190]].map(([x,g,h])=>pine(x,g,h,'#143528')).join('')}

      ${mush(30,196,.7,'#e8b04a',0,0)}${mush(40,188,.55,'#e8b04a',0,0)}`;

      html+=at(100+G.w*.9,G.mid-G.h*.15,`<g transform="rotate(-62)"><g class="fx-scritch" style="--t:1.35s;--d:.2s">${zg(Zh,HAND)}</g></g>`); // the other hand cups a cheek

    }
    if(k===3){ // spa massage: two hands knead both sides, warm glow, a ring of hearts
      const ox=G.w+8;
      html=at(100-ox,G.mid,`<g transform="rotate(90)"><g class="fx-knead" style="--kx:0px;--ky:-5px">${zg(Zh,HAND)}</g></g>`);
      html+=at(100+ox,G.mid,`<g transform="rotate(-90)"><g class="fx-knead" style="--kx:0px;--ky:-5px">${zg(Zh,HAND)}</g></g>`);
      html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#f28bb0" class="fx-glow2" style="--d:.5s;animation-duration:1.8s"/>`);

      html+=burstAt(G.hx,G.head-4,8,34,1.85,'#f28bb0','M0 4C-6 0-5.4-4.6-2.3-4.6-1 -4.6 0-3.3 0-2.6 0-3.3 1-4.6 2.3-4.6 5.4-4.6 6 0 0 4z');
      html+=burstAt(G.hx,G.head-4,6,22,1.95,'#fff3b0');
    }
  }

  if(mode==='groom'){
    const sw=(G.w*.7).toFixed(0),by=G.mid-G.h*.3;
    const brush=(d,t)=>at(100,by,`<g class="fx-scrub" style="--w:${sw}px;--d:${d}s;--t:${t}s">${zg(Zh,BRUSH)}</g>`);
    const suds=(d0,end,n=9)=>{let s='';for(let i=0;i<n;i++){const x=100+(i-(n-1)/2)*G.w*1.5/n+(i%2?3:-3),y=G.mid-G.h*(.55-((i*37)%10)/14),d=d0+(i%5)*.08+Math.floor(i/5)*.12;
      s+=at(x,y,`<circle r="${(3+(i%3)*1.8).toFixed(1)}" fill="#ffffff" fill-opacity=".55" stroke="#e8f6ff" stroke-width="1.2" class="fx-suds" style="--d:${d.toFixed(2)}s;--t:${(end-d).toFixed(2)}s"/>`)}return s};
    if(k===0){

    if(k>=1){
      html=brush(0,.75);
      html+=at(100,by+4,`<g class="fx-scrub" style="--w:${sw}px;--d:.62s;--t:.8s">${zg(Zh,SPONGE)}</g>`);
      const end=k===1?1.6:k===2?1.85:1.75;
      html+=suds(.7,end,k===1?8:11);
      if(k===1)for(let i=0;i<6;i++)html+=at(100+(i-2.5)*G.w*.3,G.mid-G.h*.1,`<circle r="${3+(i%3)*1.5}" fill="#cfeaf8" fill-opacity=".35" stroke="#e8f6ff" stroke-width="1.2" class="fx-pop" style="--d:${(1.25+i*.06).toFixed(2)}s"/>`);
    }
    if(k===3){ // rinse: a shower head pours warm water over everything
      const sy=Math.max(-4,G.head-40);
      html+=at(100,sy,showG(1.28,.82,zg(Zh,SHOWER)));
      for(let i=0;i<22;i++){const x=(((i*41)%34)-17),d=1.42+(i%11)*.055;
        html+=at(100+x,sy+2,`<path d="${DROP}" fill="#9fe0f5" class="fx-rain" style="--d:${d.toFixed(2)}s;--fall:${(G.mid+G.h*.3-sy).toFixed(0)}px"/>`)}
      for(let i=0;i<5;i++)html+=at(100+(i-2)*G.w*.45,G.mid+G.h*.75,`<ellipse rx="5" ry="1.6" fill="#9fe0f5" class="fx-pop" style="--d:${(1.6+i*.07).toFixed(2)}s"/>`);
    }
    if(k>=2){ // blow-dry from the side: warm air lines, fur ruffles, a fluffy shine
      const d0=k===2?1.32:2.0,dx=Math.min(100+G.w+30,232),dy=G.mid-G.h*.15;
      html+=at(dx,dy,`<g class="fx-dryer" style="--d:${d0}s;--t:1.05s">${zg(Zh,DRYER)}</g>`);

        html+=at(dx-22,dy+yy-2,`<g class="fx-show" style="--d:${(d0+.12+i*.04).toFixed(2)}s;--t:.85s"><path d="M0 0q${-len/2} ${(i-1.5)*4} ${-len} ${(i-1.5)*9}" stroke="#fff3d6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="7 9" class="fx-dash" opacity=".75"/></g>`)}
      for(let i=0;i<7;i++){const a=Math.PI*(.7+i*.09);
        html+=at(100-G.w*.4,G.mid-G.h*.3,`<path d="M0 0q2 -3 0 -6" stroke="hsl(${h},55%,78%)" stroke-width="1.6" fill="none" stroke-linecap="round" class="fx-spark" style="--dx:${(Math.cos(a)*30).toFixed(1)}px;--dy:${(Math.sin(a)*-22).toFixed(1)}px;--d:${(d0+.3+i*.08).toFixed(2)}s"/>`)}
      const fin=d0+1.05;
      html+=burstAt(100,G.mid-G.h*.2,8,G.w*.9,fin-.05,'#fff3b0');
      if(k===3){html+=burstAt(G.hx,G.head-8,6,28,fin+.1,'#e8f6ff',STAR5(3.2));
        html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#79c6f2" class="fx-glow2" style="--d:${(fin-.15).toFixed(2)}s"/>`)}
    }
  }

  if(mode==='tend'){
    const nx=Math.min(100+G.w+22,228),ny=G.head-18;
    if(k===0){
      html=at(nx,ny,`<g class="fx-spray">${zg(Zh,SPRAY)}</g>`);
      for(let i=0;i<7;i++){const tx=-(G.w*.6+((i*13)%26)),ty=G.h*.2+((i*29)%34)-10;html+=at(nx-12,ny-2,`<circle r="${1.6+(i%3)*.7}" fill="#cdeef6" class="fx-mist" style="--dx:${tx.toFixed(0)}px;--dy:${ty.toFixed(0)}px;--d:${(.2+(i%4)*.09).toFixed(2)}s"/>`)}

    }
    if(k===1){ // pump mister: a pressure tank on the floor, a wand, two long fine clouds
      const tx0=Math.min(100+G.w+40,240);
      html=at(tx0,170,showG(0,1.45,`<rect x="-10" y="-30" width="20" height="30" rx="7" fill="#5ea873"/><rect x="-3" y="-38" width="6" height="9" rx="2" fill="#3f7a52"/><rect x="-8" y="-42" width="16" height="4" rx="2" fill="#3f7a52"/><path d="M-6 -20h12" stroke="#8fd6a0" stroke-width="2"/><path d="M-10 -12 C-30 -10 -24 ${(ny-170+10).toFixed(0)} ${(nx-tx0+4).toFixed(0)} ${(ny-170+6).toFixed(0)}" stroke="#2f5e40" stroke-width="2.4" fill="none"/>`));
      html+=at(nx,ny,`<g class="fx-show" style="--d:.05s;--t:1.35s"><g transform="rotate(-20)"><rect x="-4" y="-3" width="20" height="6" rx="3" fill="#8fd6a0"/><rect x="-14" y="-2" width="12" height="4" rx="2" fill="#5ea873"/><circle cx="-15" r="2.6" fill="#3f7a52"/></g></g>`);
      [.25,.75].forEach((w,j)=>{
        for(let q=0;q<4;q++)html+=at(nx-16,ny+4,`<circle r="${(6+q*2.5).toFixed(1)}" fill="#e2f6fb" fill-opacity=".45" class="fx-mist" style="--dx:${(-G.w*(.35+q*.25)).toFixed(0)}px;--dy:${(q*7-4).toFixed(0)}px;--d:${(w+q*.05).toFixed(2)}s"/>`);
        for(let i=0;i<10;i++){const tx=-(G.w*.7+((i*17)%36)),ty=G.h*.25+((i*29)%40)-14;html+=at(nx-16,ny+4,`<circle r="${1.4+(i%3)*.6}" fill="#e2f6fb" class="fx-mist" style="--dx:${tx.toFixed(0)}px;--dy:${ty.toFixed(0)}px;--d:${(w+(i%5)*.06).toFixed(2)}s"/>`)}});
      html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#8fd6a0" class="fx-glow2" style="--d:.6s"/>`);
    }
    if(k===2){ // fog humidifier: a little leafy fogger on the floor fills the tank with soft cloud
      const fx0=Math.max(100-G.w-34,-26);
      html=at(fx0,170,showG(0,2.15,`<rect x="-15" y="-30" width="30" height="30" rx="10" fill="#e6f1ed"/><rect x="-15" y="-12" width="30" height="12" rx="6" fill="#8fd6a0"/><ellipse cy="-30" rx="9" ry="3" fill="#b9cfc8"/><path d="M-4 -19c0-5 4-7 8-7-1 5-3 7-8 7z" fill="#5ea873"/><circle cx="8" cy="-6" r="1.6" fill="#e6f1ed"/>`));
      for(let i=0;i<12;i++){const d=.25+i*.11,tx=(100-fx0)*(.4+((i*37)%60)/100),ty=-(((i*23)%30)+(170-G.mid)*.45);
        html+=at(fx0,140,`<circle r="${(9+(i%4)*3).toFixed(0)}" fill="#dff3ef" class="fx-fog" style="--dx:${tx.toFixed(0)}px;--dy:${ty.toFixed(0)}px;--d:${d.toFixed(2)}s"/>`)}
      for(let i=0;i<8;i++)html+=at(100+(i-3.5)*G.w*.28,G.mid-G.h*.3+((i*13)%14),`<path d="${DROP}" fill="#cdeef6" class="fx-pop" style="--d:${(1.1+i*.07).toFixed(2)}s"/>`);
      html+=at(100,G.mid,`<ellipse rx="${(G.w+16).toFixed(0)}" ry="${(G.h+14).toFixed(0)}" fill="#8fd6a0" class="fx-glow2" style="--d:1.0s;animation-duration:1.6s"/>`);
    }
    if(k===3){ // a smiling rain cloud: gentle rain, then a rainbow
      const cy=Math.max(-2,G.head-46);
      html=at(100,cy,showG(0,1.9,`<g class="dk-bob"><circle cx="-16" cy="2" r="11" fill="#e6f1ed"/><circle cx="0" cy="-6" r="15" fill="#f4faf8"/><circle cx="17" cy="1" r="12" fill="#e6f1ed"/><rect x="-26" y="2" width="54" height="11" rx="5.5" fill="#e6f1ed"/><circle cx="-6" cy="0" r="1.8" fill="#28434a"/><circle cx="6" cy="0" r="1.8" fill="#28434a"/><path d="M-3.5 4q3.5 3 7 0" stroke="#28434a" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="-11" cy="4" r="2.4" fill="#f28bb0" opacity=".5"/><circle cx="11" cy="4" r="2.4" fill="#f28bb0" opacity=".5"/></g>`));
      for(let i=0;i<26;i++){const x=(((i*37)%48)-24),d=.4+(i%13)*.085;
        html+=at(100+x,cy+14,`<path d="${DROP}" fill="#9fe0f5" class="fx-rain" style="--d:${d.toFixed(2)}s;--fall:${(G.mid-cy-6).toFixed(0)}px"/>`)}
      const R0=G.w+30,ay=G.mid+G.h*.25,cols=['#f08a8a','#f4a259','#f5d65b','#8fd6a0','#79c6f2','#c79bf2'];
      cols.forEach((col,i)=>{const r=R0-i*4;html+=at(100,ay,`<path pathLength="100" d="M${-r} 0A${r} ${(r*.95).toFixed(0)} 0 0 1 ${r} 0" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round" class="fx-arc" style="--d:${(1.45+i*.04).toFixed(2)}s"/>`)});
      html+=burstAt(100-R0+4,ay-4,5,14,2.0,'#fff3b0')+burstAt(100+R0-4,ay-4,5,14,2.05,'#fff3b0')+burstAt(100,ay-R0,6,18,1.9,'#fff6d6',STAR5(3.2));
      html+=at(100,G.mid,`<ellipse rx="${(G.w+16).toFixed(0)}" ry="${(G.h+14).toFixed(0)}" fill="#8fd6a0" class="fx-glow2" style="--d:1.5s;animation-duration:1.4s"/>`);
    }
  }
  if(P)html=playFX(P,c);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=html;g.setAttribute('class','scene');g.dataset.m=mode;fx.appendChild(g);
  const sc=fx.querySelectorAll('.scene');if(sc.length>5)sc[0].remove();
  setTimeout(()=>g.remove(),life);
}

// A 4-point sparkle and a 5-point star, as path data around 0,0
const SPK=r=>`M0 ${-r}Q${r*.2} ${-r*.2} ${r} 0Q${r*.2} ${r*.2} 0 ${r}Q${-r*.2} ${r*.2} ${-r} 0Q${-r*.2} ${-r*.2} 0 ${-r}Z`;
const STAR5=r=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;d+=(i?'L':'M')+(Math.cos(a)*q).toFixed(1)+' '+(Math.sin(a)*q).toFixed(1)}return d+'Z'};
const burstAt=(x,y,n,rad,d,fill,shape=SPK(3.5))=>{let h='';for(let j=0;j<n;j++){const a=j/n*Math.PI*2+.3;h+=at(x,y,`<path class="fx-spark" style="--dx:${(Math.cos(a)*rad).toFixed(1)}px;--dy:${(Math.sin(a)*rad).toFixed(1)}px;--d:${d.toFixed(2)}s" d="${shape}" fill="${fill}"/>`)}return h};
function playFX(p,c){
  const h=c.hue;let html='';
  if(p.id==='ball'){
    html=at(G.hx,G.head-10,`<g class="fx-ball2"><circle r="11" fill="#f5d65b"/><path d="M-11 -2c7 4 15 4 22 0M-9 6c6-3 12-3 18 0" stroke="#b3912a" stroke-width="2" fill="none"/><circle cx="-4" cy="-5" r="2.6" fill="#fff" opacity=".5"/></g>`);
    [.52,1.22,1.91].forEach((d,k)=>{
      html+=at(G.hx,G.head-16,`<circle r="8" fill="none" stroke="#fff3b0" stroke-width="2" class="fx-ring" style="--d:${d}s"/>`);
      html+=burstAt(G.hx+(k-1)*8,G.head-20,4,20,d,'#f5d65b');
    });
    html+=burstAt(G.hx+18,G.head-14,6,26,2.32,'#fff3b0');
  }
  if(p.id==='bubbles'){
    const wx=100-G.w-28,wy=G.mid-4;
    html=at(wx,wy,`<g class="fx-wand"><path d="M2 9 L-12 46" stroke="#c9a46a" stroke-width="4" stroke-linecap="round"/><circle r="9" fill="#9fe0f5" fill-opacity=".15" stroke="#9fe0f5" stroke-width="3"/></g>`);
    for(let i=0;i<8;i++){
      const d=.25+i*.2,t=1.3+(i%3)*.15,tx=100+(((i*53)%100)/100-.42)*G.w*1.8,ty=G.head-26+((i*37)%40)-12,r=5+(i%3)*2.4;
      html+=at(wx,wy,`<g class="fx-bub" style="--dx:${(tx-wx).toFixed(0)}px;--dy:${(ty-wy).toFixed(0)}px;--d:${d.toFixed(2)}s;--t:${t.toFixed(2)}s;--wb:${i%2?9:-9}px"><circle r="${r}" fill="hsl(${(h+i*45)%360},85%,82%)" fill-opacity=".2" stroke="#e8f8ff" stroke-width="1.3"/><path d="M${(-r*.55).toFixed(1)} ${(-r*.1).toFixed(1)}a${(r*.6).toFixed(1)} ${(r*.6).toFixed(1)} 0 0 1 ${(r*.45).toFixed(1)} ${(-r*.42).toFixed(1)}" stroke="#fff" stroke-width="1.2" fill="none" opacity=".85"/></g>`);
      html+=burstAt(tx,ty,4,r*1.9,d+t*.92,'#e8f8ff','M0 -1.6a1.6 1.6 0 1 0 0.01 0z');
    }
  }
  if(p.id==='feather'){
    html=at(G.hx,G.head-24,`<g class="fx-feather"><path d="M0 -12 Q30 -90 80 -200" stroke="#c9a46a" stroke-width="2" fill="none" opacity=".75"/><g class="fx-flut"><path d="M0 -12 C14 -6 16 14 4 32 C2 18 -11 8 -8 -4 C-6 -10 -3 -12 0 -12z" fill="#f28bb0"/><path d="M0 -10 Q3 10 4 32" stroke="#c95f86" stroke-width="1.3" fill="none"/><path d="M-6 0l5 3M-5 9l6 3M10 0l-7 4M10 10l-6 4" stroke="#fbd0e0" stroke-width="1.2"/></g></g>`);
    html+=burstAt(G.hx,G.head-14,6,22,1.6,'#fbd0e0','M0 -2.2a2.2 2.2 0 1 0 0.01 0z');   // fluff flies on the pounce
    [[-16,2.85],[14,3.0],[0,2.7]].forEach(([dx,d])=>{html+=at(G.hx+dx*.6,G.head-8,`<path class="fx-rise" style="--dx:${dx}px;--d:${d}s" d="M0 6 C-9 0 -8 -7 -3.5 -7 C-1.5 -7 0 -5 0 -4 C0 -5 1.5 -7 3.5 -7 C8 -7 9 0 0 6z" fill="#f28bb0"/>`)});
  }
  if(p.id==='hoop'){
    const J=Math.round(Math.min(95,Math.max(55,G.h*1.5))),rx=G.w+16,ry=rx*.32,hy=G.mid-J;
    html=at(100,hy,`<g class="fx-hoop"><ellipse rx="${rx.toFixed(0)}" ry="${ry.toFixed(0)}" fill="none" stroke="#c79bf2" stroke-width="5"/><ellipse rx="${rx.toFixed(0)}" ry="${ry.toFixed(0)}" fill="none" stroke="#f3e4ff" stroke-width="1.6" stroke-dasharray="6 9" class="fx-dash"/></g>`);
    html+=burstAt(100,hy,10,rx*.9,1.22,'#f3e4ff');
    for(let i=0;i<16;i++){const dx=((i*41)%140)-70,dy=-40-((i*29)%55);
      html+=at(100,166,`<rect x="-2" y="-4" width="4" height="8" rx="1" fill="hsl(${(i*47+h)%360},85%,68%)" class="fx-conf" style="--dx:${dx}px;--dy:${dy}px;--d:${(1.96+(i%4)*.03).toFixed(2)}s"/>`)}
  }
  if(p.id==='stars'){
    html=`<defs><linearGradient id="fxsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090526" stop-opacity=".8"/><stop offset="1" stop-color="#090526" stop-opacity="0"/></linearGradient></defs><rect x="-60" y="-20" width="320" height="${(G.head+40).toFixed(0)}" fill="url(#fxsky)" class="fx-night"/>`;
    for(let i=0;i<10;i++){const x=((i*67)%280)-40,y=-6+((i*31)%Math.max(30,G.head));html+=at(x,y,`<path d="${SPK(1.6+(i%3)*.8)}" fill="#fff6d6" class="fx-twk" style="--d:${(i*.07).toFixed(2)}s"/>`)}
    [[130,-120,.2],[-130,-100,.9],[70,-150,1.6]].forEach(([sx,sy,d])=>{
      html+=at(G.hx,G.head-8,`<g class="fx-shoot" style="--sx:${sx}px;--sy:${sy}px;--d:${d}s"><path d="M0 0L${sx*.45} ${sy*.45}" stroke="#f1c46b" stroke-width="4" stroke-linecap="round" opacity=".45"/><path d="M0 0L${sx*.3} ${sy*.3}" stroke="#fff6d6" stroke-width="1.6" stroke-linecap="round"/><path d="${STAR5(8)}" fill="#fff3b0" stroke="#f1c46b" stroke-width="1.5" stroke-linejoin="round"/></g>`);
      const a=d+.53;html+=at(G.hx,G.head-10,`<circle r="9" fill="none" stroke="#f1c46b" stroke-width="2" class="fx-ring" style="--d:${a.toFixed(2)}s"/>`)+burstAt(G.hx,G.head-10,5,22,a,'#fff3b0');
    });
    const orR=G.w+18;let orb='';for(let i=0;i<6;i++){const a=i*Math.PI/3;orb+=at(Math.cos(a)*orR,Math.sin(a)*orR*.9,`<path d="${STAR5(5.5)}" fill="#f1c46b" stroke="#fff3b0" stroke-width="1"/>`)}
    html+=at(100,G.mid,`<g class="fx-orbit" style="--d:2.2s">${orb}</g>`);
    html+=at(100,G.mid,`<ellipse rx="${(G.w+16).toFixed(0)}" ry="${(G.h+14).toFixed(0)}" fill="#f1c46b" class="fx-glow2" style="--d:2.3s"/>`);
    html+=burstAt(G.hx,G.head-6,10,40,3.1,'#fff3b0',STAR5(4));
  }
  return html;
}

  +`<button class="mode cardbtn" id="cardTray" aria-label="Open this pet's card: stats and rehoming"><span class="ring">${ic('card')}</span><span class="lb">Card</span><span class="pc">Info</span></button>`;

// ---------- play toy picker: press and hold Play to fan out the toys this pet can use ----------
// Quick tap = play with the current toy. Hold ~0.4s = a fan of toys opens above the button; slide onto one and let go,
// or let go anywhere and tap one. Toys above this pet's rarity show locked.
let holdT=0,radial=null,suppressPlayClick=false;
const playBtn=$('mode-play');
playBtn.insertAdjacentHTML('beforeend','<span class="more" aria-hidden="true"></span>');
playBtn.setAttribute('aria-haspopup','menu');
playBtn.addEventListener('contextmenu',e=>e.preventDefault());
const endHold=()=>{clearTimeout(holdT);holdT=0;playBtn.classList.remove('holding')};
playBtn.addEventListener('pointerdown',e=>{
  suppressPlayClick=false;

// ---------- Molting: Peel the Shell ----------
// At each molt level growth waits until the pet molts. The pet sits inside a cocoon shaped exactly like it (its own
// drawing recoloured as silk, stone or metal by rarity). Cracks appear that outline one piece of the cocoon at a time:
// edge chips first, then the core. Trace a crack before it seals and that piece falls away, showing the pet beneath.
// Each crack is graded; the molt score is the average. One try per molt. The grade (MOLT_GR) lasts until the next molt.
// No CSS filters anywhere here: re-filtering a big creature drawing can run a phone out of graphics memory (white screen).
// No SVG mask and no motion under the cocoon either: Android Chrome redraws masked layers under moving content
// unreliably, which made the cocoon flicker. The cocoon is one clip path (the pieces still attached) over a still pet.
// Tuning: waves are [cracks, seconds a crack stays open, seconds between cracks appearing].
const ML_WAVES=[[2,6.6,1.2],[3,5.5,1],[3,4.6,.9],[4,4,.75],[5,3.3,.6]];

const ML_PTS={perfect:100,clean:75,sloppy:50,sealed:0};
const ML_NAME={perfect:'Perfect!',clean:'Clean',sloppy:'Sloppy',sealed:'Sealed'};
const ML_COL={perfect:'#7fd6c2',clean:'#e6f1ed',sloppy:'#f1b35b',sealed:'#f08a8a'};
// Perfect: finger stays within ~7px of the crack on average AND it's peeled in the first 60% of its time. Clean: within ~14px.
const ML_PERFECT_DEV=7,ML_CLEAN_DEV=14,ML_PERFECT_TIME=.6,ML_REACH=24,ML_DONE=.9;
// Cocoon looks: silk for Common/Uncommon, stone for Rare/Epic, metal for Legendary.
const ML_MAT=[
 {n:'silk', base:'#7a5634',a:'#a8804f',b:'#5a3c22',rim:'#3e2814',chip:['#a8804f','#7a5634','#d8b88a']},
 {n:'stone',base:'#7c8489',a:'#a9b1b6',b:'#596166',rim:'#3a4044',chip:['#a9b1b6','#7c8489','#d6dbde']},
 {n:'metal',base:'#9aa3b0',a:'#e4e9f0',b:'#6c7480',rim:'#454b55',chip:['#e4e9f0','#c9a24a','#9aa3b0']}];
const mlMat=c=>ML_MAT[c.r>=4?2:c.r>=2?1:0];
let ML=null;

let onSheetClose=null;
// key: when the same menu is redrawn (e.g. after a purchase) its scroll position is kept instead of jumping to the top.
function sheet(html,key){
  const l=$('layer'),old=l.querySelector('.sheet'),keep=key&&old&&l.dataset.key===key?old.scrollTop:0;l.dataset.key=key||'';
  // A screen being replaced (e.g. by the Back button) still gets its closing step: an uncracked rock cracks on its own,
  // an unnamed pet keeps the name typed so far. Without this, the next rock bought overwrote the first one's creature.
  if(onSheetClose){const f=onSheetClose;onSheetClose=null;try{f()}catch(e){console.error(e)}}
  l.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  l.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);
  return keep;
}
// Call after the sheet's content is filled in, so there is enough height to scroll back to.
const keepScroll=v=>{const s=$('layer').querySelector('.sheet');if(s&&v)s.scrollTop=v};

// ---------- clock ----------
let last=performance.now(),saveT=0,hubT=0;
function tick(){
  if(RETIRED)return;
  const now=performance.now(),gap=(now-last)/1000;last=now;
  // The page was paused (phone app in the background, throttled tab). Count that time properly instead of dropping it.
  if(gap>20){try{offlineCatchUp(gap)}catch(e){console.error('Catch-up failed',e)}save();stripKey='';artKey='';render(true);return}
  const dt=Math.min(gap,5);
  for(const t of S.tanks){const c=t.c;if(!c)continue;
    const dd=ONLINE_DECAY*dt*moltFx(c).on;for(const k in c.needs)c.needs[k]=Math.max(0,c.needs[k]-dd);
    if(!c.done)handleUps(gainXP(c,dt*SPD()*growthMult(c)),t);
    if(c.egg){c.egg.left-=dt*SPD();if(c.egg.left<=0)hatchEgg(t)}
  }
  for(const sh of S.ships)if(sh.m){sh.m.left-=dt*SPD();if(sh.m.left<=0)missionReturn(sh)}
  S.cash+=totalPerHour()*dt*SPD()/3600;
  saveT+=dt;if(saveT>5){saveT=0;save()}
  hubT+=dt;if(hubT>1&&$('hubBody')&&hubTab==='missions'){hubT=0;liveMissions($('hubBody'))}
  render();
}
try{offlineCatchUp()}catch(e){console.error('Offline catch-up failed',e)}
save();
setInterval(tick,250);
// Coming back to the game: pick up anything another copy saved, then catch up on the time spent away.
function resume(){
  if(RETIRED)return;
  if(lostLock()){retire();return}
  if(adoptNewer()){stripKey='';artKey='';}
  try{offlineCatchUp()}catch(e){console.error('Catch-up failed',e)}
  last=performance.now();save();render(true);
}
document.addEventListener('visibilitychange',()=>{SND.pause(document.hidden);if(document.hidden)save();else resume()});
window.addEventListener('pageshow',e=>{if(e.persisted)resume()});
// Another tab or window of the game saved: switch to its newer progress right away.
window.addEventListener('storage',e=>{if(RETIRED)return;if(e.key===OWNER_KEY&&e.newValue&&e.newValue!==TAB_ID){retire();return}if(e.key===KEY&&adoptNewer()){stripKey='';artKey='';render(true)}});
window.addEventListener('pagehide',save);

// ---------- one copy at a time ----------
// Only the most recently opened copy of the game plays. Opening it in a new tab (or reopening the artifact) claims it;
// any older copy still open shows a "playing elsewhere" screen, goes silent, and stops ticking and saving.
// Two signals so it works everywhere: a BroadcastChannel for an instant handoff, and a stored owner id that a copy
// waking up from the background (phones freeze tabs and miss messages) checks before it carries on.
const OWNER_KEY=KEY+':owner';
const TAB_ID=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let ownerBC=null;
function lostLock(){try{const o=localStorage.getItem(OWNER_KEY);return !!o&&o!==TAB_ID}catch(e){return false}}
function retire(){
  if(RETIRED)return;RETIRED=true;
  try{SND.musicStop();SND.pause(true)}catch(e){}
  try{if(ownerBC)ownerBC.close()}catch(e){}
  try{document.getElementById('app').style.visibility='hidden';$('layer').innerHTML=''}catch(e){}
  try{const fz=document.getElementById('fz');if(fz)fz.remove();FZ=null}catch(e){}
  try{const ml=document.getElementById('ml');if(ml){cancelAnimationFrame(ML&&ML.raf);ml.remove()}ML=null}catch(e){}
  const d=document.createElement('div');
  d.setAttribute('role','alertdialog');d.setAttribute('aria-labelledby','elseT');
  d.style.cssText='position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:var(--void);color:var(--ink);font-family:var(--body);text-align:center';
  d.innerHTML='<div style="max-width:320px;display:grid;gap:12px;justify-items:center">'+
    '<svg viewBox="0 0 24 24" class="ic" style="width:44px;height:44px;color:var(--bloom)"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>'+
    '<h2 id="elseT" style="margin:0;font-family:var(--display);font-weight:600;font-size:22px">Playing in another tab</h2>'+
    '<p style="margin:0;color:var(--muted);line-height:1.45">ChillAlien was opened somewhere newer, so this copy has paused. Your creatures are safe and keep going over there.</p>'+
    '<button type="button" id="playHere" style="margin-top:6px;padding:11px 20px;border-radius:14px;border:0;background:var(--bloom);color:var(--dark);font-weight:700;font-size:15px">Play here instead</button>'+
    '</div>';
  document.body.appendChild(d);
  // Reloading makes this the newest copy: it loads the latest save and the other tab steps aside.
  d.querySelector('#playHere').onclick=()=>location.reload();
}
function claimLock(){
  try{localStorage.setItem(OWNER_KEY,TAB_ID)}catch(e){}
  try{ownerBC=new BroadcastChannel(OWNER_KEY);
    ownerBC.onmessage=m=>{if(m.data&&m.data.claim&&m.data.claim!==TAB_ID)retire()};
    ownerBC.postMessage({claim:TAB_ID});
  }catch(e){}
}
claimLock();

// ---------- back button ----------
// The phone/browser Back button used to leave (and reload) the page. Now it steps back inside the game:
// open menu -> previous menu screen (e.g. creature page -> Critterpedia) -> closes the menu -> previous tank you visited.
// A history "guard" entry is kept on top so Back never navigates the page away.
const screenStack=[];let screen=null,screenBacking=false;
function trackScreen(name,fn){
  return function(...a){
    if(name==='hub'&&a[0]==null)a=[hubTab];   // remember which tab, so going back reopens that exact tab
    const key=name+':'+(a[0]==null?(name==='hub'?hubTab:''):a[0]),open=!!$('layer').innerHTML;
    if(!screenBacking&&open&&screen&&screen.key!==key){
      const top=screenStack[screenStack.length-1];
      if(top&&top.key===key)screenStack.pop();          // an in-menu "Back" button: treat as stepping back
      else{screenStack.push(screen);if(screenStack.length>20)screenStack.shift()}
    }
    if(!open)screenStack.length=0;
    screen={key,go:()=>fn(...a)};
    return fn(...a);
  };
}
openCard=trackScreen('card',openCard);openHub=trackScreen('hub',openHub);openTankSheet=trackScreen('tank',openTankSheet);openBgSheet=trackScreen('bg',openBgSheet);openDex=trackScreen('dex',openDex);openPlush=trackScreen('plush',openPlush);
$('openCard').onclick=()=>openCard();
const tankTrail=[];let navLast=S.active,tankBacking=false;
const _render=render;
render=function(f){
  if(S.active!==navLast){
    if(!tankBacking&&navLast!=null&&navLast<S.tanks.length&&tankTrail[tankTrail.length-1]!==navLast){tankTrail.push(navLast);if(tankTrail.length>40)tankTrail.shift()}
    navLast=S.active;
  }
  return _render(f);
};
function goBack(){
  if(FZ){const x=$('fzX');if(x)x.click();return}
  if(ML){if(ML.state==='play'){const x=$('mlX');if(x)x.click()}else if(ML.state!=='count')mlClose();return}
  if($('layer').innerHTML){
    const prev=screenStack.pop();
    if(prev){screenBacking=true;try{prev.go()}finally{screenBacking=false}}
    else{screen=null;close()}
    return;
  }
  const tk=$('tank');
  while(tankTrail.length){
    const to=tankTrail.pop();
    if(to===S.active||to>=S.tanks.length)continue;
    const dir=to<S.active?-1:1;
    tankBacking=true;try{S.active=to;save();render(true)}finally{tankBacking=false}
    tk.classList.remove('slide-l','slide-r','edge-l','edge-r');void tk.offsetWidth;tk.classList.add(dir>0?'slide-l':'slide-r');
    const chip=document.querySelector(`#tankStrip [data-tank="${to}"]`);if(chip)chip.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
    return;
  }
  // Nothing left to go back to: a little bump so it's clear Back was heard, and the game stays put.
  tk.classList.remove('edge-l','edge-r');void tk.offsetWidth;tk.classList.add('edge-l');
}
// Keep the screen trail in sync when a menu is closed by Done / tapping outside.
document.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target.id==='scrim'){screen=null;screenStack.length=0}},true);
// Back-button buffer: a stack of in-page history entries the Back button walks down instead of leaving the page.
// Phones skip history entries that were added without a tap, so entries are only ever added during a tap or key press
// (never right after a Back), and the stack is kept deep so many Backs in a row still stay inside the game.
const GUARD_MAX=40;
const guardDepth=()=>{try{const s=history.state;return s&&s.chillG||0}catch(e){return 0}};
// Refill to the top on every tap (only the missing entries, so usually zero or one push), so a long run of Backs never runs dry.
function topUpGuard(){try{for(let d=guardDepth();d<GUARD_MAX;d++)history.pushState({chillG:d+1},'')}catch(e){}}
['pointerdown','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,topUpGuard,true));
// Music can only start after a tap; every tap makes sure it's playing (cheap no-op once it is).
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!RETIRED)try{SND.musicSync()}catch(e){}},true));
window.addEventListener('popstate',()=>{
  try{goBack()}catch(e){console.error('Back failed',e)}
});
render(true);
})();
</script>
