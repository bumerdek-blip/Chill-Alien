<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChillAlien Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Icons support words, never replace them. Care actions play out inside the tank. Single dark "terrarium at night" world by choice. */
:root{
  --void:#0b1517;
  --glass:#12272a;
  --glass-2:#183337;
  --glass-3:#21424a;
  --rim:rgba(170,220,210,.16);
  --ink:#e6f1ed;
  --muted:#8ea7a1;
  --bloom:#7fd6c2;
  --amber:#f1b35b;
  --rose:#f08a8a;
  --dark:#0b1d1a;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 12px;display:flex;flex-direction:column;gap:9px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--bloom);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-.15em}
.amt{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.cost{color:var(--amber)}
.rb{display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
.rb .ic{width:16px;height:16px}
.pips{display:inline-flex;gap:2px}
.pips i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pips i.off{opacity:.22}
.face{width:1em;height:1em;flex:none}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;gap:8px}
.who{flex:1;min-width:0;display:grid;gap:2px;background:none;border:0;padding:0;text-align:left}
.who .nm{font-family:var(--display);font-weight:600;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.who .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
@media (max-width:420px){.who .sub .rb{font-size:0;gap:0}.who .sub .rb .ic{font-size:12px}}
.who .sub b{color:var(--ink);font-weight:600}
.cash{display:grid;justify-items:end;background:var(--glass);border:1px solid var(--rim);border-radius:14px;padding:4px 10px 4px 8px;line-height:1.15}
.cash .amt{font-size:17px;color:var(--amber)}
.cash .amt .ic{width:17px;height:17px}
.cash .rate{font-size:11px;color:var(--muted);font-weight:600}
.fbx{display:grid;justify-items:center;background:var(--glass);border:1px solid var(--rim);border-radius:14px;padding:4px 9px;line-height:1.15}
.fbx .amt{font-size:17px;color:#f6a0c0}
.fbx .amt .ic{width:17px;height:17px}
.fbx .lbl{font-size:11px;color:var(--muted);font-weight:600}
.amt.fb,.amt.fb.cost{color:#f6a0c0}
.amt.fb.short{color:var(--rose)}
.primary .amt.fb{color:#6b1d44}.primary .amt.fb.short{color:#8a1a1a}
.menubtn{position:relative;display:grid;justify-items:center;gap:1px;padding:5px 9px;border-radius:13px;background:var(--glass);border:1px solid var(--rim);font-size:11px;font-weight:700;color:var(--bloom)}
.menubtn .ic{width:21px;height:21px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:99px;background:var(--rose);color:#1a0d0d;font-size:11px;font-weight:700;display:grid;place-items:center}

/* tank strip */
.tanks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;flex:none}
.tanks::-webkit-scrollbar{display:none}
.tk{position:relative;flex:none;display:flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border-radius:14px;background:var(--glass);border:1px solid var(--rim);font-size:12px;color:var(--muted);white-space:nowrap;text-align:left}
.tk b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.tk[aria-current="true"]{border-color:var(--bloom);background:var(--glass-2);box-shadow:0 0 0 1px var(--bloom) inset}
.mf{width:30px;height:30px;border-radius:50%;border:2px solid;box-sizing:border-box;background:var(--void);display:grid;place-items:center;overflow:hidden;flex:none}
.mf svg{width:84%;height:84%}
.tk .tki{font-size:24px;line-height:0}
.tk .flag{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--rose);border:2px solid var(--void)}
.tk.add{color:var(--bloom);font-weight:700;font-size:13px;padding:4px 12px}

/* tank */
.tank{position:relative;flex:1;min-height:200px;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,rgba(127,214,194,.10),transparent 60%),linear-gradient(var(--glass),#0e2023);
  border:1px solid var(--rim);box-shadow:inset 0 0 0 6px rgba(255,255,255,.015),inset 0 -40px 60px rgba(0,0,0,.35);touch-action:manipulation;user-select:none}
.tank{touch-action:pan-y}
.tank.slide-l .stage,.tank.slide-l .decor{animation:slidein .32s cubic-bezier(.2,.8,.3,1)}
.tank.slide-r .stage,.tank.slide-r .decor{animation:slideinr .32s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideinr{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.tank.edge-l{animation:edgel .3s ease-out}
.tank.edge-r{animation:edger .3s ease-out}
@keyframes edgel{40%{transform:translateX(10px)}}
@keyframes edger{40%{transform:translateX(-10px)}}
.tank::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.06) 0 12%,transparent 12% 100%)}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.decor::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 42%,transparent 58%,rgba(0,0,0,.42))}
.dk-sway{transform-box:fill-box;transform-origin:50% 100%;animation:dksway 5s ease-in-out infinite}
.dk-swayt{transform-box:fill-box;transform-origin:50% 0;animation:dksway 6s ease-in-out infinite}
@keyframes dksway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.dk-tw{animation:dktw 3s ease-in-out infinite}
@keyframes dktw{50%{opacity:.4}}
.dk-fly{animation:dkfly 7s ease-in-out infinite}
@keyframes dkfly{0%,100%{transform:translate(0,0);opacity:.25}25%{transform:translate(10px,-8px);opacity:1}50%{transform:translate(-6px,-16px);opacity:.5}75%{transform:translate(-12px,-4px);opacity:1}}
.dk-bob{animation:dkbob 6s ease-in-out infinite}
@keyframes dkbob{50%{transform:translateY(-5px)}}
.dk-shaft{animation:dkshaft 7s ease-in-out infinite}
@keyframes dkshaft{50%{opacity:.35}}
.dk-aur{animation:dkaur 10s ease-in-out infinite}
.dk-bub{animation:dkbub 4.2s linear infinite}
@keyframes dkbub{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.dk-pulse{stroke-dasharray:40;animation:dkpulse 1.6s linear infinite}
@keyframes dkpulse{from{stroke-dashoffset:40}to{stroke-dashoffset:-40}}
.dk-new{animation:dknew 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dknew{0%{opacity:0;transform:translateY(-18px)}60%{opacity:1}100%{transform:none}}
.dk-snow{animation:dksnow 8s linear infinite}
@keyframes dksnow{0%{transform:translate(0,0);opacity:0}8%{opacity:1}90%{opacity:.8}100%{transform:translate(var(--dx,10px),340px);opacity:0}}
.dk-across{animation:dkacross 20s linear infinite}
@keyframes dkacross{from{transform:translateX(var(--s,0px))}to{transform:translateX(var(--d,600px))}}
.dk-spin{transform-box:fill-box;transform-origin:center;animation:dkspin 80s linear infinite}
@keyframes dkspin{to{transform:rotate(360deg)}}
.dk-drift{animation:dkdrift 16s ease-in-out infinite}
@keyframes dkdrift{50%{transform:translateX(16px)}}
.dk-smoke{transform-box:fill-box;transform-origin:center;animation:dksmoke 8s ease-out infinite}
@keyframes dksmoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.6}100%{transform:translate(var(--dx,20px),-130px) scale(1.8);opacity:0}}
.dk-shoot{animation:dkshoot 8s ease-in infinite;opacity:0}
@keyframes dkshoot{0%,78%{opacity:0;transform:translate(0,0)}82%{opacity:1}96%{opacity:0;transform:translate(-150px,75px)}100%{opacity:0;transform:translate(-150px,75px)}}
.dk-swim{animation:dkswim 5s ease-in-out infinite alternate}
@keyframes dkswim{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.thgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thtier{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.thtier .thl{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.thtier .ic{width:13px;height:13px}
.thopt{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--glass-2);border:1.5px solid var(--rim);text-align:left;min-width:0}
.thopt[aria-pressed="true"]{border-color:var(--bloom);box-shadow:0 0 0 1px var(--bloom) inset}
.thopt:disabled{cursor:not-allowed}
.thopt:disabled .thpic{opacity:.32}
.thpic{display:block;aspect-ratio:16/11;border-radius:9px;overflow:hidden}
.thpic svg{display:block;width:100%;height:100%}
.thpic *{animation:none!important}
.thn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:0 3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thopt[aria-pressed="true"] .thn{color:var(--bloom)}
.thopt:disabled .thn{color:var(--muted)}
.thn .ic{width:13px;height:13px}
.upg{display:grid;gap:6px}
.upg .row{padding:8px 12px}
.upg .row .lead{font-size:22px}
.upg .ok{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bloom)}
.upg .ok .ic{width:14px;height:14px}
@keyframes dkaur{0%,100%{opacity:.55;transform:translateX(0)}50%{opacity:1;transform:translateX(12px)}}
/* tank frames get fancier with tier */
.tank[data-tier="0"]{border-color:rgba(241,179,91,.28)}
.tank[data-tier="1"]{border-color:rgba(143,214,160,.32)}
.tank[data-tier="2"]{border-color:rgba(127,214,194,.4);box-shadow:0 0 18px -10px rgba(127,214,194,.6)}
.tank[data-tier="3"]{border-color:rgba(127,184,240,.5);box-shadow:0 0 24px -8px rgba(127,184,240,.55)}
.tank[data-tier="4"]{border:1.5px solid rgba(241,196,107,.6);box-shadow:0 0 30px -6px rgba(199,155,242,.55),0 0 0 1px rgba(127,214,194,.18)}
.tprev{flex:none;width:64px;height:44px;border-radius:10px;overflow:hidden;border:1.5px solid;display:block}
.tprev svg{display:block;width:100%;height:100%}
.tprev *{animation:none!important}
.stage{position:absolute;inset:0;display:grid;place-items:center}
.stage svg{width:100%;height:100%;overflow:visible}
.critter{transform-origin:100px 168px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) scale(1.01,.99)}}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.08,.9)}70%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.glowpulse{animation:gp 2.6s ease-in-out infinite}
@keyframes gp{50%{opacity:.35}}
/* Rare+ shimmer: cycle the glow's gradient colour only. The old version animated a CSS hue-rotate filter over the
   whole creature (which also contained an SVG blur filter); at Colossus size that re-rasterised every frame and
   could crash the page's renderer (white screen) once care animations stacked on top. */
.huestop{animation:hs 9s linear infinite}
@keyframes hs{0%,100%{stop-color:var(--ga)}33%{stop-color:var(--gb)}66%{stop-color:var(--gc)}}
.mote{animation:mote 6s linear infinite}
@keyframes mote{0%{transform:translateY(20px);opacity:0}20%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}

/* creature reactions to care */
.mouthOpen{opacity:0}
.a-eat .mouth{opacity:0}
.a-eat .mouthOpen{opacity:1}
.a-feed .critter{animation:squish .3s .36s ease-out}
.a-pet .critter{animation:lean .9s ease-in-out}
.a-pet .blink,.a-groom .blink,.a-tend .blink{animation:none;transform:scaleY(.18)}
.a-groom .critter{animation:wiggle .9s ease-in-out}
.a-play .critter{animation:hop .5s .3s ease-out}
.a-tend .critter{animation:sigh 1.1s ease-in-out}
@keyframes lean{25%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
@keyframes wiggle{20%,60%{transform:translateX(-2px) scale(1.02,.98)}40%,80%{transform:translateX(2px) scale(.98,1.02)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.06,.93)}100%{transform:none}}
@keyframes sigh{40%{transform:scale(1.04,.97)}}

/* care effects (SVG units) */
.fx *{transform-box:fill-box;transform-origin:center}
.fx-drop{animation:fxdrop .38s cubic-bezier(.55,0,1,.6) forwards}
@keyframes fxdrop{from{transform:translateY(var(--from))}to{transform:translateY(0)}}
.fx-bite{animation:fxbite .22s .36s forwards}
@keyframes fxbite{to{transform:scale(0);opacity:0}}
.fx-crumb{opacity:0;animation:fxcrumb .45s var(--d,.4s) ease-out forwards}
@keyframes fxcrumb{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.fx-stroke{animation:fxstroke .9s ease-in-out forwards}
@keyframes fxstroke{0%{transform:translate(-16px,-10px);opacity:0}15%{opacity:1;transform:translate(-14px,0)}35%{transform:translate(14px,2px)}55%{transform:translate(-12px,0)}75%{transform:translate(12px,2px);opacity:1}100%{transform:translate(10px,-12px);opacity:0}}
.fx-rise{opacity:0;animation:fxrise .8s var(--d,0s) ease-out forwards}
@keyframes fxrise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1;transform:translate(calc(var(--dx)*.3),-8px) scale(1)}100%{opacity:0;transform:translate(var(--dx),-42px) scale(.9)}}
.fx-brush{animation:fxbrush .9s ease-in-out forwards}
@keyframes fxbrush{0%{transform:translate(calc(var(--w)*-1),-6px) rotate(-12deg);opacity:0}12%{opacity:1}40%{transform:translate(var(--w),4px) rotate(10deg)}70%{transform:translate(calc(var(--w)*-.8),-2px) rotate(-8deg);opacity:1}100%{transform:translate(var(--w),4px) rotate(10deg);opacity:0}}
.fx-pop{opacity:0;animation:fxpop .55s var(--d,0s) ease-out forwards}
@keyframes fxpop{0%{opacity:0;transform:scale(.2)}40%{opacity:.95;transform:scale(1)}80%{opacity:.8;transform:scale(1.15) translateY(-6px)}100%{opacity:0;transform:scale(1.4) translateY(-10px)}}
.fx-ball{animation:fxball .95s ease-in-out forwards}
@keyframes fxball{0%{transform:translate(-120px,40px) rotate(0)}38%{transform:translate(0,0) rotate(220deg)}62%{transform:translate(40px,-48px) rotate(330deg)}100%{transform:translate(130px,50px) rotate(560deg)}}
.fx-spray{animation:fxspray 1.1s ease-in-out forwards}
@keyframes fxspray{0%{opacity:0;transform:translate(14px,-6px)}12%{opacity:1;transform:none}25%,55%{transform:scale(.94,1.04)}40%,70%{transform:none}88%{opacity:1}100%{opacity:0;transform:translate(10px,-6px)}}
.fx-mist{opacity:0;animation:fxmist .6s var(--d,.2s) ease-in forwards}
@keyframes fxmist{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
.fx-glow{opacity:0;animation:fxglow 1.1s .45s ease-out forwards}
@keyframes fxglow{30%{opacity:.5}100%{opacity:0}}

/* ---- care kits: each tool tier plays its own scene (KIT_MS). Starter/Upgraded are short; Top-tier/Pro are little routines ---- */
.fx-dropd{animation:fxdrop .38s var(--d,0s) cubic-bezier(.55,0,1,.6) both}
.fx-biteat{animation:fxbite .2s var(--b,.4s) forwards}
.fx-show{opacity:0;animation:fxshow var(--t,1s) var(--d,0s) ease-out both}
@keyframes fxshow{0%{opacity:0;transform:translateY(8px) scale(.7)}12%{opacity:1;transform:none}86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(4px) scale(.92)}}
.fx-tomouth{animation:fxtomouth .42s var(--d,0s) ease-in both}
@keyframes fxtomouth{0%{transform:translate(0,0) scale(1)}25%{transform:translate(calc(var(--dx)*.2),calc(var(--dy)*.35 - 8px)) scale(1.1)}75%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.85)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.fx-steam{opacity:0;animation:fxsteam 1.1s var(--d,0s) ease-out both}
@keyframes fxsteam{0%{opacity:0;transform:translateY(4px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-22px)}}
.fx-lift{animation:fxlift 1.05s .1s ease-in-out both}
@keyframes fxlift{0%,30%{opacity:1;transform:none}65%{opacity:1;transform:translate(16px,-34px) rotate(16deg)}100%{opacity:0;transform:translate(26px,-58px) rotate(26deg)}}
.fx-scritch{opacity:0;animation:fxscritch var(--t,.95s) var(--d,0s) ease-in-out both}
@keyframes fxscritch{0%{opacity:0;transform:translate(-4px,-14px)}12%{opacity:1;transform:translate(0,0)}20%,36%,52%,68%{transform:translate(-3px,1px)}28%,44%,60%,76%{transform:translate(3px,-1px)}86%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(4px,-14px)}}
.fx-knead{opacity:0;animation:fxknead 1.9s .05s ease-in-out both}
@keyframes fxknead{0%{opacity:0;transform:translateY(-16px)}10%{opacity:1;transform:none}20%,40%,60%,80%{transform:translateY(5px) scale(.94,1.04)}30%,50%,70%{transform:translateY(-1px)}90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
.fx-scrub{animation:fxbrush var(--t,.9s) var(--d,0s) ease-in-out both}
.fx-suds{opacity:0;animation:fxsuds var(--t,1s) var(--d,0s) ease-out both}
@keyframes fxsuds{0%{opacity:0;transform:scale(.2)}12%{opacity:.95;transform:scale(1)}82%{opacity:.9;transform:scale(1.05)}100%{opacity:0;transform:scale(1.5) translateY(-8px)}}
.fx-dryer{opacity:0;animation:fxdryer var(--t,1s) var(--d,0s) ease-in-out both}
@keyframes fxdryer{0%{opacity:0;transform:translate(26px,6px)}12%{opacity:1;transform:none}24%{transform:translate(-1px,-6px)}36%{transform:translate(1px,4px)}48%{transform:translate(-1px,-5px)}60%{transform:translate(1px,5px)}72%{transform:translate(-1px,-3px)}88%{opacity:1;transform:none}100%{opacity:0;transform:translate(26px,6px)}}
.fx-rain{opacity:0;animation:fxrain .5s var(--d,0s) ease-in both}
@keyframes fxrain{0%{opacity:0;transform:translateY(0)}15%{opacity:.95}85%{opacity:.9}100%{opacity:0;transform:translateY(var(--fall,40px))}}
.fx-fog{opacity:0;animation:fxfog 1.3s var(--d,0s) ease-out both}
@keyframes fxfog{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:.5}70%{opacity:.4}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.7)}}
.fx-arc{stroke-dasharray:100;opacity:0;animation:fxarc 1.35s var(--d,0s) ease-out both}
@keyframes fxarc{0%{opacity:0;stroke-dashoffset:100}4%{opacity:.9;stroke-dashoffset:96}40%{opacity:.9;stroke-dashoffset:0}78%{opacity:.85;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
/* the pet's own reactions, timed to each kit's beats */
@keyframes shiver{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:translateX(-1.5px) rotate(-1deg)}20%,40%,60%,80%{transform:translateX(1.5px) rotate(1deg)}}
@keyframes knead{0%,100%{transform:none}15%,35%,55%,75%{transform:scale(1.04,.96)}25%,45%,65%,85%{transform:scale(.98,1.02)}}

.float{position:absolute;pointer-events:none;display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:16px;animation:rise 1s ease-out forwards;text-shadow:0 1px 6px rgba(0,0,0,.7);white-space:nowrap;z-index:3}

.tankinfo{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:2}
.tankbtn{position:absolute;right:10px;top:46px;z-index:4;display:inline-flex;align-items:center;gap:5px;background:rgba(11,21,23,.72);border:1px solid var(--bloom);color:var(--bloom);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}
.tankbtn .ic{width:16px;height:16px}
.tankbtn.bgbtn{top:82px}
.hud{display:inline-flex;align-items:center;gap:6px;background:rgba(11,21,23,.65);border:1px solid var(--rim);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.hud .ic{width:15px;height:15px}
.stagepips{display:inline-flex;gap:2px}
.stagepips i{width:4px;height:9px;border-radius:2px;background:var(--bloom)}
.stagepips i.off{background:rgba(255,255,255,.14)}
.tankhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;display:flex;align-items:center;gap:7px;background:rgba(11,21,23,.72);border:1px solid var(--rim);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;pointer-events:none;z-index:2;white-space:nowrap}
.tankhint .ic{width:17px;height:17px}
.tankhint span{overflow:hidden;text-overflow:ellipsis}
.gate{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:max-content;max-width:92%;z-index:3;text-align:center}
.gate .hud{font-size:13px;white-space:normal}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--bloom);color:var(--dark);border:0;border-radius:14px;padding:10px 15px;font-family:var(--display);font-weight:600;font-size:15px}
.primary .ic{width:19px;height:19px}
.primary .amt.cost{color:#5a3a06}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--glass-2);border:1px solid var(--rim);border-radius:14px;padding:10px 14px;font-weight:600}
.ghost .ic{width:18px;height:18px}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);z-index:2}
.emptybox{display:grid;gap:10px;justify-items:center;width:100%;max-width:310px;box-sizing:border-box;background:rgba(11,21,23,.72);border:1px solid var(--rim);border-radius:18px;padding:14px}
.emptybox .bigic{font-size:54px;line-height:0;opacity:.6}
.emptybox h4{margin:0;font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink)}
.btnrow{display:flex;gap:8px;width:100%}
.btnrow>*{flex:1}

/* xp rail */
.xp{display:flex;align-items:center;gap:10px}
.lvbadge{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--bloom)}
.lvbadge .ic{position:absolute;inset:0;width:100%;height:100%}
.lvbadge b{position:relative;font-family:var(--display);font-size:12px;font-weight:700;color:var(--dark);margin-top:2px}
.xpcol{flex:1;min-width:0;display:grid;gap:4px}
.xprow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.xprow b{color:var(--ink);font-weight:600}
.xprow .ic{width:13px;height:13px}
.bar{height:10px;border-radius:99px;background:var(--glass);border:1px solid var(--rim);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bloom),#b5ecdc);border-radius:99px;transition:width .25s}

/* status */
.status{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap}
.chipx b{color:var(--ink);font-weight:600}
.chipx .face{width:22px;height:22px}
.chipx .ic{width:14px;height:14px}
.fdots{display:inline-flex;gap:2px}
.fdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14)}
.fdots i.on{background:#f4a259}

/* tray */
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.mode.cardbtn{--c:var(--bloom)}
.mode.cardbtn .ring{background:var(--glass-3)}
.mode.cardbtn .ring::before{display:none}
.mode.cardbtn.ready{border-color:var(--bloom);animation:readypulse 1.6s ease-in-out infinite}
@keyframes readypulse{50%{box-shadow:0 0 0 2px rgba(127,214,194,.4)}}
.mode{position:relative;display:grid;justify-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;background:var(--glass);border:1px solid var(--rim)}
.mode:disabled{opacity:.4;cursor:not-allowed}
.ring{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:conic-gradient(var(--c) calc(var(--v,0)*1%),rgba(255,255,255,.08) 0)}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--glass)}
.ring .ic{position:relative;width:21px;height:21px}
.mode .lb{font-size:12px;font-weight:700;line-height:1}
.mode .pc{font-size:10px;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums}
.mode[aria-pressed="true"]{background:var(--glass-2);border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 0 18px -6px var(--c)}
.mode[aria-pressed="true"] .ring::before{background:var(--glass-3)}
.mode.mid .pc{color:var(--amber);font-weight:700}
.mode.low .pc{color:var(--rose);font-weight:700}
.mode.low{border-color:var(--rose);animation:lowpulse 1.4s ease-in-out infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 2px rgba(240,138,138,.35)}}

/* play toy picker: hold Play, a fan of toys opens above it */
#mode-play{touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.mode .more{position:absolute;top:5px;right:5px;display:inline-flex;flex-direction:column;gap:2px}
.mode .more i{width:4px;height:4px;border-radius:50%;background:var(--c);opacity:.8}
.mode.holding .ring{animation:holdgrow .38s linear forwards}
@keyframes holdgrow{to{transform:scale(1.14);box-shadow:0 0 16px -2px var(--c)}}
.radial{position:fixed;inset:0;z-index:15;touch-action:none;user-select:none;-webkit-user-select:none}
.radial.out{animation:rout .15s ease-in forwards;pointer-events:none}
@keyframes rout{to{opacity:0}}
@keyframes rfade{from{opacity:0}}
.radial .shade{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),rgba(3,8,9,.55),rgba(3,8,9,.86) 70%);animation:rfade .18s ease-out}
.radial .arc{position:absolute;left:var(--x);top:var(--y);width:calc(var(--rad)*2);height:calc(var(--rad)*2);margin:calc(var(--rad)*-1) 0 0 calc(var(--rad)*-1);box-sizing:border-box;border-radius:50%;border:1.5px dashed rgba(170,220,210,.22);clip-path:inset(0 0 50% 0);animation:rfade .3s ease-out;pointer-events:none}
.radial .rcap{position:absolute;left:var(--x);top:calc(var(--y) - var(--rad) - 100px);transform:translateX(-50%);display:grid;justify-items:center;gap:1px;background:rgba(11,21,23,.9);border:1px solid var(--rim);border-radius:14px;padding:5px 14px;pointer-events:none;text-align:center;white-space:nowrap;animation:rfade .25s ease-out}
.radial .rcap b{font-family:var(--display);font-weight:600;font-size:17px}
.radial .rcap span{font-size:11px;color:var(--muted);font-weight:600}
.radial .opt{position:absolute;left:var(--x);top:var(--y);width:78px;margin:-29px 0 0 -39px;display:grid;justify-items:center;gap:3px;background:none;border:0;padding:0;transform:translate(var(--ox),var(--oy));animation:rpop .34s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
@keyframes rpop{from{transform:translate(0,0) scale(.2);opacity:0}}
.radial .bub{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:2px solid var(--c);color:var(--c);box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 16px -6px var(--c);transition:transform .12s,background .12s,color .12s}
.radial .bub .ic{width:28px;height:28px}
.radial .opt .lb{font-size:11px;font-weight:700;white-space:nowrap;background:rgba(11,21,23,.88);border:1px solid var(--rim);padding:2px 8px;border-radius:99px}
.radial .opt.cur .bub{box-shadow:0 0 0 3px rgba(11,21,23,.9),0 0 0 5px var(--c),0 6px 18px rgba(0,0,0,.45)}
.radial .opt.hot .bub{transform:scale(1.2);background:var(--c);color:var(--dark)}
.radial .opt[aria-disabled="true"] .bub{border-color:var(--rim);border-style:dashed;color:var(--muted);background:var(--glass);box-shadow:none}
.radial .opt[aria-disabled="true"] .lb{color:var(--muted)}
.radial .opt[aria-disabled="true"].hot .bub{transform:scale(1.08);background:var(--glass-2);color:var(--ink)}
.radial .opt .lk{font-size:10px;font-weight:700;color:var(--rar);line-height:1}
.radial .opt.nope .bub{animation:nope .35s ease-in-out}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(3,8,9,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--glass);border:1px solid var(--rim);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:grid;gap:14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheethead h2{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sheethead h2 .ic{width:24px;height:24px;color:var(--bloom)}
.sec{display:grid;gap:8px}
.sec>h3{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.sec>h3 .ic{width:15px;height:15px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--glass-2);border:1px solid var(--rim);border-radius:14px;padding:10px 12px;text-align:left}
.row .grow{flex:1;min-width:0;display:grid;gap:3px}
.row .grow b{font-weight:600}
.row .grow .d{font-size:12px;color:var(--muted)}
.row .lead{font-size:28px;line-height:0;flex:none}
.row:disabled{opacity:.5;cursor:not-allowed}
.small{padding:7px 11px;font-size:13px;border-radius:11px}
.small .ic{width:16px;height:16px}
.note{font-size:12px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* odds */
.odds{display:grid;gap:5px;width:100%}
.obar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);gap:2px}
.obar i{display:block;height:100%}
.ochips{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12px;font-weight:600}
.ochips span{display:inline-flex;align-items:center;gap:3px}
.ochips .ic{width:13px;height:13px}

/* card */
.card{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:var(--glass-2);border:1px solid var(--rim);border-radius:18px;padding:12px}
.card.flash{animation:cardflash .8s ease-out}
@keyframes cardflash{0%{box-shadow:0 0 0 2px var(--bloom)}100%{box-shadow:0 0 0 0 transparent}}
.thumb{width:110px;height:110px;border-radius:14px;background:var(--glass);overflow:hidden}
.thumb svg{width:100%;height:100%}
.card input{width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px dashed var(--rim);color:var(--ink);font-family:var(--display);font-size:20px;font-weight:600;padding:2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.stat{display:grid;gap:1px;min-width:0}
.stat span{display:flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat span .ic{width:12px;height:12px}
.stat b{display:flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.stat b .face{width:16px;height:16px}
.needs{display:grid;gap:7px}
.nd{display:grid;grid-template-columns:20px 74px 1fr auto;align-items:center;gap:8px;font-size:13px}
.nd .ic{width:19px;height:19px;color:var(--c)}
.nd .m{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.nd .m i{display:block;height:100%;background:var(--c)}
.nd .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.ending{display:grid;gap:8px}

/* splash */
.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.splash .burst{display:grid;justify-items:center;text-align:center;animation:pop 1.6s ease-out forwards}
.splash .big{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--ink);text-shadow:0 0 30px rgba(127,214,194,.7)}
.splash .sub{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px;color:var(--bloom);margin-top:6px}
.splash .sub .ic{width:22px;height:22px}
.splash .hero{font-size:72px;line-height:0;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(127,214,194,.5))}
.splash .ring{position:absolute;width:160px;height:160px;border-radius:50%;border:3px solid var(--bloom);animation:ring 1.2s ease-out forwards;opacity:0;background:none}
@keyframes pop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--glass-2);border:1px solid var(--rim);border-radius:16px;padding:10px 14px;font-size:13px;z-index:40;width:max-content;max-width:90%;box-sizing:border-box;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast .lead{font-size:24px;line-height:0;flex:none}

/* hub tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--glass-2);border:1px solid var(--rim);border-radius:14px;padding:4px}
.tabs button{position:relative;border:0;background:none;padding:7px 2px 6px;border-radius:10px;color:var(--muted);display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tabs button .ic{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:var(--bloom);color:var(--dark)}
.tabs .badge{top:-4px;right:4px}
.prog{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--amber)}
.lock{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--rose);font-weight:600}
.lock .ic{width:14px;height:14px}
.mcard{display:grid;gap:9px;background:var(--glass-2);border:1px solid var(--rim);border-radius:16px;padding:12px}
.mhead{display:flex;align-items:center;gap:10px}
.mhead .lead{font-size:32px;line-height:0}
.mhead .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mhead .meta .ic{width:13px;height:13px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--glass-2);border:1px solid var(--rim);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bloom);color:var(--dark)}
.seg.two{grid-template-columns:1fr 1fr}
.vol{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.vol .ic{width:18px;height:18px;color:var(--bloom)}
.vol input{flex:1;accent-color:var(--bloom);height:28px}
.vol input:disabled{opacity:.4}
.mus{display:grid;gap:6px}
.mus .row{padding:8px 12px}
.mus .row[aria-pressed="true"]{border-color:var(--bloom);box-shadow:0 0 0 1px var(--bloom) inset}
.mus .row[aria-pressed="true"] b{color:var(--bloom)}
.mus .mi{font-size:20px;color:var(--bloom)}
.mus .on{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bloom);white-space:nowrap}
.mus .on .ic{width:14px;height:14px}

/* rock */
.rock{width:190px;height:170px;margin:0 auto;display:block;touch-action:manipulation;transition:transform .09s}
.taps{display:flex;justify-content:center;gap:6px}
.taps i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.12)}
.taps i.on{background:var(--amber)}
.reveal{display:grid;justify-items:center;gap:6px;text-align:center}
/* species + variant labels */
.kind{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.vchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.vchip .ic{width:12px;height:12px}
.vchip.striped{background:repeating-linear-gradient(110deg,rgba(255,255,255,.16) 0 5px,transparent 5px 10px);border:1px solid rgba(230,241,237,.35);color:var(--ink)}
.vchip.prism{background:linear-gradient(90deg,#ff9fb8,#ffd28a,#fff3a0,#a8f0b4,#8fdcff,#b9a6ff);color:#1a1530}
.vic{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
/* critterpedia */
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dexc{display:grid;justify-items:center;gap:3px;background:var(--glass-2);border:1px solid var(--rim);border-radius:14px;padding:8px 4px 7px;font-size:12px;text-align:center}
.dexc b{font-weight:600;font-size:13px}
.dexc:disabled{cursor:default}
.dthumb{width:64px;height:64px;display:block}
.dthumb svg{width:100%;height:100%}
.dexc.unk .dthumb svg,.vbox.unk svg{filter:brightness(0);opacity:.42}
.dexc.unk b{color:var(--muted)}
.dv{display:flex;gap:4px}
.dv i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.dv i.on.p0{background:var(--ink);border-color:var(--ink)}
.dv i.on.p1{background:repeating-linear-gradient(110deg,var(--ink) 0 2px,var(--glass) 2px 4px);border-color:var(--ink)}
.dv i.on.p2{background:linear-gradient(90deg,#ff9fb8,#fff3a0,#8fdcff,#b9a6ff);border-color:#fff}
.vrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbox{display:grid;justify-items:center;gap:5px;background:var(--glass-2);border:1px solid var(--rim);border-radius:14px;padding:8px 4px;font-size:12px;font-weight:600;text-align:center}
.vbox .thumb{width:100%;height:auto;aspect-ratio:1}
.vbox .odds2{font-size:11px;color:var(--muted);font-weight:500}
.reveal .nm{font-family:var(--display);font-size:24px;font-weight:600}

/* plushie shelf: grown pets kept as stitched plushies on wooden shelves on the back wall */
/* the shelf sits behind the pet: the stage lets taps through except on the pet's own shape */
.shelf{position:absolute;display:grid;gap:6px;pointer-events:none}
.stage{pointer-events:none}
.stage .critter{pointer-events:visiblePainted}
.plank{position:relative;display:flex;align-items:flex-end;gap:4px;padding:0 6px 6px;min-width:44px}
.plank::before{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:2px;background:linear-gradient(#a07a55,#7a5636);box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.plank::after{content:"";position:absolute;left:8px;right:8px;bottom:-7px;height:7px;background:linear-gradient(#5a3d27,#5a3d27) left/4px 100% no-repeat,linear-gradient(#5a3d27,#5a3d27) right/4px 100% no-repeat}
.plush{pointer-events:auto;position:relative;width:36px;height:36px;padding:0;border:0;background:none;display:block;transform-origin:50% 100%;animation:plushsway 4s ease-in-out infinite}
.plush:nth-child(2){animation-delay:-1.3s}
.plush svg{width:100%;height:100%;display:block;overflow:visible}
.plush:focus-visible{outline-offset:1px;border-radius:8px}
.plush.squeeze{animation:plushsq .45s ease-out}
.plush.new{animation:plushdrop .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes plushsway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes plushsq{30%{transform:scale(1.18,.8)}60%{transform:scale(.92,1.1)}100%{transform:none}}
@keyframes plushdrop{0%{opacity:0;transform:translateY(-40px) rotate(-12deg)}60%{opacity:1}100%{transform:none}}
.empty{pointer-events:none}
.empty.withshelf{justify-items:end;padding-left:100px;padding-right:12px}
.empty.withshelf .btnrow{flex-wrap:wrap}
.emptybox{pointer-events:auto}
/* plushie memory card */
.memory{position:relative;height:190px;border-radius:18px;overflow:hidden;background:radial-gradient(70% 70% at 50% 60%,rgba(127,214,194,.16),transparent 70%),var(--glass-2);border:1px solid var(--rim);display:grid;place-items:center}
.memory .pet{width:150px;height:150px;animation:memhop 1.4s ease-in-out infinite;transform-origin:50% 100%}
.memory .pet svg{width:100%;height:100%;overflow:visible}
.memory .pet .critter{animation:none}
@keyframes memhop{0%,100%{transform:translateY(0) scale(1)}12%{transform:translateY(0) scale(1.06,.92)}35%{transform:translateY(-22px) scale(.96,1.05)}55%{transform:translateY(0) scale(1.05,.94)}70%{transform:none}}
.memory .hrt{position:absolute;bottom:30px;width:18px;height:18px;opacity:0;animation:memrise 2.4s ease-out infinite}
.memory .hrt .ic{width:100%;height:100%}
@keyframes memrise{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-130px) scale(1.1)}}
.memory .tag{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.memory .tag .pl{width:36px;height:36px}
.memory .tag .pl svg{width:100%;height:100%}
.memhead{display:grid;justify-items:center;gap:4px;text-align:center}
.memhead .nm{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:660px){.ring{width:36px;height:36px}.ring .ic{width:18px;height:18px}.mode .pc{display:none}.lvbadge{width:34px;height:34px}}
/* ---- Feeding Frenzy minigame ---- */
.tankbtn.fzbtn{top:118px;border-color:var(--amber);color:var(--amber)}
.tankbtn.fzbtn.wait{border-color:var(--rim);color:var(--muted)}
.tankbtn.fzbtn:not(.wait){animation:fzready 2.4s ease-in-out infinite}
.tankbtn.fzbtn .fzn{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:99px;background:var(--amber);color:#1a1205;font-size:11px;padding:0 3px;box-sizing:border-box}
@keyframes fzready{50%{box-shadow:0 0 14px -2px rgba(241,179,91,.7)}}
.fz{position:fixed;inset:0;z-index:25;background:rgba(3,8,9,.72);display:flex;justify-content:center;align-items:stretch}
.fzbox{position:relative;width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:linear-gradient(#0f2427,var(--void))}
.fzhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fzhead h2{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--display);font-weight:600;font-size:21px}
.fzhead h2 .ic{width:22px;height:22px;color:var(--amber)}
.fzstats{display:flex;align-items:center;gap:10px}
.fzscore{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.fzscore .ic{width:20px;height:20px;color:#f4a259}
.fzscore.bump{animation:fzbump .25s ease-out}
@keyframes fzbump{40%{transform:scale(1.25)}}
.fztime{flex:1;height:10px;border-radius:99px;background:var(--glass-2);overflow:hidden;border:1px solid var(--rim)}
.fztime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f4a259,#f5d65b,#8fd6a0);transform-origin:left;border-radius:99px}
.fztime.low i{background:var(--rose)}
.fzfield{position:relative;flex:1;min-height:260px;border-radius:22px;overflow:hidden;border:1.5px solid rgba(241,179,91,.35);background:#14262a;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.fzbg{position:absolute;inset:0;pointer-events:none}
.fzbg svg{position:absolute;inset:0;width:100%;height:100%;filter:brightness(1.45) saturate(1.25)}
.fzbg::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 0%,rgba(255,226,170,.28),transparent 70%),linear-gradient(transparent 75%,rgba(0,0,0,.2))}
.fzfloat{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fzfloat i{position:absolute;bottom:-20px;border-radius:50%;border:1.3px solid rgba(232,248,255,.6);background:rgba(232,248,255,.08);animation:fzbub linear infinite}
@keyframes fzbub{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}50%{transform:translate(10px,-50vh)}100%{transform:translate(-6px,-100vh);opacity:0}}
.fzshadow{position:absolute;bottom:6px;left:0;width:64px;height:10px;margin-left:-32px;border-radius:50%;background:rgba(0,0,0,.35);will-change:transform}
.fzpet{position:absolute;bottom:10px;left:0;width:84px;height:84px;margin-left:-42px;will-change:transform}
.fzpet>div{width:100%;height:100%;animation:fzhop 1.2s ease-in-out infinite;transform-origin:50% 100%}
.fzpet svg{width:100%;height:100%;overflow:visible}
.fzpet.yum>div{animation:fzyum .3s ease-out}
.fzpet.ouch>div{animation:fzouch .5s ease-out}
@keyframes fzhop{50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes fzyum{40%{transform:scale(1.15,.88)}}
@keyframes fzouch{20%,60%{transform:rotate(-12deg)}40%,80%{transform:rotate(12deg)}}
.fzi{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;will-change:transform;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.fzi svg{width:100%;height:100%;display:block;overflow:visible}
.fzpop{position:absolute;pointer-events:none;font-family:var(--display);font-weight:700;font-size:19px;text-shadow:0 1px 6px rgba(0,0,0,.8);transform:translate(-50%,0);animation:rise .9s ease-out forwards;white-space:nowrap;z-index:3}
.fzcombo{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:26px;color:#f5d65b;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;animation:pop 1.1s ease-out forwards;white-space:nowrap;z-index:3}
.fzspark{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;animation:fzspk .6s ease-out forwards;z-index:2}
@keyframes fzspk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.fzmid{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;padding:18px;text-align:center;z-index:4;background:rgba(8,18,20,.62)}
.fzmid:empty{display:none}
.fzmid h3{margin:0;font-family:var(--display);font-weight:600;font-size:25px}
.fzmid p{margin:0;color:var(--ink);opacity:.8;font-size:13px;max-width:320px}
.fzlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:14px;font-weight:700}
.fzlegend span{display:inline-flex;align-items:center;gap:5px}
.fzlegend svg{width:26px;height:26px}
.fzodds{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:330px;font-size:13px}
.fzodds div{display:grid;gap:1px;padding:7px 10px;border-radius:12px;background:rgba(24,51,55,.9);border:1px solid var(--rim)}
.fzodds b{font-family:var(--display);font-size:17px;color:var(--bloom)}
.fzodds div.on{border-color:var(--bloom);box-shadow:0 0 0 1px var(--bloom) inset}
.fzgo{font-family:var(--display);font-weight:700;font-size:64px;color:var(--amber);animation:pop .9s ease-out forwards;pointer-events:none}
.fzlv{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-weight:700}
.fzlv .from,.fzlv .to{display:grid;justify-items:center;line-height:1;padding:10px 14px;border-radius:16px;background:rgba(24,51,55,.95);border:1px solid var(--rim);min-width:70px}
.fzlv small{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fzlv .from b{font-size:34px;color:var(--muted)}
.fzlv .to{border-color:var(--bloom);box-shadow:0 0 22px -6px var(--bloom)}
.fzlv .to b{font-size:44px;color:var(--bloom)}
.fzlv .arr{font-size:28px;color:var(--amber)}
.fzgain{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:18px;color:#1a1205;background:var(--amber);border-radius:99px;padding:5px 14px}
.fzgain .ic{width:18px;height:18px}
.fzres{display:grid;gap:6px;width:100%;max-width:330px}
/* ---- Molting: Peel the Shell ---- */
.gate .moltgo{animation:fzready 2.4s ease-in-out infinite}
.mlfield{border-color:rgba(199,155,242,.4)}
.mlpet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.mlpet>div{width:100%;height:100%;transform-origin:50% 100%}
.mlpet svg{width:100%;height:100%;overflow:visible}
.mlpet.wig>div{animation:wiggle .45s ease-in-out}
.mlpet.shine>div{animation:mlshine .7s ease-out}
@keyframes mlshine{35%{transform:scale(1.12,.9)}70%{transform:scale(.96,1.05)}}
.mlsvg .husk{transition:opacity .5s ease-out}
.mlsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

.mlsvg .fl{fill:rgba(236,228,205,.30);stroke:rgba(255,250,235,.45);stroke-width:1.2;stroke-linejoin:round}
.mlsvg .gl{fill:none;stroke:#f5d65b;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.mlsvg .ck{fill:none;stroke:#2a2318;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mlsvg .pl{fill:none;stroke:#f2fffb;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

.mlsvg g.peel{animation:mlpeel .75s ease-in forwards}

.mlsvg g.sealed .gl{stroke:#56656b}
.mlsvg g.sealed{animation:mlseal .9s ease-out forwards}
@keyframes mlseal{0%{opacity:1}100%{opacity:0}}

.mlg{display:block;width:100%;height:100%;overflow:visible}
.mlg .gl{fill:none;stroke:#f5d65b;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}

@keyframes mlfall{0%{transform:none;opacity:1}18%{transform:translate(var(--fx),-4px);opacity:1}100%{transform:translate(calc(var(--fx)*3),var(--fy)) rotate(var(--fr));opacity:0}}

// ---------- state ----------
let uid=Date.now();const nid=()=>(uid++).toString(36);

// A grown pet kept as a keepsake: it leaves the tank and sits on that tank's shelf as a plushie.
const SHELF_MAX=4;
const toPlush=c=>({id:nid(),name:c.name,r:c.r,sp:c.sp||'chillie',pat:c.pat||0,hue:c.hue,shape:c.shape,feeds:c.feeds||0,at:Date.now()});
let S;
// Critterpedia: which species (and which of their Solid / Striped / Prismatic looks) you have found. Older saves are filled in from what they own.
function dexAdd(o){if(!o)return;const k=o.sp||'chillie';if(!S.dex[k])S.dex[k]=[0,0,0];S.dex[k][o.pat||0]=1}
function readSave(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.tanks)?s:null}catch(e){return null}}
function normalize(){
  // Older saves: tanks had no shelf, and trophies stayed in the tank. Turn those trophies into plushies.
  for(const t of S.tanks){if(!Array.isArray(t.shelf))t.shelf=[];if(t.c&&t.c.trophy){t.shelf.push(toPlush(t.c));t.c=null}}
  if(!Array.isArray(S.stasis))S.stasis=[];if(!Array.isArray(S.ships))S.ships=[];
  if(!S.sound||typeof S.sound!=='object')S.sound={on:true,vol:.8};
  if(!S.music||typeof S.music!=='object')S.music={track:1,vol:.5};
  if(!S.dex||typeof S.dex!=='object'){S.dex={};for(const t of S.tanks){dexAdd(t.c);(t.shelf||[]).forEach(dexAdd)}S.stasis.forEach(dexAdd)}
  if(typeof S.rev!=='number')S.rev=0;
  // Friendship badges arrived after some pets were already grown: pay out for every grown pet and plushie once.
  if(typeof S.badges!=='number'){S.badges=0;for(const t of S.tanks){if(t.c&&t.c.done){S.badges+=BADGE_BY_R[t.c.r];t.c.fb=1}(t.shelf||[]).forEach(p=>S.badges+=BADGE_BY_R[p.r])}}
  if(S.fz){for(const t of S.tanks)if(t.c&&!t.c.fz)t.c.fz={...S.fz};delete S.fz}
  // Molts: tank upgrades bought in older saves count as Fine molts.
  for(const t of S.tanks){const c=t.c;if(!c)continue;if(!c.gates||typeof c.gates!=='object')c.gates={};if(!c.molts||typeof c.molts!=='object')c.molts={};
    for(const L in c.gates)if(c.gates[L]&&!c.molts[L])c.molts[L]='fine'}
}
S=readSave()||fresh();normalize();
// Save safety: if this copy of the game was asleep (phone app in the background, a second tab, an old preview) while
// another copy kept playing and saved, this copy's memory is stale. Writing it would wipe out whatever happened since,
// e.g. a creature a returning mission dropped into stasis. So every save checks the stored revision first; if someone
// else saved newer progress, this copy adopts it instead of overwriting it.
let myRev=S.rev;
// Set once a newer copy of the game opens in another tab: this copy stops playing and never saves again.
let RETIRED=false;
// The selected care tool is this screen's own choice: it must not be swapped out when a newer save from another copy is adopted.
let MODE=S.mode||'feed';
// Spam taps always count. A tap during a running scene of the same tool adds a sparkle and a short sound instead of restarting it.
let PLAY=S.play||'ball',careLock=0,careLockK=-1,careLockM='';
function adoptNewer(){const s=readSave();if(!s||(s.rev||0)<=myRev)return false;S=s;normalize();myRev=S.rev;return true}
// True while time-away is being replayed: saves wait until the replay finishes (the caller saves once at the end).
let CATCHING=false;
const save=()=>{
  if(RETIRED||CATCHING)return;
  if(adoptNewer()){try{stripKey='';artKey='';render(true)}catch(e){}return}
  S.lastSeen=Date.now();S.rev=myRev+1;myRev=S.rev;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
};
const AT=()=>S.tanks[S.active]||S.tanks[0];

// ---------- math ----------
// Game pace: the ×1 setting runs 20× the original speed.
const PACE=20,SPD=()=>S.speed*PACE;
const base=c=>RAR[c.r].days*86400/5050;
const need=c=>c.level*base(c);
const tier=c=>Math.min(10,Math.floor(c.level/10)+1);
// Mood follows the LOWEST need: every need has to clear the bar.
// m = cash multiplier, g = growth (XP) multiplier. Struggling pauses both.
function wellbeing(c){
  const n=c.needs,h=(n.hunger+n.clean)/2,hp=(n.affection+n.energy+n.comfort)/3,avg=(h+hp)/2,lo=Math.min(...Object.values(n));
  if(lo>90)return{k:'Thriving',m:1.5,g:2,avg,lo};
  if(lo>70)return{k:'Content',m:1,g:1,avg,lo};
  if(lo>50)return{k:'Grumpy',m:.75,g:.75,avg,lo};
  if(lo>=20)return{k:'Unhappy',m:.3,g:.3,avg,lo};
  return{k:'Struggling',m:0,g:0,avg,lo};
}
const perHour=c=>c?c.level*wellbeing(c).m*RAR[c.r].mult:0;
// Each plushie pays a quarter of what its pet earned at level 100 while Content.
const plushRate=p=>100*RAR[p.r].mult*.25;
const shelfRate=t=>(t.shelf||[]).reduce((a,p)=>a+plushRate(p),0);
const totalPerHour=()=>S.tanks.reduce((a,t)=>a+perHour(t.c)+shelfRate(t),0);
// The next level is a molt level that hasn't been molted yet: growth waits there until the pet molts.
const gateAt=c=>{const L=c.level+1;return (MOLT_LV.includes(L)&&!(c.gates&&c.gates[L]))?L:0};
const growthMult=c=>wellbeing(c).g*moltFx(c).g;
function dur(s){if(!isFinite(s))return 'paused';s=Math.max(0,Math.round(s));if(s<60)return s+'s';if(s<3600)return Math.round(s/60)+'m';if(s<86400)return (s/3600).toFixed(1)+'h';return (s/86400).toFixed(1)+'d'}
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function roll(odds){let x=Math.random();for(let i=0;i<odds.length;i++){if(x<odds[i])return i;x-=odds[i]}return odds.length-1}

function gainXP(c,amt){
  const ups=[];if(c.done)return ups;
  c.xp+=amt;
  while(c.level<100&&c.xp>=need(c)){
    if(gateAt(c)){c.xp=need(c);break}
    c.xp-=need(c);c.level++;ups.push(c.level);
  }
  if(c.level>=100&&!c.done){c.level=100;c.xp=0;c.done=true;S.milestones[c.r]=true;if(!c.fb){c.fb=1;S.badges=(S.badges|0)+BADGE_BY_R[c.r]}}
  return ups;
}
function attention(t){const c=t.c;if(!c)return false;
  if(c.unnamed)return true;
  if(c.done&&!c.egg)return true;
  if(!c.done&&gateAt(c)&&c.xp>=need(c))return true;
  return Object.values(c.needs).some(v=>v<50);
}

// ---------- sound ----------
// Everything is synthesized with Web Audio (no sound files), but built like a real animal voice rather than a beep:
// a buzzy "vocal cord" source is shaped by mouth resonances (formants) that move as the mouth opens and closes, with
// breath noise, a little natural pitch wobble and slow vibrato. Small creatures have small mouths, so their resonances
// sit higher, which is what makes a voice sound tiny and cute.
// Each body shape is its own kind of animal: round pets mew like kittens, tall pets "wheek" like guinea pigs, and wide
// pets coo and boop like seal pups. Colour nudges the pitch, babies are squeakier than grown-ups, rarer pets get extra
// warble or a shimmer, and mood changes how bright or droopy they sound. Every call varies slightly each time.
const SND=(()=>{
  let ctx=null,out=null,noiseBuf=null,lastCare=0;
  const R=(a,b)=>a+Math.random()*(b-a);
  function ac(){
    if(!S.sound||!S.sound.on)return null;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    if(!ctx){try{
      ctx=new AC();const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;
      out=ctx.createGain();out.connect(comp);comp.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null;return null}}
    if(ctx.state==='suspended')ctx.resume();
    out.gain.value=.9*S.sound.vol;
    return ctx;
  }
  const noiseSrc=(t0,end)=>{const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(t0,R(0,1.5));s.stop(end);return s};
  const env=(g,t0,att,peak,end,rel)=>{g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+att);g.gain.setValueAtTime(peak,Math.max(t0+att,end-rel));g.gain.exponentialRampToValueAtTime(.0001,end)};

  // Mouth shapes: first three resonances (Hz) of each vowel, at grown-up size. 'm' is a closed-mouth hum.
  const VOW={i:[300,2300,3000],e:[480,2000,2700],a:[760,1250,2600],o:[480,860,2500],u:[330,820,2300],m:[260,1050,2300]};

  // One syllable. pitch/vw are paths over the syllable: [[fraction of length, pitch multiple]] and [[vowel, fraction]].
  function syl(t0,{f0,pitch=[[0,1],[1,1]],len,vw=[['a',0]],size=1.4,vol=.3,breath=.12,vib=12,rough=0,shimmer=0}){
    const end=t0+len,mix=ctx.createGain(),amp=ctx.createGain(),src=ctx.createGain();
    // gentle random wobble + vibrato that grows in, like a real voice
    const jn=noiseSrc(t0,end+.1),jl=ctx.createBiquadFilter(),jg=ctx.createGain();jl.type='lowpass';jl.frequency.value=14;jg.gain.value=1000;jn.connect(jl);jl.connect(jg);
    const vl=ctx.createOscillator(),vg=ctx.createGain();vl.frequency.value=R(5,6.5);vg.gain.setValueAtTime(0,t0);vg.gain.linearRampToValueAtTime(vib,t0+len*.6);vl.connect(vg);vl.start(t0);vl.stop(end+.1);
    for(const [d,lvl] of shimmer?[[0,1],[shimmer,.55]]:[[0,1]]){
      const o=ctx.createOscillator(),og=ctx.createGain();o.type='sawtooth';o.detune.value=d;og.gain.value=lvl;
      pitch.forEach(([p,m],i)=>{const f=Math.max(50,f0*m),t=t0+p*len;i?o.frequency.exponentialRampToValueAtTime(f,t):o.frequency.setValueAtTime(f,t)});
      jg.connect(o.detune);vg.connect(o.detune);o.connect(og);og.connect(src);o.start(t0);o.stop(end+.1);
    }
    // the mouth: three resonances that glide between vowel shapes
    [[5,1],[9,.55],[12,.25]].forEach(([q,lvl],k)=>{
      const bp=ctx.createBiquadFilter(),g=ctx.createGain();bp.type='bandpass';bp.Q.value=q;g.gain.value=lvl*3.2;
      vw.forEach(([v,p],i)=>{const f=VOW[v][k]*size,t=t0+p*len;i?bp.frequency.linearRampToValueAtTime(f,t):bp.frequency.setValueAtTime(f,t)});
      src.connect(bp);bp.connect(g);g.connect(mix);
    });
    const body=ctx.createBiquadFilter(),bg=ctx.createGain();body.type='lowpass';body.frequency.value=f0*2.2;bg.gain.value=.18;src.connect(body);body.connect(bg);bg.connect(mix);
    // breath through the same mouth
    if(breath){const n=noiseSrc(t0,end+.1),bf=ctx.createBiquadFilter(),ng=ctx.createGain();bf.type='bandpass';bf.Q.value=1.4;
      vw.forEach(([v,p],i)=>{const f=VOW[v][1]*size,t=t0+p*len;i?bf.frequency.linearRampToValueAtTime(f,t):bf.frequency.setValueAtTime(f,t)});
      ng.gain.value=breath*2.2;n.connect(bf);bf.connect(ng);ng.connect(mix)}
    let last=mix;
    if(rough){const rg=ctx.createGain(),rl=ctx.createOscillator(),rd=ctx.createGain();rg.gain.value=1-rough/2;rl.frequency.value=R(30,38);rd.gain.value=rough/2;rl.connect(rd);rd.connect(rg.gain);rl.start(t0);rl.stop(end+.1);mix.connect(rg);last=rg}
    env(amp,t0,Math.min(.035,len*.25),vol,end+.04,len*.4);last.connect(amp);amp.connect(out);
  }
  // physical sounds
  function burst(t0,{dur,f=2500,f2=f,type='bandpass',q=1.2,vol=.2,att=.004}){
    const n=noiseSrc(t0,t0+dur+.05),bf=ctx.createBiquadFilter(),g=ctx.createGain();bf.type=type;bf.Q.value=q;
    bf.frequency.setValueAtTime(f,t0);bf.frequency.exponentialRampToValueAtTime(f2,t0+dur);env(g,t0,att,vol,t0+dur,dur*.7);n.connect(bf);bf.connect(g);g.connect(out);
  }
  const crunch=t0=>{burst(t0,{dur:R(.035,.06),f:R(1800,3200),q:1.1,vol:R(.22,.3)});burst(t0,{dur:.05,f:320,type:'lowpass',q:.7,vol:.25})};
  const thud=(t0,vol=.35)=>burst(t0,{dur:.08,f:380,f2:160,type:'lowpass',q:.8,vol});
  const pop=t0=>burst(t0,{dur:.012,f:R(3500,6000),type:'highpass',q:.7,vol:.09});
  function purr(t0,dur,vol){ // a rumbling purr: breathy noise pulsed ~25 times a second, swelling with each breath
    const n=noiseSrc(t0,t0+dur+.1),lp=ctx.createBiquadFilter(),am=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain(),g=ctx.createGain();
    lp.type='lowpass';lp.frequency.value=R(450,650);am.gain.value=.5;l.type='triangle';l.frequency.value=R(23,27);lg.gain.value=.5;l.connect(lg);lg.connect(am.gain);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+dur*.25);g.gain.linearRampToValueAtTime(vol*.55,t0+dur*.5);g.gain.linearRampToValueAtTime(vol,t0+dur*.75);g.gain.linearRampToValueAtTime(.0001,t0+dur);
    n.connect(lp);lp.connect(am);am.connect(g);g.connect(out);l.start(t0);l.stop(t0+dur+.1);
  }
  const tinkle=(t0,n=3,vol=.035)=>{const N=[2093,2349,2637,3136,3520];for(let i=0;i<n;i++){const f=N[Math.floor(Math.random()*N.length)],o=ctx.createOscillator(),g=ctx.createGain(),t=t0+i*.08;o.type='sine';o.frequency.value=f;env(g,t,.004,vol,t+.35,.3);o.connect(g);g.connect(out);o.start(t);o.stop(t+.4)}};
  function bell(t0,f,dur,vol,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;env(g,t0,.006,vol,t0+dur,dur*.8);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+.05)}

  // ---- voices ----
  const FAM=[
    {f0:720, call:{vw:[['i',0],['a',.35],['u',1]],pitch:[[0,.92],[.3,1.12],[1,.8]],len:.34},purr:.32,gain:.85}, // round: kitten-like "mew"
    {f0:960, call:{vw:[['e',0],['i',1]],pitch:[[0,.72],[.75,1.3],[1,1.22]],len:.3},purr:.26,gain:2.1},           // tall: guinea-pig "wheek"
    {f0:390, call:{vw:[['u',0],['o',.5],['u',1]],pitch:[[0,1],[.45,1.18],[1,.94]],len:.38},purr:.3,gain:1.35}];  // wide: seal-pup "boo"
  const RV=[{vib:8},{vib:18},{vib:14,shimmer:7},{vib:12,rough:.35},{vib:20,shimmer:6}]; // Common…Legendary
  function voice(c){
    // New species each have their own call (chirps, hoots, yips, growls…); the original Chillie keeps its body-shape voices.
    const sv=spOf(c).v,t=Math.min(10,Math.floor((c.level||100)/10)+1),mood=c.needs?wellbeing(c).k:'Thriving',
      fam=sv?{f0:sv.f0,call:{vw:sv.vw,pitch:sv.pitch,len:sv.len},purr:sv.purr||.3,gain:sv.gain}:(FAM[c.shape]||FAM[0]);
    const slow=mood==='Unhappy'||mood==='Struggling';
    const f0=fam.f0*Math.pow(2,(((c.hue||0)%360)/360-.5)*4/12)*(1.22-.03*t)*{Thriving:1.05,Content:1,Grumpy:.97,Unhappy:.94,Struggling:.9}[mood];
    const rv=RV[c.r||0];
    return {fam,f0,size:1.75-.045*t,breath:slow?.24:.12,mood,slow,r:c.r||0,...rv,
      vib:sv&&sv.vib!=null?sv.vib+(rv.vib-8)*.5:rv.vib,rough:Math.max(rv.rough||0,sv&&sv.rough||0)};
  }
  // the pet's own call, optionally reshaped (k = pitch multiple)
  function call(v,t0,o={}){const C=v.fam.call,len=(o.len||C.len)*R(.92,1.08)*(v.slow?1.15:1);
    syl(t0,{f0:v.f0*(o.k||1)*R(.96,1.04),pitch:o.pitch||C.pitch,len,vw:o.vw||C.vw,size:v.size,vol:(o.vol??.3)*v.fam.gain,breath:o.breath??v.breath,vib:o.vib??v.vib,shimmer:v.shimmer||0,rough:v.rough||0});return len}
  const giggle=(v,t0,n=4)=>{for(let i=0;i<n;i++)call(v,t0+i*R(.085,.105),{k:i%2?1.32:1.42,len:.065,vw:[['i',0],['e',1]],pitch:[[0,1.05],[1,.95]],breath:.3,vol:.22,vib:0})};
  const sparkleTail=(v,t0)=>{if(v.r===4)tinkle(t0,3,.03)};

  function care(mode,c,k=0,tap=false){
    if(!ac())return;const v=voice(c),t=ctx.currentTime+.01;
    if(mode==='playtap'){call(v,t,{len:.11,k:R(1.15,1.35),vw:[['a',0],['i',1]],vol:.15,vib:0});return} // tapped mid-game: a quick happy yip
    const quick=tap||t-lastCare<.45;lastCare=t;
    if(quick){ // fast tapping: one short call and the tool's own sound, so sounds don't pile up
      if(mode==='feed'){crunch(t);crunch(t+.09)}
      if(mode==='pet')purr(t,.35,v.fam.purr*.7);

  const TRACKS=[null,
    {n:'Lagoon Lullaby',d:'Soft music box over a warm hum',bpm:68,spb:2,bars:4,

    {n:'Bubble Bop',d:'Bouncy, playful and bubbly',bpm:102,spb:4,bars:4,swing:.06,

  function munch(c,big){if(!ac())return;const v=voice(c),t=ctx.currentTime+.01;
    call(v,t,{len:.08,vw:[['a',0],['m',1]],pitch:[[0,1.1],[1,.95]],vol:.2,vib:0});
    [.08,.19,.3].slice(0,big?3:2).forEach(d=>crunch(t+d+R(-.015,.015)));
    call(v,t+(big?.38:.28),{len:.12,vw:[['m',0]],pitch:[[0,.95],[1,1.08]],vol:.13,breath:.05,vib:0});
    if(big)call(v,t+.55,{k:1.2,len:.14,vol:.18})}
  return {munch,care,play,hi,squeak,bye,levelUp,coin,chime,hatch,rock,click,pause,musicSync,musicStop,musicList,musicVol:()=>{if(ctx)mVolApply()}};
})();

// ---------- toast ----------
let tt;
function toast(text,lead){
  let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML=(lead?`<span class="lead">${lead}</span>`:'')+`<span>${text}</span>`;clearTimeout(tt);tt=setTimeout(()=>t.remove(),3800);
}

// ---------- offline catch-up ----------
// Runs once at startup, after every helper below is defined (eggs hatching or missions returning while away need them).
function offlineCatchUp(gap){
  const el=Math.min(gap!=null?gap:(Date.now()-(S.lastSeen||Date.now()))/1000,30*86400);
  if(el<20)return;
  // Replay the time away in small steps, so cash follows the level the pet actually had at each moment (not its
  // final level for the whole gap), and a pet that hatched partway through keeps growing and earning afterwards.
  let earned=0,grew=0,eggs=0,back=0;const fb0=S.badges|0;
  const N=Math.min(2000,Math.max(1,Math.ceil(el/30))),dt=el/N,sdt=dt*SPD();
  CATCHING=true;
  try{
    for(let i=0;i<N;i++){
      for(const t of S.tanks){earned+=shelfRate(t)*sdt/3600;const c=t.c;if(!c)continue;
        for(const k in c.needs){const v=c.needs[k];const dd=OFFLINE_DECAY*dt*moltFx(c).off;c.needs[k]=v>=50?Math.max(50,v-dd):Math.max(0,v-dd)}
        earned+=perHour(c)*sdt/3600;
        if(!c.done){const l0=c.level;gainXP(c,sdt*growthMult(c));grew+=c.level-l0}
        if(c.egg){c.egg.left-=sdt;if(c.egg.left<=0){hatchEgg(t,true);eggs++}}
      }
      for(const sh of S.ships)if(sh.m){sh.m.left-=sdt;if(sh.m.left<=0){missionReturn(sh,true);back++}}
    }
  }finally{CATCHING=false}
  S.cash+=earned;
  const bits=[`+${fmt(earned)} cash`];if(grew)bits.push(`${grew} level${grew>1?'s':''} gained`);if(eggs)bits.push(`${eggs} egg${eggs>1?'s':''} hatched`);if(back)bits.push(`${back} mission${back>1?'s':''} returned`);{const fb=(S.badges|0)-fb0;if(fb)bits.push(`+${fb} ${badgeWord(fb)}`)}
  setTimeout(()=>toast(`Welcome back. ${dur(el)} away: ${bits.join(', ')}.`,icC('moon','#c79bf2')),50);
}

// ---------- critter species ----------
// Every species is drawn in the same 200-wide space with its feet on the ground line (y=168) and its face near x=100,
// so growth scaling, rarity glows and care effects line up for all of them. `m` holds the spots care effects aim at.
// Variants: Solid (plain colour), Striped (tiger bands), Prismatic (a slow rainbow sheen) — each much rarer than the last.
const PATN=['Solid','Striped','Prismatic'],PAT_ODDS=[.80,.17,.03];
const svgE=(cx,cy,rx,ry,f,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"${x?' '+x:''}/>`;
const svgC=(cx,cy,r,f,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"${x?' '+x:''}/>`;
const svgP=(d,f,x='')=>`<path d="${d}" fill="${f}"${x?' '+x:''}/>`;
const svgS=(d,col,w,x='')=>`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"${x?' '+x:''}/>`;
const svgM=s=>`<g transform="translate(200 0) scale(-1 1)">${s}</g>`;                       // mirror left half to the right
const rot=(a,x,y)=>`transform="rotate(${a} ${x} ${y})"`;
const star4=(x,y,r,f,x2='')=>svgP(`M${x} ${y-r} L${x+r*.28} ${y-r*.28} L${x+r} ${y} L${x+r*.28} ${y+r*.28} L${x} ${y+r} L${x-r*.28} ${y+r*.28} L${x-r} ${y} L${x-r*.28} ${y-r*.28}Z`,f,x2);
const star5=(x,y,r,f,x2='')=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;d+=(i?'L':'M')+(x+Math.cos(a)*q).toFixed(1)+' '+(y+Math.sin(a)*q).toFixed(1)}return svgP(d+'Z',f,x2)};
const hexP=(x,y,r,f,x2='')=>{let d='';for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;d+=(i?'L':'M')+(x+Math.cos(a)*r).toFixed(1)+' '+(y+Math.sin(a)*r).toFixed(1)}return svgP(d+'Z',f,x2)};
const spiral=(x,y,turns,grow)=>{let d='';const n=turns*24;for(let i=0;i<=n;i++){const a=i/24*Math.PI*2,q=2+grow*a;d+=(i?'L':'M')+(x+Math.cos(a)*q).toFixed(1)+' '+(y+Math.sin(a)*q).toFixed(1)}return d};
const flame=(x,y,a,sc,f,x2='')=>`<g transform="translate(${x} ${y}) rotate(${a}) scale(${sc})">${svgP('M0 0 C-16 -18 -10 -40 0 -58 C2 -44 12 -38 12 -24 C12 -10 6 -2 0 0Z',f,x2)}</g>`;
const crystal=(x,y,h,w,f,lt)=>svgP(`M${x-w} ${y} L${x-w*.7} ${y-h*.78} L${x} ${y-h} L${x+w*.7} ${y-h*.78} L${x+w} ${y}Z`,f,'opacity=".92"')+svgP(`M${x} ${y-h} L${x+w*.7} ${y-h*.78} L${x+w} ${y} L${x+w*.2} ${y}Z`,lt,'opacity=".35"');

// Eyes and mouth that follow the pet's mood. Cute pets get round shiny eyes and blush; vicious ones get glowing slit eyes,
// a scowl and teeth. The .mouth / .mouthOpen / .blink classes are what the feeding and petting animations switch.
function critFace(P,wb,o){
  const D=P.dark,x=o.x??100,y=o.y,r=o.r,sp=o.sp??0,mx=o.mx??x,my=o.my,mw=o.mw??7,k=mw/8;
  const xs=o.one?[x]:[x-sp,x+sp],sad=wb==='Unhappy'||wb==='Struggling';
  let g='';
  if(o.vic){
    const ir=o.iris||'#ffd23f';
    g+=`<g class="blink">${xs.map(ex=>svgE(ex,y,r,r*.82,ir)+svgE(ex,y,r*.2,r*.68,D)+svgC(ex+r*.38,y-r*.34,r*.16,'#fff','opacity=".85"')).join('')}</g>`;
    if(sad)g+=xs.map(ex=>svgS(`M${ex-r*1.05} ${y-r*.5} H${ex+r*1.05}`,P.shade,r*.75)).join('');
    g+=xs.map((ex,i)=>{if(o.one)return svgS(`M${ex-r*1.25} ${y-r*1.2} L${ex} ${y-r*.62} L${ex+r*1.25} ${y-r*1.2}`,D,Math.max(2.4,r*.32));
      const dir=i?-1:1;return svgS(`M${ex-dir*r*1.15} ${y-r*1.25} L${ex+dir*r*.9} ${y-r*.6}`,D,Math.max(2.4,r*.36))}).join('');
    const n=Math.max(3,Math.round(mw/4)),w=mw*2/n;
    let teeth='';for(let i=0;i<n;i++){const tx=mx-mw+i*w,dip=Math.sin((i+.5)/n*Math.PI)*mw*.32;teeth+=`M${(tx+w*.12).toFixed(1)} ${(my+dip*.55).toFixed(1)} L${(tx+w*.5).toFixed(1)} ${(my+dip*.55+w*.75).toFixed(1)} L${(tx+w*.88).toFixed(1)} ${(my+dip*.55).toFixed(1)}Z `}
    const grin=wb==='Struggling'?.05:wb==='Unhappy'?.25:wb==='Grumpy'?.4:.55;
    g+=`<g class="mouth">${svgP(`M${mx-mw} ${my} Q${mx} ${my+mw*grin+mw*.2} ${mx+mw} ${my} Q${mx} ${my+mw*grin*.4+mw*.08} ${mx-mw} ${my}Z`,D)}${svgP(teeth,'#f4f1e6')}${svgP(`M${mx-mw*.72} ${my+mw*.08} l${mw*.1} ${mw*.42} l${mw*.12} ${-mw*.38}Z M${mx+mw*.72} ${my+mw*.08} l${-mw*.1} ${mw*.42} l${-mw*.12} ${-mw*.38}Z`,'#fff')}</g>`;
    g+=`<g class="mouthOpen">${svgE(mx,my+mw*.38,mw*.95,mw*.72,D)}${svgE(mx,my+mw*.78,mw*.5,mw*.22,'#e0566b')}${svgP(`M${mx-mw*.7} ${my-mw*.25} l${mw*.16} ${mw*.55} l${mw*.16} ${-mw*.5}Z M${mx+mw*.7} ${my-mw*.25} l${-mw*.16} ${mw*.55} l${-mw*.16} ${-mw*.5}Z M${mx-mw*.45} ${my+mw*1.05} l${mw*.12} ${-mw*.42} l${mw*.12} ${mw*.4}Z M${mx+mw*.45} ${my+mw*1.05} l${-mw*.12} ${-mw*.42} l${-mw*.12} ${mw*.4}Z`,'#fff')}</g>`;
    return g;
  }
  if(wb==='Thriving')g+=xs.map(ex=>svgS(`M${ex-r*.8} ${y+r*.22} q${r*.8} ${-r} ${r*1.6} 0`,D,Math.max(2.2,r*.38))).join('');
  else{
    g+=`<g class="blink">${xs.map(ex=>svgC(ex,y,r,'#fff')+svgC(ex+r*.17,y+r*.17,r*.56,D)+svgC(ex+r*.36,y-r*.12,r*.21,'#fff')).join('')}</g>`;
    if(sad)g+=xs.map(ex=>svgS(`M${ex-r*1.1} ${y-r*.66} H${ex+r*1.1}`,P.shade,r*.78)).join('');
  }
  if(o.beak){
    const bc=o.bc||'#f1b35b',w=mw;
    g+=svgP(`M${mx-w} ${my-w*.5} Q${mx} ${my-w*1.1} ${mx+w} ${my-w*.5} L${mx} ${my+w*.9}Z`,bc);
    g+=`<path class="mouth" d="M${mx-w*.5} ${my} H${mx+w*.5}" stroke="${D}" stroke-opacity=".25" stroke-width="1"/>`;
    g+=`<g class="mouthOpen">${svgP(`M${mx-w*.8} ${my-w*.2} L${mx+w*.8} ${my-w*.2} L${mx} ${my+w*1.1}Z`,D)}${svgP(`M${mx-w*.75} ${my+w*.3} L${mx+w*.75} ${my+w*.3} L${mx} ${my+w*1.6}Z`,bc)}</g>`;
  }else{

    g+=`<path class="mouth" d="M${mx-mw} ${my} q${mw} ${curve} ${mw*2} 0" stroke="${D}" stroke-width="${Math.max(2,2.8*Math.min(1.1,k))}" fill="none" stroke-linecap="round"/>`;
    g+=`<g class="mouthOpen">${svgE(mx,my+3*k,mw*1.1,mw,D)}${svgE(mx,my+7*k,mw*.68,mw*.38,'#f08a8a')}</g>`;
  }
  if(wb!=='Struggling'&&o.blush!==false){
    const bl=o.one?[[x-r*1.1,y+r*1.7]]:[[x-sp-r*1.15,y+r*1.55],[x+sp+r*1.15,y+r*1.55]];
    g+=bl.map(([bx,by])=>svgC(bx.toFixed(1),by.toFixed(1),(r*.62).toFixed(1),'#f08a8a','opacity=".45"')).join('');
  }
  return g;
}

  return {h,uid,pat,body,dark:'#17262a',

const firstTheme=tier=>THEMES.findIndex(x=>x.tier===tier);
const themesFor=tier=>THEMES.map((x,i)=>i).filter(i=>THEMES[i].tier<=tier);
const themeOf=t=>{const th=THEMES[t.theme];return th&&th.tier<=t.tier?t.theme:firstTheme(t.tier)};
const themeName=t=>THEMES[themeOf(t)].n;
function tankDecor(t,p='dk',thumb,gates={},fresh=0){
  const f=n=>(+n).toFixed(1),TH=THEMES[t]||THEMES[0],C=TH.pal,K=TH.n;
  const rnd=i=>{const x=Math.sin(i*127.1+t*311.7)*43758.5453;return x-Math.floor(x)};
  const halo=(x,y,r,col,o=1)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${col}" opacity="${(.09*o).toFixed(2)}"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(r*.5)}" fill="${col}" opacity="${(.16*o).toFixed(2)}"/>`;
  const lights=(a,b,c,d,e,g,n,cols,wire='#2c3a36')=>{
    let s=`<path d="M${a} ${b} Q${c} ${d} ${e} ${g}" stroke="${wire}" stroke-width="1.2" fill="none"/>`;
    for(let i=1;i<n;i++){const u=i/n,x=(1-u)*(1-u)*a+2*(1-u)*u*c+u*u*e,y=(1-u)*(1-u)*b+2*(1-u)*u*d+u*u*g+3,col=cols[i%cols.length];
      s+=`<g class="dk-tw" style="animation-delay:${((i*.37)%3).toFixed(2)}s">${halo(x,y,9,col,1.3)}<circle cx="${f(x)}" cy="${f(y)}" r="2.5" fill="${col}"/></g>`}
    return s};
  const pebbles=(list,cols)=>list.map(([x,y,rx,ry],i)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${cols[i%cols.length]}"/><ellipse cx="${f(x-rx*.3)}" cy="${f(y-ry*.4)}" rx="${f(rx*.4)}" ry="${f(ry*.3)}" fill="#fff" opacity=".14"/>`).join('');
  const tuft=(x,y,h,col)=>`<path d="M${x-4} ${y} q1 ${f(-h*.6)} -3 ${-h} M${x} ${y} q0 ${f(-h*.7)} 1 ${f(-h*1.15)} M${x+4} ${y} q0 ${f(-h*.6)} 4 ${f(-h*.9)}" stroke="${col}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const flies=(list,col)=>list.map(([x,y],i)=>`<g class="dk-fly" style="animation-delay:${(-i*1.3).toFixed(1)}s">${halo(x,y,8,col,1.6)}<circle cx="${x}" cy="${y}" r="1.7" fill="${col}"/></g>`).join('');
  const motes=(n,cols,y0=215)=>Array.from({length:n},(_,i)=>`<circle cx="${f(60+i*(280/(n-1)))}" cy="${y0-(i%3)*14}" r="${1.2+(i%2)*.8}" fill="${cols[i%cols.length]}" class="mote" style="animation-delay:${((i*1.1)%6).toFixed(1)}s;animation-duration:${7+i%3}s"/>`).join('');
  const stars=(list,col='#fff')=>list.map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity=".85"${i%2?` class="dk-tw" style="animation-delay:${((i*.53)%3).toFixed(2)}s"`:''}/>`).join('');
  const starField=(n,y0,y1,col='#fff',sz=1)=>stars(Array.from({length:n},(_,i)=>[f(-20+rnd(i)*440),f(y0+rnd(i+99)*(y1-y0)),f((.6+rnd(i+7)*.8)*sz)]),col);
  const mush=(x,y,s,cap,dots,glow)=>`<g>${glow?halo(x,y-10*s,20*s,cap,1.5):''}<path d="M${f(x-2*s)} ${y} L${f(x-1.5*s)} ${f(y-9*s)} H${f(x+1.5*s)} L${f(x+2*s)} ${y}Z" fill="#efe6d6"/><path d="M${f(x-8*s)} ${f(y-8*s)} Q${x} ${f(y-20*s)} ${f(x+8*s)} ${f(y-8*s)} Q${x} ${f(y-5.5*s)} ${f(x-8*s)} ${f(y-8*s)}Z" fill="${cap}"/>${dots?`<circle cx="${f(x-3*s)}" cy="${f(y-11*s)}" r="${f(1.3*s)}" fill="#fff" opacity=".85"/><circle cx="${f(x+3.2*s)}" cy="${f(y-11.5*s)}" r="${f(1.1*s)}" fill="#fff" opacity=".85"/><circle cx="${x}" cy="${f(y-14*s)}" r="${f(.9*s)}" fill="#fff" opacity=".85"/>`:''}</g>`;
  const crystal=(x,y,h,w,col,lt,rot)=>`<g transform="rotate(${rot} ${x} ${y})"><path d="M${x-w} ${y} L${f(x-w*.85)} ${f(y-h*.72)} L${x} ${y-h} L${f(x+w*.85)} ${f(y-h*.72)} L${x+w} ${y}Z" fill="${col}"/><path d="M${x} ${y-h} L${f(x+w*.85)} ${f(y-h*.72)} L${x+w} ${y} L${x} ${y}Z" fill="${lt}" opacity=".45"/><path d="M${f(x-w*.4)} ${f(y-h*.55)} L${f(x-w*.2)} ${f(y-h*.82)}" stroke="#fff" stroke-width="1.2" opacity=".6" stroke-linecap="round"/></g>`;
  const vine=(x,len,col,leaf,berry,d=0)=>{

    return `<g class="dk-swayt" style="animation-delay:${d}s">${s}</g>`};
  // pine: base of trunk at ground y=g, height h
  const pine=(x,g,h,col,snow)=>{const y=g-h*.12;let s=`<rect x="${f(x-h*.03)}" y="${f(y-2)}" width="${f(h*.06)}" height="${f(h*.12+2)}" fill="#2e2016"/>`;
    for(let k=0;k<3;k++){const yy=y-h*k*.28,w=h*(.34-k*.08),tp=yy-h*.46;
      s+=`<path d="M${f(x-w)} ${f(yy)} L${x} ${f(tp)} L${f(x+w)} ${f(yy)}Z" fill="${col}"/>`;

    return s};
  const palm=(x,g,h,lean,trunk,l1,l2,d=0)=>{const tx=x+lean,ty=g-h;let s=`<path d="M${x} ${g} Q${f(x-lean*.2)} ${f(g-h*.55)} ${tx} ${ty}" stroke="${trunk}" stroke-width="${f(h*.07)}" fill="none" stroke-linecap="round"/>`;
    for(let i=1;i<7;i++){const u=i/7,px=(1-u)*(1-u)*x+2*(1-u)*u*(x-lean*.2)+u*u*tx,py=(1-u)*(1-u)*g+2*(1-u)*u*(g-h*.55)+u*u*ty;s+=`<path d="M${f(px-h*.035)} ${f(py)} q${f(h*.035)} 3 ${f(h*.07)} 0" stroke="#000" stroke-opacity=".22" stroke-width="1.3" fill="none"/>`}
    const fr=[[-1,-.15,l1],[-1,.35,l2],[-.5,-.45,l2],[.5,-.45,l1],[1,-.15,l2],[1,.35,l1],[0,-.55,l1]];
    let leaves=fr.map(([dx,dy,c])=>{const ex=tx+dx*h*.5,ey=ty+dy*h*.5+h*.12,mx=tx+dx*h*.28,my=ty+dy*h*.4-h*.12;return `<path d="M${f(tx)} ${f(ty)} Q${f(mx)} ${f(my-6)} ${f(ex)} ${f(ey)} Q${f(mx)} ${f(my+6)} ${f(tx)} ${f(ty)}Z" fill="${c}"/>`}).join('');
    return s+`<g class="dk-sway" style="animation-delay:${d}s">${leaves}</g><circle cx="${f(tx-3)}" cy="${f(ty+4)}" r="${f(h*.035)}" fill="#6b4a2a"/><circle cx="${f(tx+3)}" cy="${f(ty+5)}" r="${f(h*.035)}" fill="#5a3d22"/>`};
  const cloud=(x,y,s,col,o=1,cls='')=>`<g opacity="${o}"${cls?` class="${cls}"`:''}><ellipse cx="${x}" cy="${y}" rx="${f(30*s)}" ry="${f(9*s)}" fill="${col}"/><circle cx="${f(x-12*s)}" cy="${f(y-5*s)}" r="${f(10*s)}" fill="${col}"/><circle cx="${f(x+4*s)}" cy="${f(y-10*s)}" r="${f(13*s)}" fill="${col}"/><circle cx="${f(x+18*s)}" cy="${f(y-4*s)}" r="${f(8*s)}" fill="${col}"/></g>`;
  const star5=(cx,cy,R,col,rot=0)=>{let d='';for(let i=0;i<10;i++){const a=(i*36+rot-90)*Math.PI/180,r=i%2?R*.45:R;d+=(i?'L':'M')+f(cx+r*Math.cos(a))+' '+f(cy+r*Math.sin(a))}return `<path d="${d}Z" fill="${col}" stroke="#000" stroke-opacity=".12" stroke-linejoin="round"/>`};
  const spark=(x,y,r,col,d=0)=>`<path d="M${x} ${f(y-r)} Q${x} ${y} ${f(x+r)} ${y} Q${x} ${y} ${x} ${f(y+r)} Q${x} ${y} ${f(x-r)} ${y} Q${x} ${y} ${x} ${f(y-r)}Z" fill="${col}" class="dk-tw" style="animation-delay:${d}s"/>`;
  const falling=(n,draw,y0=-80,y1=150,dur=[6,11],dx=20)=>Array.from({length:n},(_,i)=>{const x=-10+rnd(i+3)*420,y=y0+rnd(i+41)*(y1-y0),du=dur[0]+rnd(i+17)*(dur[1]-dur[0]);
    return `<g class="dk-snow" style="--dx:${f((rnd(i+5)-.3)*dx)}px;animation-duration:${f(du)}s;animation-delay:${f(-rnd(i+23)*du)}s">${draw(x,y,i)}</g>`}).join('');
  const groundTop='M-120 222 L0 221 C50 214 110 222 200 219 C290 216 340 212 400 219 L520 219';
  const ground=`<path d="${groundTop} V520 H-120Z" fill="url(#${p}Gr)"/><path d="${groundTop}" stroke="#fff" stroke-opacity=".09" stroke-width="1.5" fill="none"/>`;

   <radialGradient id="${p}Lamp"><stop offset="0" stop-color="${C.light}" stop-opacity="${C.la}"/><stop offset="1" stop-color="${C.light}" stop-opacity="0"/></radialGradient>
