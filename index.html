// ---------- save safety ----------
// 1) Rolling automatic backups: the 3 newest copies, one every 10 minutes and whenever the game goes to the background.
//    Used automatically if the main save is ever unreadable, and listed in Settings so a "Start over" can be undone.
// 2) Backup code: the whole save as text to copy somewhere safe and paste back on any device.
// 3) Cloud save: in the Play Store app, every trip to the background also uploads to Google Play Games.
const BAK_KEY=KEY+':bak',BAK_EVERY=10*60*1000;
const SAVE_SAFE={
  list(){try{return JSON.parse(localStorage.getItem(BAK_KEY))||[]}catch(e){return []}},
  snap(force){
    if(RETIRED||CATCHING)return;
    const a=this.list(),now=Date.now();
    if(!force&&a[0]&&now-a[0].at<BAK_EVERY)return;
    const s=JSON.stringify(S),pets=S.tanks.filter(t=>t.c).length+(S.stasis||[]).length;
    if(a[0]&&a[0].s===s)return;
    a.unshift({at:now,s,pets,cash:Math.floor(S.cash)});
    try{localStorage.setItem(BAK_KEY,JSON.stringify(a.slice(0,3)))}catch(e){
      try{localStorage.setItem(BAK_KEY,JSON.stringify(a.slice(0,1)))}catch(_){}
    }
  },
  code(){const j=JSON.stringify(S);return 'CHILL1.'+btoa(unescape(encodeURIComponent(j)))},
  parse(txt){
    txt=String(txt||'').replace(/\s+/g,'');
    if(!txt.startsWith('CHILL1.'))return null;
    try{const s=JSON.parse(decodeURIComponent(escape(atob(txt.slice(7)))));return s&&Array.isArray(s.tanks)?s:null}catch(e){return null}
  },
  // Replace the whole game with another save (a backup code, an automatic backup or the cloud copy).
  load(s){
    SAVE_SAFE.snap(true); // the game being replaced becomes a backup itself, so a mistake can be undone
    const keepSound=S.sound,keepMusic=S.music;
    S=s;normalize();if(!S.sound)S.sound=keepSound;if(!S.music)S.music=keepMusic;
    S.rev=myRev;S.lastSeen=Date.now(); // treated as current: no catch-up for time that passed before it was restored
    save();stripKey='';artKey='';close();render(true);fzBtn();
  },
  cloudAt:0,
  async cloudPush(){
    const C=NATIVE.cloud();if(!C||RETIRED)return;
    if(Date.now()-this.cloudAt<5*60*1000)return;
    try{await C.save({data:JSON.stringify(S)});this.cloudAt=Date.now();S.cloudAt=this.cloudAt}catch(e){console.warn('Cloud save failed',e)}
  },
  async cloudPull(){
    const C=NATIVE.cloud();if(!C)return null;
    try{const r=await C.load();const s=r&&r.data?JSON.parse(r.data):null;return s&&Array.isArray(s.tanks)?s:null}catch(e){return null}
  }
};

  const pets=I.pets.map(p=>{

    let line=v>=70?`Doing great · lowest need ${NEED_NAME[k]} ${v}%`:`A bit ${NEED_WORD[k]} · ${NEED_NAME[k]} ${v}%`;
    if(mf.off>1)line+=` · rough molt made needs drop ${mf.off}× faster`;else if(mf.off<1)line+=` · ${mf.n} molt slowed the drain`;
    const lv=c.level>p.l0?`Lv ${p.l0} ➜ ${c.level}`:`Lv ${c.level}`;
    return `<button class="wbpet" data-wbt="${p.ti}" style="text-align:left;color:inherit;font:inherit;width:100%"><span class="mf" style="border-color:${RAR[c.r].color}">${critMini(c)}</span><span class="grow"><b>${esc(c.name)}</b><span class="d${v<50?' wbwarn':''}">${line}</span></span><span class="lv num">${lv}</span></button>`;
  }).join('');
  sheet(`<div class="sheethead"><h2>${icC('moon','#c79bf2')}Welcome back</h2></div>
    <p class="note" style="font-size:14px">You were away ${dur(I.el)}. Here's what your critters got up to.</p>
    <div class="wbstats">${stats.join('')}</div>
    ${pets?`<div style="display:grid;gap:6px">${pets}</div>`:''}
    ${I.advBack?`<button class="ghost" id="wbAdv">${ic('plush')}Collect the adventure coins</button>`:''}
    ${I.back?`<button class="ghost" id="wbMis">${ic('rocket')}See what the ship${I.back>1?'s':''} found</button>`:''}
    <button class="primary" data-close>${ic('check')}Let's go</button>`,'welcome');
  SND.chime();
  $('layer').querySelectorAll('[data-wbt]').forEach(b=>b.onclick=()=>{S.active=+b.dataset.wbt;save();close()});
  const wm=$('wbMis');if(wm)wm.onclick=()=>openMissions();
  const wa=$('wbAdv');if(wa)wa.onclick=()=>openAdventure();
}

// ---------- reminders (local notifications) ----------
// Planned whenever the game goes to the background and cancelled when it comes back, so they always match the
// current game. At most 2 a day, nothing between 9pm and 8am, and every kind can be switched off in Settings.
const NOTIF={
  MAX_DAY:2,QUIET_FROM:21,QUIET_TO:8,DAYS:3,
  plan(){
    const N=S.notif;if(!N||!N.on)return [];
    const now=Date.now(),ev=[];
    if(N.mission)for(const sh of S.ships){if(!sh.m)continue;const M=MISSIONS.find(m=>m.id===sh.type);
      ev.push({kind:'mission',pri:0,at:now+sh.m.left/SPD()*1000,title:`The ${sh.name} is home!`,body:`It brought back a creature from its ${M?M.n.toLowerCase():'mission'}. Come see what it found.`})}
    if(S.adv&&S.adv.left>0)ev.push({kind:'mission',pri:0,at:now+S.adv.left/SPD()*1000,title:'Your plushies are home!',body:'The adventure team is back with a bag of coins.'});
    for(const t of S.tanks)if(t.egg&&t.egg.left>0)ev.push({kind:'mission',pri:0,at:now+t.egg.left/SPD()*1000,title:`${t.egg.parent} is ready to hatch!`,body:'Your pet is wriggling inside its egg. Come crack it open.'});
    if(N.frenzy){let best=null;
      for(const t of S.tanks){const c=t.c;if(!c||c.done)continue;const f=fzSync(c);if(f.n>=FZ_MAX)continue;
        const at=now+fzLeft(c)+(FZ_MAX-f.n-1)*FZ_EVERY;if(!best||at<best.at)best={at,c}}
      if(best)ev.push({kind:'frenzy',pri:1,at:best.at,title:'Feeding Frenzy is ready',body:`${best.c.name} has ${FZ_MAX} snack runs saved up. Free levels are waiting!`})}
    if(N.needs){
      for(const t of S.tanks){const c=t.c;if(!c)continue;const k=lowNeed(c),v=c.needs[k],rate=OFFLINE_DECAY*moltFx(c).off;
        if(v<=52||rate<=0)continue;
        ev.push({kind:'needs',pri:2,at:now+(v-50)/rate*1000,title:`${c.name} is getting ${NEED_WORD[k]}`,body:`${NEED_NAME[k]} is down to half. A little care keeps ${c.name} growing fast.`})}
    }
    // quiet hours: move anything at night to 8am
    for(const e of ev){const d=new Date(e.at),h=d.getHours();
      if(h>=this.QUIET_FROM||h<this.QUIET_TO){if(h>=this.QUIET_FROM)d.setDate(d.getDate()+1);d.setHours(this.QUIET_TO,Math.floor(Math.random()*20),0,0);e.at=d.getTime();e.moved=1}}
    ev.sort((a,b)=>a.at-b.at||a.pri-b.pri);
    const out=[],perDay={},kinds={},end=now+this.DAYS*86400000;
    for(const e of ev){if(e.at>end||e.at<now+60000)continue;const day=new Date(e.at).toDateString();
      if((perDay[day]|0)>=this.MAX_DAY)continue;
      if(kinds[day+e.kind]&&e.kind!=='mission')continue; // one hungry-pet note a day, not one per pet
      // two reminders landing together (say, after quiet hours) are spaced an hour apart
      const prev=out[out.length-1];if(prev&&e.at-prev.at<3600000)e.at=prev.at+3600000;
      perDay[day]=(perDay[day]|0)+1;kinds[day+e.kind]=1;out.push(e)}
    return out;
  },
  async sync(){
    const L=NATIVE.notif();if(!L||RETIRED)return;
    try{await this.clear();
      const list=this.plan();if(!list.length)return;
      await L.schedule({notifications:list.map((e,i)=>({id:100+i,title:e.title,body:e.body,schedule:{at:new Date(e.at),allowWhileIdle:true},smallIcon:'ic_stat_alien'}))});
    }catch(e){console.warn('Reminder scheduling failed',e)}
  },
  async clear(){const L=NATIVE.notif();if(!L)return;try{const p=await L.getPending();if(p&&p.notifications&&p.notifications.length)await L.cancel({notifications:p.notifications.map(n=>({id:n.id}))})}catch(e){}},
  async ask(){
    const L=NATIVE.notif();if(!L)return true;
    try{let p=await L.checkPermissions();if(p.display!=='granted')p=await L.requestPermissions();return p.display==='granted'}catch(e){return false}
  }
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){SAVE_SAFE.snap(true);NOTIF.sync();SAVE_SAFE.cloudPush()}else NOTIF.clear()});
window.addEventListener('pagehide',()=>{SAVE_SAFE.snap(true);NOTIF.sync()});
// In the app, the first time the game opens, ask for notification permission after the first pet is named (not on launch).
let askedNotif=false;
function maybeAskNotif(){if(askedNotif||!NATIVE.notif()||!S.notif.on||S.notifAsked)return;askedNotif=true;S.notifAsked=1;save();NOTIF.ask().then(ok=>{if(!ok){S.notif.on=false;save()}})}

// ---------- rewarded ads ----------
// Two placements: double a Feeding Frenzy reward, and halve a mission's time left (once per flight).
// Up to 15 a day. Ads are always optional: nothing in the game needs them. In the app these are real AdMob rewarded
// video ads; in the browser a short stand-in plays so the flow can be tested.
// Swap in your own ad unit ids from the AdMob console before release; these are Google's public test ids.
const ADS_UNIT={frenzy:'ca-app-pub-3940256099942544/5224354917',mission:'ca-app-pub-3940256099942544/5224354917',egg:'ca-app-pub-3940256099942544/5224354917'};
const ADS={
  CAP:15,inited:false,busy:false,
  today:()=>new Date().toDateString(),
  left(){if(!S.ads||S.ads.day!==this.today())S.ads={day:this.today(),n:0};return this.CAP-S.ads.n},
  ok(){return this.left()>0},
  async init(A){if(this.inited)return;this.inited=true;
    // Pet games often attract kids: ask AdMob for child-safe, non-personalised ads until the Play Console
    // target-audience answers are settled.
    try{await A.initialize({tagForChildDirectedTreatment:true,tagForUnderAgeOfConsent:true,maxAdContentRating:'General'})}catch(e){}},
  async show(where){
    if(this.busy)return false;
    if(!this.ok()){toast("That's all the bonus ads for today. More tomorrow!",ic('clock'));return false}
    this.busy=true;let ok=false;
    try{SND.pause(true)}catch(e){}
    try{
      const A=NATIVE.ads();
      if(A){await this.init(A);
        let got=false;
        const h=await A.addListener('onRewardedVideoAdReward',()=>{got=true});
        try{await A.prepareRewardVideoAd({adId:ADS_UNIT[where]||ADS_UNIT.frenzy,isTesting:false});const r=await A.showRewardVideoAd();ok=got||!!(r&&(r.amount||r.type))}
        finally{try{h&&h.remove&&h.remove()}catch(e){}}
      }else ok=await this.preview(where);
    }catch(e){console.warn('Ad failed',e);toast('No ad is available right now. Try again in a little while.',ic('clock'))}
    finally{this.busy=false;try{SND.pause(document.hidden)}catch(e){}}
    if(ok){this.left();S.ads.n++;save()}
    return ok;
  },
  // Browser stand-in for a rewarded video: 5 seconds, skippable, no reward if skipped.
  preview(where){return new Promise(res=>{
    const secs=5,d=document.createElement('div');d.className='adov';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Ad');
    d.innerHTML=`<div class="adbox"><span class="adtag">Ad preview</span><div class="adart">${ic('sparkle')}&nbsp;Your ad here</div>
      <p class="note" style="font-size:13px">In the Play Store app a short video ad plays here. Watch to the end to get the ${where==='mission'?'mission speed-up':where==='egg'?'warmer egg':'double reward'}.</p>
      <div class="adbar"><i id="adBar"></i></div><button class="ghost" id="adX">Skip (no reward)</button></div>`;
    document.body.appendChild(d);
    let t=0,done=false;const bar=d.querySelector('#adBar'),x=d.querySelector('#adX');
    const iv=setInterval(()=>{t+=.25;bar.style.width=Math.min(100,t/secs*100)+'%';if(t>=secs&&!done){done=true;clearInterval(iv);x.className='primary';x.innerHTML=`${ic('check')}Collect reward`}},250);
    x.onclick=()=>{clearInterval(iv);d.remove();res(done)};
  })}
};

// ---------- first-time tips ----------
// A new game walks through the basics once: feed, pet, the need rings, Feeding Frenzy and the Menu.
// Each tip points at the real button; doing the thing moves on. "Skip tips" ends it, and Settings can replay it.
const TIPS=[
  null,
  {sel:'#mode-feed',h:c=>`Meet ${c.name}!`,p:c=>`Tap <b>Feed</b> to give ${c.name} a snack. Feeding gives the most XP.`,on:'care:feed'},
  {sel:'#mode-pet',h:()=>'Some love, too',p:c=>`Pets need more than food. Tap <b>Pet</b> to give ${c.name} a cuddle.`,on:'care:pet'},
  {sel:'#tray',h:()=>'Keep every ring full',p:c=>`Each ring is a need. When all of them stay high, ${c.name} is Thriving: it grows faster and earns more cash. Needs slowly drop, even while the game is closed.`,next:'Next'},
  {sel:'#fzBtn',h:()=>'Feeding Frenzy',p:()=>`A quick snack-catching game that gives guaranteed levels. A new play is ready every 10 minutes. Try it!`,on:'frenzy',next:'Later'},
  {sel:'#openShop',h:()=>'Everything else',p:()=>`The <b>Menu</b> has the Market for new rocks and pets, your tanks, the Critterpedia and Settings. Have fun!`,next:'Got it'}
];
const COACH={
  el:null,ring:null,
  active(){return typeof S.tut==='number'&&S.tut>0&&S.tut<TIPS.length},
  ev(name){
    if(S.tut===0&&AT().c){S.tut=1}
    if(!this.active())return;const t=TIPS[S.tut];
    if(t.on&&t.on===name){this.go(S.tut+1)}
  },
  go(n){S.tut=n>=TIPS.length?99:n;save();this.draw(true)},
  hide(){if(this.el){this.el.remove();this.el=null}if(this.ring){this.ring.remove();this.ring=null}},
  draw(force){
    if(S.tut===0&&AT().c&&!$('layer').innerHTML){S.tut=1;save();maybeAskNotif()}
    const c=AT().c,t=this.active()&&TIPS[S.tut];
    const target=t&&document.querySelector(t.sel);
    if(!t||!c||RETIRED||$('layer').innerHTML||FZ||LX||ML||!target||target.hidden||!target.offsetParent){this.hide();return}
    const r=target.getBoundingClientRect();
    if(!this.ring){this.ring=document.createElement('div');this.ring.className='coachring';document.body.appendChild(this.ring)}
    Object.assign(this.ring.style,{left:(r.left-5)+'px',top:(r.top-5)+'px',width:(r.width+10)+'px',height:(r.height+10)+'px'});
    if(!this.el||force||this.el.dataset.k!==S.tut+c.name){
      if(this.el)this.el.remove();
      const d=document.createElement('div');d.className='coach';d.dataset.k=S.tut+c.name;d.setAttribute('role','status');
      d.innerHTML=`<h4>${t.h(c)}</h4><p>${t.p(c)}</p><div class="crow"><span style="display:flex;gap:10px;align-items:center"><span class="cstep">Tip ${S.tut} of ${TIPS.length-1}</span><button class="cskip" id="cSkip">Skip tips</button></span>${t.next?`<button class="cnext" id="cNext">${t.next}</button>`:''}</div>`;
      document.body.appendChild(d);this.el=d;
      d.querySelector('#cSkip').onclick=()=>{this.go(99);toast('Tips are off. You can replay them from Settings.',ic('check'))};
      const nx=d.querySelector('#cNext');if(nx)nx.onclick=()=>this.go(S.tut+1);
    }
    // the bubble sits above the button if the button is in the lower half of the screen, otherwise below it
    const H=window.innerHeight,bh=this.el.offsetHeight,up=r.top>H/2;
    const top=up?Math.max(8,r.top-bh-16):Math.min(H-bh-8,r.bottom+16);
    this.el.style.top=top+'px';this.el.classList.toggle('up',up);this.el.classList.toggle('down',!up);
    const er=this.el.getBoundingClientRect();this.el.style.setProperty('--ax',Math.max(20,Math.min(er.width-20,r.left+r.width/2-er.left))+'px');
  }
};
{const _doCare=doCare;doCare=function(){const m=MODE;const out=_doCare.apply(this,arguments);try{COACH.ev('care:'+m)}catch(e){}return out}}
{const _fzOpen=fzOpen;fzOpen=function(){const out=_fzOpen.apply(this,arguments);try{COACH.ev('frenzy');COACH.hide()}catch(e){}return out}}
setInterval(()=>{try{COACH.draw(false)}catch(e){}},300);
window.addEventListener('resize',()=>{try{COACH.draw(true)}catch(e){}});

// ---------- settings additions ----------
const _hubSettings=hubSettings;
let bakArmed=-1,codeArmed=false;
hubSettings=function(el){
  _hubSettings(el);
  const N=S.notif,app=!!NATIVE.notif(),cloud=!!NATIVE.cloud();
  const tg=(id,label,desc,on,dis)=>`<button class="row" data-tg="${id}" aria-pressed="${!!on}" ${dis?'disabled':''}><span class="grow"><b>${label}</b>${desc?`<span class="d">${desc}</span>`:''}</span><span class="sw"></span></button>`;
  const up=NOTIF.plan();
  const baks=SAVE_SAFE.list();
  const html=`
   <div class="sec"><h3>${ic('clock')}Reminders</h3>
    <div class="toggles">
     ${tg('on','Reminders','At most 2 a day, never between 9pm and 8am',N.on)}
     ${tg('mission','Ships coming home','When a mission lands',N.mission,!N.on)}
     ${tg('frenzy','Feeding Frenzy ready','When a pet has all 3 plays saved up',N.frenzy,!N.on)}
     ${tg('needs','Pets needing care','When a need drops to half',N.needs,!N.on)}
    </div>
    ${app?'':`<p class="note">Reminders arrive as phone notifications in the Play Store app. Here's what would be sent if you closed the game now:</p>`}
    ${!app&&N.on?`<div class="uplist">${up.length?up.map(e=>`<div><b>${esc(e.title)}</b><span>${new Date(e.at).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}</span></div>`).join(''):'<div>Nothing planned right now.</div>'}</div>`:''}
   </div>
   <div class="sec"><h3>${ic('pulse')}Vibration</h3><div class="seg two"><button data-hap="1" aria-pressed="${S.haptics!==false}">On</button><button data-hap="0" aria-pressed="${S.haptics===false}">Off</button></div><p class="note">Little buzzes for level-ups, launches and landings.</p></div>
   <div class="sec"><h3>${ic('shell')}Save &amp; backup</h3>
    <p class="note">Your game saves by itself all the time. ${cloud?'It also syncs to Google Play Games whenever you leave the app.':'In the Play Store app it will also sync to your Google Play Games account.'}</p>
    ${cloud?`<button class="ghost" id="cloudLoad">${ic('reset')}Load my cloud save</button>`:''}
    <button class="ghost" id="bakCopy">${ic('book')}Copy a backup code</button>
    <textarea class="backup" id="bakTxt" placeholder="Paste a backup code here to restore it" spellcheck="false" autocomplete="off"></textarea>
    <button class="ghost" id="bakLoad">${ic('reset')}<span id="bakLoadT">Restore from code</span></button>
    ${baks.length?`<p class="note">Automatic backups on this device (tap twice to restore):</p><div class="toggles">${baks.map((b,i)=>`<button class="row" data-bak="${i}"><span class="grow"><b>${new Date(b.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</b><span class="d" id="bakD${i}">${b.pets} creature${b.pets===1?'':'s'} · ${fmt(b.cash)} cash</span></span></button>`).join('')}</div>`:''}
   </div>
   <div class="sec"><h3>${ic('book')}Tips</h3><button class="ghost" id="tipsAgain">${ic('reset')}Show the first-time tips again</button></div>`;
  const anchor=el.querySelector('[data-sp]');
  const wrap=document.createElement('div');wrap.style.display='contents';wrap.innerHTML=html;
  if(anchor)anchor.closest('.sec').before(wrap);else el.appendChild(wrap);
  el.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.tg,v=!S.notif[k];
    if(k==='on'&&v&&app){const ok=await NOTIF.ask();if(!ok){toast('Notifications are blocked. You can allow them in your phone settings.',ic('clock'));return}}
    S.notif[k]=v;save();openHub('settings')});
  el.querySelectorAll('[data-hap]').forEach(b=>b.onclick=()=>{S.haptics=b.dataset.hap==='1';save();try{navigator.vibrate(30)}catch(e){}openHub('settings')});
  $('bakCopy').onclick=async()=>{
    const code=SAVE_SAFE.code(),ta=$('bakTxt');let ok=false;
    try{await navigator.clipboard.writeText(code);ok=true}catch(e){}
    if(!ok){ta.value=code;ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}}
    toast(ok?'Backup code copied. Paste it somewhere safe, like a note or an email to yourself.':'Your backup code is in the box: select it and copy it.',ic('check'));
  };
  $('bakLoad').onclick=()=>{
    const s=SAVE_SAFE.parse($('bakTxt').value);
    if(!s){toast("That doesn't look like a ChillAlien backup code.",ic('x'));codeArmed=false;return}
    if(!codeArmed){codeArmed=true;$('bakLoadT').textContent=`Tap again to replace this game (${petCount(s)} creatures, ${fmt(s.cash||0)} cash)`;return}
    codeArmed=false;SAVE_SAFE.load(s);toast('Backup restored.',ic('check'));
  };
  el.querySelectorAll('[data-bak]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.bak,bk=SAVE_SAFE.list()[i];if(!bk)return;
    if(bakArmed!==i){bakArmed=i;$('bakD'+i).innerHTML='<b style="color:var(--rose)">Tap again to restore this backup</b>';return}
    bakArmed=-1;try{const s=JSON.parse(bk.s);SAVE_SAFE.load(s);toast('Backup restored.',ic('check'))}catch(e){toast("That backup couldn't be read.",ic('x'))}
  });
  const cl=$('cloudLoad');if(cl)cl.onclick=async()=>{const c=await SAVE_SAFE.cloudPull();if(c){close();openCloudOffer(c)}else toast('No cloud save yet.',ic('x'))};
  $('tipsAgain').onclick=()=>{S.tut=AT().c?1:0;save();close()};
  // "Start over" keeps a backup of the old game first, so it can be restored from the list above
  const rb=$('resetBtn');if(rb){const orig=rb.onclick;rb.onclick=()=>{if(rb.dataset.armed)SAVE_SAFE.snap(true);orig()}}
};

// ---------- Back button ----------
// A browser stand-in ad closes on Back (no reward). In the Play Store app, Android's Back button walks back through the
// game the same way, and on the main screen with nothing left to go back to it sends the app to the background.
{const _goBack=goBack;goBack=function(){const a=document.querySelector('.adov');if(a){const x=a.querySelector('#adX');if(x)x.click();return}return _goBack()}}
{const A=NATIVE.P().App;if(A&&A.addListener)try{A.addListener('backButton',()=>{
  const atRoot=!document.querySelector('.adov')&&!$('pv')&&!LX&&!FZ&&!ML&&!$('layer').innerHTML&&!tankTrail.some(i=>i!==S.active&&i<S.tanks.length);
  if(atRoot){try{A.minimizeApp()}catch(e){}}else goBack()})}catch(e){}}

render(true);
// A brand-new game: offer the starter rock straight away.
if(S.freeRock&&!S.tanks.some(t=>t.c)&&!S.stasis.length)setTimeout(()=>{if(S.freeRock&&!$('layer').innerHTML)buyRock(0,true)},700);
})();
