// Second-molt details that sit on the eyes: sparkly eyelashes or cool shades. xs = eye centres, y, r = eye radius, x = face centre.
function eyeAcc(ac,xs,y,r,x,dark,glow){
  if(ac==='lashes'){
    return xs.map(ex=>{const side=xs.length===1?0:ex<x?-1:1;const angs=side<0?[-158,-132,-106]:side>0?[-22,-48,-74]:[-140,-90,-40];
      return angs.map(a=>{const t=a*Math.PI/180,c=Math.cos(t),sn=Math.sin(t);return svgS(`M${(ex+c*r*.95).toFixed(1)} ${(y+sn*r*.95).toFixed(1)} L${(ex+c*r*1.6).toFixed(1)} ${(y+sn*r*1.6).toFixed(1)}`,dark,Math.max(1.4,r*.24))}).join('')
        +star4(+(ex+(side||1)*r*1.55).toFixed(1),+(y-r*1.25).toFixed(1),Math.max(2.4,r*.45),glow||'#fff3b0','class="dk-tw"')
        +star4(+(ex+(side||1)*r*.6).toFixed(1),+(y-r*1.9).toFixed(1),Math.max(1.6,r*.3),'#fff','class="dk-tw" style="animation-delay:-1.2s"')}).join('');
  }
  if(ac==='shades'){
    const w=r*1.45,h=r*1.15;
    let g=xs.map(ex=>`<rect x="${(ex-w).toFixed(1)}" y="${(y-h*.85).toFixed(1)}" width="${(w*2).toFixed(1)}" height="${(h*1.75).toFixed(1)}" rx="${(h*.7).toFixed(1)}" fill="#141a26" stroke="#0b0f17" stroke-width="${Math.max(1,r*.15).toFixed(1)}"/>`
      +svgS(`M${(ex-w*.55).toFixed(1)} ${(y-h*.35).toFixed(1)} L${(ex-w*.05).toFixed(1)} ${(y-h*.35).toFixed(1)}`,'#9fe0f5',Math.max(1.2,r*.22),'opacity=".75"')).join('');
    if(xs.length>1)g+=svgS(`M${(xs[0]+w).toFixed(1)} ${(y-h*.3).toFixed(1)} Q${x} ${(y-h*.75).toFixed(1)} ${(xs[1]-w).toFixed(1)} ${(y-h*.3).toFixed(1)}`,'#0b0f17',Math.max(1.4,r*.25));
    return g;
  }
  return '';
}
// Second-molt details that sit on the head: a hat, crown, bow or flower crown. Drawn last so they sit on top.
function headAcc(ac,m,P){
  const x=m.hx||100,y=(m.hat??m.head)+3,w=Math.max(14,Math.min(26,m.w*.5));
  if(ac==='tophat')return `<g transform="rotate(-8 ${x} ${y})">${svgE(x,y,w*1.15,w*.28,'#1c1b22')}<rect x="${(x-w*.7).toFixed(1)}" y="${(y-w*1.25).toFixed(1)}" width="${(w*1.4).toFixed(1)}" height="${(w*1.25).toFixed(1)}" rx="${(w*.12).toFixed(1)}" fill="#24232c"/><rect x="${(x-w*.7).toFixed(1)}" y="${(y-w*.42).toFixed(1)}" width="${(w*1.4).toFixed(1)}" height="${(w*.26).toFixed(1)}" fill="${P.acc}"/>${svgS(`M${(x-w*.5).toFixed(1)} ${(y-w*1.1).toFixed(1)} V${(y-w*.6).toFixed(1)}`,'#fff',w*.08,'opacity=".25"')}</g>`;
  if(ac==='crown'){const b=y,t=y-w*.95;return svgP(`M${(x-w*.8).toFixed(1)} ${b} L${(x-w*.85).toFixed(1)} ${(t+w*.25).toFixed(1)} L${(x-w*.42).toFixed(1)} ${(b-w*.5).toFixed(1)} L${x} ${t.toFixed(1)} L${(x+w*.42).toFixed(1)} ${(b-w*.5).toFixed(1)} L${(x+w*.85).toFixed(1)} ${(t+w*.25).toFixed(1)} L${(x+w*.8).toFixed(1)} ${b}Z`,'#f1c46b','stroke="#b98a2a" stroke-width="1.4" stroke-linejoin="round"')
    +svgC(x,(t+w*.18).toFixed(1),(w*.13).toFixed(1),'#f28bb0')+svgC((x-w*.85).toFixed(1),(t+w*.3).toFixed(1),(w*.1).toFixed(1),'#7fd6c2')+svgC((x+w*.85).toFixed(1),(t+w*.3).toFixed(1),(w*.1).toFixed(1),'#79c6f2')
    +star4(+(x+w*.4).toFixed(1),+(b-w*.3).toFixed(1),w*.2,'#fff','class="dk-tw"')}
  if(ac==='bow'){const bx=x+w*.55,by=y-w*.15,k=w*.5;return `<g transform="rotate(16 ${bx} ${by})">${svgP(`M${bx} ${by} L${(bx-k*1.4).toFixed(1)} ${(by-k*.9).toFixed(1)} Q${(bx-k*1.7).toFixed(1)} ${by} ${(bx-k*1.4).toFixed(1)} ${(by+k*.9).toFixed(1)}Z M${bx} ${by} L${(bx+k*1.4).toFixed(1)} ${(by-k*.9).toFixed(1)} Q${(bx+k*1.7).toFixed(1)} ${by} ${(bx+k*1.4).toFixed(1)} ${(by+k*.9).toFixed(1)}Z`,'#f28bb0','stroke="#c9557f" stroke-width="1.2" stroke-linejoin="round"')}${star5(bx,by,k*.55,'#f5d65b')}</g>`}
  if(ac==='flowers'){let g=svgS(`M${(x-w*1.05).toFixed(1)} ${(y+w*.15).toFixed(1)} Q${x} ${(y-w*.55).toFixed(1)} ${(x+w*1.05).toFixed(1)} ${(y+w*.15).toFixed(1)}`,'#5ea873',w*.14);
    const cols=['#f28bb0','#f5d65b','#9fe0f5','#c79bf2','#f28bb0'];
    for(let i=0;i<5;i++){const u=i/4,fx=x-w*1.0+u*w*2,fy=y+w*.1-Math.sin(u*Math.PI)*w*.52,r=w*.17;
      for(let k=0;k<5;k++){const a=k/5*Math.PI*2;g+=svgC((fx+Math.cos(a)*r).toFixed(1),(fy+Math.sin(a)*r).toFixed(1),(r*.75).toFixed(1),cols[i])}g+=svgC(fx.toFixed(1),fy.toFixed(1),(r*.55).toFixed(1),'#fff8d6')}
    return g}
  return '';
}
// Eyes and mouth that follow the pet's mood. Cute pets get round shiny eyes and blush; vicious ones get glowing slit eyes,
// a scowl and teeth. The .mouth / .mouthOpen / .blink classes are what the feeding and petting animations switch.
function critFace(P,wb,o){
  const D=P.dark,x=o.x??100,y=o.y,r=o.r,sp=o.sp??0,mx=o.mx??x,my=o.my,mw=o.mw??7,k=mw/8;
  const xs=o.one?[x]:[x-sp,x+sp],sad=wb==='Unhappy'||wb==='Struggling';
  let g='';
  if(o.vic){
    const ir=o.iris||'#ffd23f';
    g+=`<g class="blink">${xs.map(ex=>svgE(ex,y,r,r*.82,ir)+svgE(ex,y,r*.2,r*.68,D)+svgC(ex+r*.38,y-r*.34,r*.16,'#fff','opacity=".85"')).join('')}</g>`;
    if(sad)g+=xs.map(ex=>svgS(`M${ex-r*1.05} ${y-r*.5} H${ex+r*1.05}`,P.shade,r*.75)).join('');
    g+=xs.map((ex,i)=>{if(o.one)return svgS(`M${ex-r*1.25} ${y-r*1.2} L${ex} ${y-r*.62} L${ex+r*1.25} ${y-r*1.2}`,D,Math.max(2.4,r*.32));
      const dir=i?-1:1;return svgS(`M${ex-dir*r*1.15} ${y-r*1.25} L${ex+dir*r*.9} ${y-r*.6}`,D,Math.max(2.4,r*.36))}).join('');
    const n=Math.max(3,Math.round(mw/4)),w=mw*2/n;
    let teeth='';for(let i=0;i<n;i++){const tx=mx-mw+i*w,dip=Math.sin((i+.5)/n*Math.PI)*mw*.32;teeth+=`M${(tx+w*.12).toFixed(1)} ${(my+dip*.55).toFixed(1)} L${(tx+w*.5).toFixed(1)} ${(my+dip*.55+w*.75).toFixed(1)} L${(tx+w*.88).toFixed(1)} ${(my+dip*.55).toFixed(1)}Z `}
    const grin=wb==='Struggling'?.05:wb==='Unhappy'?.25:wb==='Grumpy'?.4:.55;
    g+=`<g class="mouth">${svgP(`M${mx-mw} ${my} Q${mx} ${my+mw*grin+mw*.2} ${mx+mw} ${my} Q${mx} ${my+mw*grin*.4+mw*.08} ${mx-mw} ${my}Z`,D)}${svgP(teeth,'#f4f1e6')}${svgP(`M${mx-mw*.72} ${my+mw*.08} l${mw*.1} ${mw*.42} l${mw*.12} ${-mw*.38}Z M${mx+mw*.72} ${my+mw*.08} l${-mw*.1} ${mw*.42} l${-mw*.12} ${-mw*.38}Z`,'#fff')}</g>`;
    g+=`<g class="mouthOpen">${svgE(mx,my+mw*.38,mw*.95,mw*.72,D)}${svgE(mx,my+mw*.78,mw*.5,mw*.22,'#e0566b')}${svgP(`M${mx-mw*.7} ${my-mw*.25} l${mw*.16} ${mw*.55} l${mw*.16} ${-mw*.5}Z M${mx+mw*.7} ${my-mw*.25} l${-mw*.16} ${mw*.55} l${-mw*.16} ${-mw*.5}Z M${mx-mw*.45} ${my+mw*1.05} l${mw*.12} ${-mw*.42} l${mw*.12} ${mw*.4}Z M${mx+mw*.45} ${my+mw*1.05} l${-mw*.12} ${-mw*.42} l${-mw*.12} ${mw*.4}Z`,'#fff')}</g>`;
    g+=eyeAcc(P.ac,xs,y,r,x,D,P.glow);
    return g;
  }
  if(wb==='Thriving')g+=xs.map(ex=>svgS(`M${ex-r*.8} ${y+r*.22} q${r*.8} ${-r} ${r*1.6} 0`,D,Math.max(2.2,r*.38))).join('');
  else{
    g+=`<g class="blink">${xs.map(ex=>svgC(ex,y,r,'#fff')+svgC(ex+r*.17,y+r*.17,r*.56,D)+svgC(ex+r*.36,y-r*.12,r*.21,'#fff')).join('')}</g>`;
    if(sad)g+=xs.map(ex=>svgS(`M${ex-r*1.1} ${y-r*.66} H${ex+r*1.1}`,P.shade,r*.78)).join('');
  }
  if(o.beak){
    const bc=o.bc||'#f1b35b',w=mw;
    g+=svgP(`M${mx-w} ${my-w*.5} Q${mx} ${my-w*1.1} ${mx+w} ${my-w*.5} L${mx} ${my+w*.9}Z`,bc);
    g+=`<path class="mouth" d="M${mx-w*.5} ${my} H${mx+w*.5}" stroke="${D}" stroke-opacity=".25" stroke-width="1"/>`;
    g+=`<g class="mouthOpen">${svgP(`M${mx-w*.8} ${my-w*.2} L${mx+w*.8} ${my-w*.2} L${mx} ${my+w*1.1}Z`,D)}${svgP(`M${mx-w*.75} ${my+w*.3} L${mx+w*.75} ${my+w*.3} L${mx} ${my+w*1.6}Z`,bc)}</g>`;
  }else{
    const curve={Thriving:9,Content:6,Grumpy:0,Unhappy:-3,Struggling:-7}[wb]*k;
    g+=`<path class="mouth" d="M${mx-mw} ${my} q${mw} ${curve} ${mw*2} 0" stroke="${D}" stroke-width="${Math.max(2,2.8*Math.min(1.1,k))}" fill="none" stroke-linecap="round"/>`;
    g+=`<g class="mouthOpen">${svgE(mx,my+3*k,mw*1.1,mw,D)}${svgE(mx,my+7*k,mw*.68,mw*.38,'#f08a8a')}</g>`;
  }
  if(wb!=='Struggling'&&o.blush!==false){
    const bl=o.one?[[x-r*1.1,y+r*1.7]]:[[x-sp-r*1.15,y+r*1.55],[x+sp+r*1.15,y+r*1.55]];
    g+=bl.map(([bx,by])=>svgC(bx.toFixed(1),by.toFixed(1),(r*.62).toFixed(1),'#f08a8a','opacity=".45"')).join('');
  }
  g+=eyeAcc(P.ac,xs,y,r,x,D,P.glow);
  return g;
}

  const rnd=i=>{const x=Math.sin(i*127.1+t*311.7)*43758.5453;return x-Math.floor(x)};
  const halo=(x,y,r,col,o=1)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${col}" opacity="${(.09*o).toFixed(2)}"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(r*.5)}" fill="${col}" opacity="${(.16*o).toFixed(2)}"/>`;
  const lights=(a,b,c,d,e,g,n,cols,wire='#2c3a36')=>{
    let s=`<path d="M${a} ${b} Q${c} ${d} ${e} ${g}" stroke="${wire}" stroke-width="1.2" fill="none"/>`;
    for(let i=1;i<n;i++){const u=i/n,x=(1-u)*(1-u)*a+2*(1-u)*u*c+u*u*e,y=(1-u)*(1-u)*b+2*(1-u)*u*d+u*u*g+3,col=cols[i%cols.length];
      s+=`<g class="dk-tw" style="animation-delay:${((i*.37)%3).toFixed(2)}s">${halo(x,y,9,col,1.3)}<circle cx="${f(x)}" cy="${f(y)}" r="2.5" fill="${col}"/></g>`}
    return s};
  const pebbles=(list,cols)=>list.map(([x,y,rx,ry],i)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${cols[i%cols.length]}"/><ellipse cx="${f(x-rx*.3)}" cy="${f(y-ry*.4)}" rx="${f(rx*.4)}" ry="${f(ry*.3)}" fill="#fff" opacity=".14"/>`).join('');
  const tuft=(x,y,h,col)=>`<path d="M${x-4} ${y} q1 ${f(-h*.6)} -3 ${-h} M${x} ${y} q0 ${f(-h*.7)} 1 ${f(-h*1.15)} M${x+4} ${y} q0 ${f(-h*.6)} 4 ${f(-h*.9)}" stroke="${col}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const flies=(list,col)=>list.map(([x,y],i)=>`<g class="dk-fly" style="animation-delay:${(-i*1.3).toFixed(1)}s">${halo(x,y,8,col,1.6)}<circle cx="${x}" cy="${y}" r="1.7" fill="${col}"/></g>`).join('');
  const motes=(n,cols,y0=215)=>Array.from({length:n},(_,i)=>`<circle cx="${f(60+i*(280/(n-1)))}" cy="${y0-(i%3)*14}" r="${1.2+(i%2)*.8}" fill="${cols[i%cols.length]}" class="mote" style="animation-delay:${((i*1.1)%6).toFixed(1)}s;animation-duration:${7+i%3}s"/>`).join('');
  const stars=(list,col='#fff')=>list.map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity=".85"${i%2?` class="dk-tw" style="animation-delay:${((i*.53)%3).toFixed(2)}s"`:''}/>`).join('');
  const starField=(n,y0,y1,col='#fff',sz=1)=>stars(Array.from({length:n},(_,i)=>[f(-20+rnd(i)*440),f(y0+rnd(i+99)*(y1-y0)),f((.6+rnd(i+7)*.8)*sz)]),col);
  const mush=(x,y,s,cap,dots,glow)=>`<g>${glow?halo(x,y-10*s,20*s,cap,1.5):''}<path d="M${f(x-2*s)} ${y} L${f(x-1.5*s)} ${f(y-9*s)} H${f(x+1.5*s)} L${f(x+2*s)} ${y}Z" fill="#efe6d6"/><path d="M${f(x-8*s)} ${f(y-8*s)} Q${x} ${f(y-20*s)} ${f(x+8*s)} ${f(y-8*s)} Q${x} ${f(y-5.5*s)} ${f(x-8*s)} ${f(y-8*s)}Z" fill="${cap}"/>${dots?`<circle cx="${f(x-3*s)}" cy="${f(y-11*s)}" r="${f(1.3*s)}" fill="#fff" opacity=".85"/><circle cx="${f(x+3.2*s)}" cy="${f(y-11.5*s)}" r="${f(1.1*s)}" fill="#fff" opacity=".85"/><circle cx="${x}" cy="${f(y-14*s)}" r="${f(.9*s)}" fill="#fff" opacity=".85"/>`:''}</g>`;
  const crystal=(x,y,h,w,col,lt,rot)=>`<g transform="rotate(${rot} ${x} ${y})"><path d="M${x-w} ${y} L${f(x-w*.85)} ${f(y-h*.72)} L${x} ${y-h} L${f(x+w*.85)} ${f(y-h*.72)} L${x+w} ${y}Z" fill="${col}"/><path d="M${x} ${y-h} L${f(x+w*.85)} ${f(y-h*.72)} L${x+w} ${y} L${x} ${y}Z" fill="${lt}" opacity=".45"/><path d="M${f(x-w*.4)} ${f(y-h*.55)} L${f(x-w*.2)} ${f(y-h*.82)}" stroke="#fff" stroke-width="1.2" opacity=".6" stroke-linecap="round"/></g>`;
  const vine=(x,len,col,leaf,berry,d=0)=>{
    let s=`<path d="M${x} -2 C${x+9} ${f(len*.3)} ${x-9} ${f(len*.62)} ${x+2} ${len}" stroke="${col}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    for(let y=14,i=0;y<len-4;y+=13,i++){const vx=x+4*Math.sin(y/len*Math.PI*2),side=i%2?1:-1;
      s+=`<ellipse cx="${f(vx+side*5)}" cy="${y}" rx="5.5" ry="2.5" fill="${leaf}" transform="rotate(${side*28} ${f(vx+side*5)} ${y})"/>`}
    if(berry)s+=halo(x+2,len+3,9,berry,1.4)+`<circle cx="${x+2}" cy="${len+3}" r="2.6" fill="${berry}"/>`;
    return `<g class="dk-swayt" style="animation-delay:${d}s">${s}</g>`};
  // pine: base of trunk at ground y=g, height h
  const pine=(x,g,h,col,snow)=>{const y=g-h*.12;let s=`<rect x="${f(x-h*.03)}" y="${f(y-2)}" width="${f(h*.06)}" height="${f(h*.12+2)}" fill="#2e2016"/>`;
    for(let k=0;k<3;k++){const yy=y-h*k*.28,w=h*(.34-k*.08),tp=yy-h*.46;
      s+=`<path d="M${f(x-w)} ${f(yy)} L${x} ${f(tp)} L${f(x+w)} ${f(yy)}Z" fill="${col}"/>`;
      if(snow)s+=`<path d="M${f(x-w*.5)} ${f(tp+h*.23)} L${x} ${f(tp)} L${f(x+w*.5)} ${f(tp+h*.23)} Q${f(x+w*.2)} ${f(tp+h*.17)} ${x} ${f(tp+h*.22)} Q${f(x-w*.2)} ${f(tp+h*.17)} ${f(x-w*.5)} ${f(tp+h*.23)}Z" fill="${snow}"/><path d="M${f(x-w)} ${f(yy)} Q${x} ${f(yy-4)} ${f(x+w)} ${f(yy)}" stroke="${snow}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`}
    return s};
  const palm=(x,g,h,lean,trunk,l1,l2,d=0)=>{const tx=x+lean,ty=g-h;let s=`<path d="M${x} ${g} Q${f(x-lean*.2)} ${f(g-h*.55)} ${tx} ${ty}" stroke="${trunk}" stroke-width="${f(h*.07)}" fill="none" stroke-linecap="round"/>`;
    for(let i=1;i<7;i++){const u=i/7,px=(1-u)*(1-u)*x+2*(1-u)*u*(x-lean*.2)+u*u*tx,py=(1-u)*(1-u)*g+2*(1-u)*u*(g-h*.55)+u*u*ty;s+=`<path d="M${f(px-h*.035)} ${f(py)} q${f(h*.035)} 3 ${f(h*.07)} 0" stroke="#000" stroke-opacity=".22" stroke-width="1.3" fill="none"/>`}
    const fr=[[-1,-.15,l1],[-1,.35,l2],[-.5,-.45,l2],[.5,-.45,l1],[1,-.15,l2],[1,.35,l1],[0,-.55,l1]];
    let leaves=fr.map(([dx,dy,c])=>{const ex=tx+dx*h*.5,ey=ty+dy*h*.5+h*.12,mx=tx+dx*h*.28,my=ty+dy*h*.4-h*.12;return `<path d="M${f(tx)} ${f(ty)} Q${f(mx)} ${f(my-6)} ${f(ex)} ${f(ey)} Q${f(mx)} ${f(my+6)} ${f(tx)} ${f(ty)}Z" fill="${c}"/>`}).join('');
    return s+`<g class="dk-sway" style="animation-delay:${d}s">${leaves}</g><circle cx="${f(tx-3)}" cy="${f(ty+4)}" r="${f(h*.035)}" fill="#6b4a2a"/><circle cx="${f(tx+3)}" cy="${f(ty+5)}" r="${f(h*.035)}" fill="#5a3d22"/>`};
  const cloud=(x,y,s,col,o=1,cls='')=>`<g opacity="${o}"${cls?` class="${cls}"`:''}><ellipse cx="${x}" cy="${y}" rx="${f(30*s)}" ry="${f(9*s)}" fill="${col}"/><circle cx="${f(x-12*s)}" cy="${f(y-5*s)}" r="${f(10*s)}" fill="${col}"/><circle cx="${f(x+4*s)}" cy="${f(y-10*s)}" r="${f(13*s)}" fill="${col}"/><circle cx="${f(x+18*s)}" cy="${f(y-4*s)}" r="${f(8*s)}" fill="${col}"/></g>`;
  const star5=(cx,cy,R,col,rot=0)=>{let d='';for(let i=0;i<10;i++){const a=(i*36+rot-90)*Math.PI/180,r=i%2?R*.45:R;d+=(i?'L':'M')+f(cx+r*Math.cos(a))+' '+f(cy+r*Math.sin(a))}return `<path d="${d}Z" fill="${col}" stroke="#000" stroke-opacity=".12" stroke-linejoin="round"/>`};
  const spark=(x,y,r,col,d=0)=>`<path d="M${x} ${f(y-r)} Q${x} ${y} ${f(x+r)} ${y} Q${x} ${y} ${x} ${f(y+r)} Q${x} ${y} ${f(x-r)} ${y} Q${x} ${y} ${x} ${f(y-r)}Z" fill="${col}" class="dk-tw" style="animation-delay:${d}s"/>`;
  const falling=(n,draw,y0=-80,y1=150,dur=[6,11],dx=20)=>Array.from({length:n},(_,i)=>{const x=-10+rnd(i+3)*420,y=y0+rnd(i+41)*(y1-y0),du=dur[0]+rnd(i+17)*(dur[1]-dur[0]);
    return `<g class="dk-snow" style="--dx:${f((rnd(i+5)-.3)*dx)}px;animation-duration:${f(du)}s;animation-delay:${f(-rnd(i+23)*du)}s">${draw(x,y,i)}</g>`}).join('');
  const groundTop='M-120 222 L0 221 C50 214 110 222 200 219 C290 216 340 212 400 219 L520 219';
  const ground=`<path d="${groundTop} V520 H-120Z" fill="url(#${p}Gr)"/><path d="${groundTop}" stroke="#fff" stroke-opacity=".09" stroke-width="1.5" fill="none"/>`;
  const pool=`<ellipse cx="200" cy="225" rx="96" ry="11" fill="${C.light}" opacity=".12"/>`;
  let defs=`<linearGradient id="${p}Bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="260"><stop offset="0" stop-color="${C.top}"/><stop offset="1" stop-color="${C.bot}"/></linearGradient>
   <radialGradient id="${p}Lamp"><stop offset="0" stop-color="${C.light}" stop-opacity="${C.la}"/><stop offset="1" stop-color="${C.light}" stop-opacity="0"/></radialGradient>
   <linearGradient id="${p}Gr" gradientUnits="userSpaceOnUse" x1="0" y1="214" x2="0" y2="300"><stop offset="0" stop-color="${C.g3}"/><stop offset=".3" stop-color="${C.g1}"/><stop offset="1" stop-color="${C.g2}"/></linearGradient>
   <radialGradient id="${p}Vig" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>`;
  let gN=0;const glow=(x,y,r,col,o=.5)=>{const id=`${p}Gw${gN++}`;defs+=`<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity="${o}"/><stop offset=".4" stop-color="${col}" stop-opacity="${(o*.45).toFixed(2)}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`;return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id})"/>`};
  let back='',mid='',front='';
  const frond=(r,c)=>`<g transform="rotate(${r})"><path d="M0 0 C-7 -22 -5 -46 0 -64 C5 -46 7 -22 0 0Z" fill="${c}"/><path d="M0 -2 V-60" stroke="#2f6b37" stroke-width="1.2"/></g>`;

  if(K==='Cozy nook'){ // warm lamp, fairy lights, potted sprout, moss and toadstools
    back=`<circle cx="200" cy="-30" r="250" fill="url(#${p}Lamp)"/>
      <path d="M0 200 C80 190 140 206 200 201 C270 195 330 186 400 198 V260H0Z" fill="#0f1c18" opacity=".6"/>
      ${lights(-10,12,110,50,205,26,9,['#f1b35b','#f5d38a','#f08a8a'])}${lights(195,26,300,4,410,36,7,['#f5d38a','#f1b35b','#f08a8a'])}`;
    mid=`${ground}${pool}
      <g transform="translate(88 0)"><g class="dk-sway"><path d="M0 200 q-1 -14 2 -26" stroke="#5f9c57" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M1 186 q-14 -4 -16 -15 q12 0 16 15z" fill="#7cc06d"/><path d="M2 178 q12 -6 16 -16 q-14 0 -16 16z" fill="#8fd27e"/><path d="M2 174 q-6 -8 -2 -14 q5 6 2 14z" fill="#a4e08f"/></g>
        <path d="M-15 204 h30 l-3.5 20 h-23z" fill="#b8693f"/><rect x="-17" y="199" width="34" height="7" rx="2.5" fill="#d07f4f"/><path d="M-8 212 h16" stroke="#9c5733" stroke-width="2" stroke-linecap="round"/></g>
      <ellipse cx="312" cy="222" rx="32" ry="10" fill="#3f6b3a"/><ellipse cx="300" cy="219" rx="16" ry="8" fill="#52844a"/><ellipse cx="324" cy="218" rx="13" ry="7" fill="#4a7a43"/>
      ${mush(306,218,1.2,'#d9604f',1,0)}${mush(323,219,.8,'#e07a55',1,0)}`;
    front=pebbles([[120,230,7,4],[133,237,5,3],[270,232,8,4.5],[287,239,5,3],[66,240,6,3.5],[338,244,7,4],[160,250,4,2.5],[246,251,5,3]],['#7a6f5e','#91856f','#6a6152'])+motes(4,['#f5d38a','#f1b35b']);
  }

  if(K==='Forest'){ // layered pines, sun shafts through mist, giant trunk, fern, mossy log, wildflowers, fireflies, drifting leaves
    back=`<circle cx="230" cy="-40" r="290" fill="url(#${p}Lamp)"/>
      ${[[0,186,120],[46,190,150],[96,184,110],[150,190,90],[250,188,96],[296,184,130],[350,190,150],[400,186,120]].map(([x,g,h])=>pine(x,g,h,'#1f4a3a')).join('')}
      <rect x="-120" y="140" width="640" height="70" fill="#d8efe0" opacity=".07"/>
      ${[[150,120],[210,180],[270,250]].map(([a,b],i)=>`<path d="M${a} -60 H${a+26} L${b+40} 222 H${b}Z" fill="#ffe6a0" fill-opacity=".07" class="dk-shaft" style="animation-delay:${-i*2.2}s"/>`).join('')}
      ${[[20,206,170],[384,208,190]].map(([x,g,h])=>pine(x,g,h,'#143528')).join('')}
      <path d="M0 196 C70 180 130 192 200 188 C270 184 330 172 400 186 V260H0Z" fill="#12302a"/>
      <path d="M-60 -400 H24 C22 40 26 150 38 222 H-60Z" fill="#2e2016"/><path d="M8 -400 C6 0 10 120 20 222 M-6 -400 C-8 20 -4 140 4 222" stroke="#1e140c" stroke-width="2" fill="none"/>
      <path d="M24 120 C30 140 34 170 38 222 L28 222 C24 180 22 150 20 130Z" fill="#4a7a3e" opacity=".8"/>
      ${mush(30,196,.7,'#e8b04a',0,0)}${mush(40,188,.55,'#e8b04a',0,0)}`;
    mid=`${ground}${pool}
      <g transform="translate(96 222)"><g class="dk-sway">${frond(-48,'#3f8a4a')}${frond(-24,'#4f9a5c')}${frond(24,'#4f9a5c')}${frond(48,'#3f8a4a')}${frond(0,'#63b06b')}</g></g>
      <g><rect x="272" y="203" width="74" height="19" rx="9.5" fill="#6b4a32"/><path d="M280 209 h40 M286 215 h48" stroke="#553823" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="346" cy="212.5" rx="6" ry="9.5" fill="#a07a55"/><ellipse cx="346" cy="212.5" rx="3" ry="5" fill="none" stroke="#7d5a3c" stroke-width="1.3"/>
        <ellipse cx="296" cy="204" rx="16" ry="5" fill="#4f8a45"/><ellipse cx="318" cy="203" rx="10" ry="4" fill="#5f9c52"/>${mush(306,203,.8,'#d9604f',1,0)}${mush(284,204,.6,'#d9604f',1,0)}</g>
      ${[[128,'#f28bb0'],[144,'#f5d65b'],[262,'#c79bf2'],[254,'#f28bb0'],[62,'#f5d65b']].map(([x,c],i)=>{const y=222,h=12+i%2*5;return `<g class="dk-sway" style="animation-delay:${-i}s"><path d="M${x} ${y} q2 ${-h/2} 0 ${-h}" stroke="#4f8a45" stroke-width="1.5" fill="none"/>${[0,72,144,216,288].map(a=>`<circle cx="${f(x+3*Math.cos(a*Math.PI/180))}" cy="${f(y-h+3*Math.sin(a*Math.PI/180))}" r="2.3" fill="${c}"/>`).join('')}<circle cx="${x}" cy="${y-h}" r="1.6" fill="#fff4c9"/></g>`}).join('')}
      ${[[54,221],[112,224],[154,220],[244,220],[282,224],[364,219]].map(([x,y],i)=>tuft(x,y,9+i%3*3,i%2?'#5f9c52':'#7cc06d')).join('')}`;
    front=pebbles([[168,242,9,3.5],[204,249,10,3.5],[240,242,9,3.5]],['#5d6b5f','#6c7b6c'])+flies([[120,150],[290,140],[200,110],[70,120]],'#f5d38a')
      +falling(7,(x,y,i)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="3.2" ry="1.6" fill="${['#e8a04a','#d9604f','#a4c84f'][i%3]}" transform="rotate(${i*40} ${f(x)} ${f(y)})"/>`,-60,120,[8,13],40);
  }

  if(K==='Beach'){ // sunset sea, sun on the horizon, palm, waves, sandcastle, crab, starfish, gulls
    defs+=`<linearGradient id="${p}Sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5a8e"/><stop offset=".5" stop-color="#3a7f96"/><stop offset="1" stop-color="#5fb8b8"/></linearGradient>
      <radialGradient id="${p}Sun"><stop offset="0" stop-color="#fff6d0"/><stop offset=".6" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9a5a"/></radialGradient>`;
    back=`${glow(250,160,200,'#ffb87a',.6)}${glow(250,160,80,'#ffe8b0',.7)}
      <circle cx="250" cy="160" r="36" fill="url(#${p}Sun)"/>
      ${cloud(80,70,1.1,'#f6b8b8',.55,'dk-drift')}${cloud(330,40,.8,'#fbd0c0',.5,'dk-drift')}${cloud(170,10,.7,'#e8a8c0',.4,'dk-drift')}
      ${[[110,90,0],[150,70,-2],[300,100,-4]].map(([x,y,d])=>`<g class="dk-fly" style="animation-delay:${d}s"><path d="M${x} ${y} q5 -5 10 0 q5 -5 10 0" stroke="#3a2a48" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`).join('')}
      <rect x="-120" y="162" width="640" height="80" fill="url(#${p}Sea)"/>
      <path d="M20 163 q14 -12 30 -5 q12 -9 30 2z" fill="#2c3a62" opacity=".8"/>
      <path d="M-120 162.5 H520" stroke="#ffe0b0" stroke-opacity=".5" stroke-width="1"/>
      ${[170,176,183,191,200].map((y,i)=>`<ellipse cx="250" cy="${y}" rx="${30-i*3}" ry="1.4" fill="#ffe0a0" opacity="${.8-i*.1}" class="dk-tw" style="animation-delay:${-i*.5}s"/>`).join('')}
      ${[[60,180],[140,192],[330,186],[380,198],[100,204]].map(([x,y],i)=>`<path d="M${x} ${y} q6 -3 12 0" stroke="#dff6ff" stroke-opacity=".45" stroke-width="1.2" fill="none" class="dk-tw" style="animation-delay:${-i*.7}s"/>`).join('')}
      <path d="M-120 214 C-40 206 40 216 120 210 C200 204 280 214 360 208 C420 204 470 210 520 208 V230 H-120Z" fill="#c9a874" opacity=".8"/>
      <g class="dk-bob"><path d="M-120 212 C-60 206 0 214 60 209 C120 204 180 214 240 209 C300 204 360 213 420 208 C460 205 490 210 520 208" stroke="#fff" stroke-opacity=".75" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>`;
    mid=`${ground}
      ${palm(70,224,140,26,'#8a6440','#3f8a4a','#5aa860')}
      <g transform="translate(300 222)"><path d="M-30 0 L-28 -18 H28 L30 0Z" fill="#e3c48a"/><rect x="-26" y="-36" width="16" height="20" fill="#d9b77f"/><rect x="10" y="-36" width="16" height="20" fill="#d9b77f"/><rect x="-9" y="-44" width="18" height="28" fill="#e8cb93"/>
        ${[-26,-20,-14,10,16,22].map(x=>`<rect x="${x}" y="-40" width="4" height="4" fill="#d9b77f"/>`).join('')}${[-9,-3,3].map(x=>`<rect x="${x+1}" y="-48" width="4" height="4" fill="#e8cb93"/>`).join('')}
        <path d="M-4 -18 v-6 a4 4 0 0 1 8 0 v6z" fill="#a8844f"/><path d="M0 -48 v-14" stroke="#7a5a3a" stroke-width="1.3"/><path d="M0 -62 l10 3 l-10 3z" fill="#f08a8a" class="dk-tw"/></g>
      ${star5(146,234,7,'#f08a6a',10)}${star5(352,238,5,'#f5b55a',-8)}
      <g class="dk-bob" style="animation-delay:-1s"><g transform="translate(240 228)"><ellipse cx="0" cy="0" rx="8" ry="5" fill="#e0603a"/><path d="M-7 -1 q-6 -6 -9 -2 q2 4 7 3 M7 -1 q6 -6 9 -2 q-2 4 -7 3" fill="#e0603a"/><path d="M-5 3 l-4 4 M-2 4 l-2 4 M5 3 l4 4 M2 4 l2 4" stroke="#c04a2a" stroke-width="1.3"/><circle cx="-2.5" cy="-5" r="1.4" fill="#1a1a1a"/><circle cx="2.5" cy="-5" r="1.4" fill="#1a1a1a"/></g></g>`;

const toMouth=(px,py,dx,dy,d,inner)=>at(px,py,`<g class="fx-tomouth" style="--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;--d:${d.toFixed(2)}s">${inner}</g>`);
const zg=(z,inner)=>`<g transform="scale(${z.toFixed(2)})"><rect x="-400" y="-400" width="800" height="800" fill="none"/>${inner}</g>`; // scales about 0,0 (the big empty rect centres the box on the origin)
const crumbs=(x,y,n,col,d,sp=18)=>{let h='';for(let i=0;i<n;i++){const a=-Math.PI*(0.15+i*(0.7/Math.max(1,n-1)));h+=at(x,y,`<circle r="1.7" fill="${col}" class="fx-crumb" style="--dx:${(Math.cos(a)*sp).toFixed(1)}px;--dy:${(Math.sin(a)*sp*.8).toFixed(1)}px;--d:${d.toFixed(2)}s"/>`)}return h};

let careEatT=[];
function careFX(mode,c,pl,k=0,mini=false){
  const fx=document.getElementById('fx'),st=$('stage');if(!fx)return;
  if(mini){ // extra taps while a long scene is still playing: just a little sparkle in the tool's colour
    if(RM)return;const m=MODES.find(x=>x.id===mode),j=Math.random();
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','mini');
    g.innerHTML=burstAt(100+(j-.5)*G.w*1.2,G.mid-G.h*(.2+j*.5),4,14,0,m?m.col:'#fff');fx.appendChild(g);
    const mins=fx.querySelectorAll('.mini');if(mins.length>4)mins[0].remove();
    setTimeout(()=>g.remove(),800);return;
  }
  const P=mode==='play'?(pl||PLAYS[0]):null,cls=P?['a-p-'+P.id]:['a-'+mode,'k'+k];
  st.classList.remove('a-feed','a-pet','a-groom','a-play','a-tend','a-eat','k0','k1','k2','k3','k4',...PLAYS.map(p=>'a-p-'+p.id));
  careEatT.forEach(clearTimeout);careEatT=[];
  if(P){const J=Math.round(Math.min(95,Math.max(55,G.h*1.5)));st.style.setProperty('--cy',G.mid+'px');st.style.setProperty('--jump',-J+'px')}
  void st.offsetWidth;st.classList.add(...cls);
  const ms=P?P.ms:KIT_MS[mode]?KIT_MS[mode][k]:1200;
  clearTimeout(st._t);st._t=setTimeout(()=>st.classList.remove(...cls),ms);
  if(RM)return;
  fx.querySelectorAll('.scene').forEach(s=>{if(s.dataset.m!==mode)s.remove()}); // switching tools mid-scene clears the old one
  const h=c.hue;let html='',life=ms+300;
  const Z=Math.min(1.9,Math.max(1.1,G.w/32)),Zh=Math.min(1.5,Math.max(1,G.w/40)); // food and tools grow with the pet
  const bite=t=>{careEatT.push(setTimeout(()=>st.classList.add('a-eat'),Math.max(0,t*1000-140)),setTimeout(()=>st.classList.remove('a-eat'),t*1000+240))};

  if(mode==='feed'){
    const B=BITES[k],fc=`hsl(${(h+180)%360},70%,58%)`;
    if(k===0){ // a few tiny pellets
      const pel=`<ellipse rx="3.6" ry="2.7" fill="#a8774a"/><ellipse cx="-1.1" cy="-1" rx="1.3" ry=".8" fill="#e0b98a" opacity=".75"/>`;
      B.forEach((b,i)=>{html+=at(G.mx+(i-1)*2.5,G.mouth-3,`<g class="fx-dropd" style="--from:${-(G.mouth+20)}px;--d:${(b-.38).toFixed(2)}s"><g class="fx-biteat" style="--b:${b.toFixed(2)}s">${zg(Z,`<g transform="rotate(${i*55})">${pel}</g>`)}</g></g>`);
        html+=crumbs(G.mx,G.mouth,3,'#c9955f',b+.08,12);bite(b)});
    }
    if(k===1){ // fresh fruit: an orange wedge, a berry, a grape
      const wedge=`<path d="M-9 -2a9 9 0 0 0 18 0z" fill="#f4a259" stroke="#ffd9a8" stroke-width="1.5"/><path d="M0 -2v7.5M0 -2l-5.5 5M0 -2l5.5 5" stroke="#ffe8c8" stroke-width="1"/>`;
      const berry=`<circle r="7" fill="${fc}"/><circle cx="-2.5" cy="-2.5" r="2" fill="#fff" opacity=".5"/><path d="M0 -7 q2 -4 6 -4" stroke="#6fbf73" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      const grape=`<circle r="5.5" fill="#9b7fd6"/><circle cx="-1.8" cy="-1.8" r="1.5" fill="#fff" opacity=".5"/>`;
      [[wedge,'#f4a259'],[berry,`hsl(${(h+180)%360},70%,70%)`],[grape,'#c3aef0']].forEach(([art,cc],i)=>{const b=B[i];
        html+=at(G.mx,G.mouth-4,`<g class="fx-dropd" style="--from:${-(G.mouth+20)}px;--d:${(b-.38).toFixed(2)}s"><g class="fx-biteat" style="--b:${b.toFixed(2)}s">${zg(Z,art)}</g></g>`);
        html+=crumbs(G.mx,G.mouth,4,cc,b+.08);bite(b)});
    }
    if(k===2){ // a little bowl of mixed snacks, eaten one piece at a time
      const by=Math.min(G.mouth+26*Z,186),ty=(G.mouth-by)/Z;
      const bowl=`<path d="M-22 -2h44a22 14 0 0 1-44 0z" fill="#5a8fb0"/><ellipse cy="-2" rx="22" ry="5" fill="#86bcd9"/><path d="M-13 10.5h26" stroke="#3f6f8a" stroke-width="2.4" stroke-linecap="round"/><path d="M-17 3q4 5 11 6" stroke="#9fd0ea" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>`;
      const P4=[[-10,-6,`<path d="M-5 2c0-6 4-8 9-8-1 5-3 8-9 8z" fill="#7cc576"/><path d="M-4 1l7-6" stroke="#4e9a4a" stroke-width="1"/>`,'#7cc576'],
        [9,-6,`<circle r="4.6" fill="#f08a3c"/><circle r="2.4" fill="none" stroke="#ffc08a" stroke-width="1"/>`,'#f08a3c'],
        [-1,-9,`<circle r="5" fill="${fc}"/><circle cx="-1.6" cy="-1.6" r="1.4" fill="#fff" opacity=".5"/>`,`hsl(${(h+180)%360},70%,70%)`],
        [3,-4,`<circle cx="-3" r="2.6" fill="#a6d96a"/><circle cx="2" cy="-1" r="2.6" fill="#a6d96a"/><circle cx="0" cy="3" r="2.6" fill="#8fc955"/>`,'#a6d96a']];
      let inner=bowl;
      P4.forEach(([px,py,art,cc],i)=>{const b=B[i];inner+=toMouth(px,py,-px,ty-py,b-.36,art);html+=crumbs(G.mx,G.mouth,3,cc,b+.08);bite(b)});
      html=at(G.mx,by,showG(0,2.0,zg(Z,inner)))+html;
    }
    if(k===3){ // a covered feast plate: the cover lifts, steam rises, then course after course
      const by=Math.min(G.mouth+28*Z,188),ty=(G.mouth-by)/Z;
      const plate=`<ellipse cy="2" rx="33" ry="9" fill="#e9eef0"/><ellipse cy="1" rx="24" ry="5.6" fill="#cfd8dc"/><ellipse cy="2" rx="33" ry="9" fill="none" stroke="#f1c46b" stroke-width="1.4"/>`;
      const P5=[[-15,-4,`<path d="M-7 2a7 7 0 0 1 14 0z" fill="#f3e6cf"/><path d="M-4 -1l1 -2M0 -2.5v-2M4 -1l-1 -2" stroke="#d8c4a0" stroke-width="1" stroke-linecap="round"/>`,'#f3e6cf'], // dumpling
        [15,-4,`<path d="M-7 2a7 7 0 0 1 14 0z" fill="#f3e6cf"/><path d="M-4 -1l1 -2M0 -2.5v-2M4 -1l-1 -2" stroke="#d8c4a0" stroke-width="1" stroke-linecap="round"/>`,'#f3e6cf'],
        [-3,-6,`<path d="M-7 3L7 3 2 -8z" fill="#f7d79c"/><path d="M-7 3L7 3 6.2 -.4 -6 -.4z" fill="#f28bb0"/><circle cx="2.5" cy="-8" r="2.2" fill="#e8485a"/>`,'#f7d79c'], // cake slice
        [6,-3,`<circle cx="-2.5" r="2.6" fill="#9b7fd6"/><circle cx="2.5" r="2.6" fill="#9b7fd6"/><circle cy="-4" r="2.6" fill="#b49af0"/><circle cy="3.6" r="2.4" fill="#8a6cc7"/>`,'#b49af0'], // grapes
        [-8,-2,`<path d="M-6 0c0-5 4-7 9-6 3 1 3 5 1 7-3 2-10 3-10-1z" fill="#7cc576"/>`,'#7cc576']];
      let inner=plate;
      P5.forEach(([px,py,art,cc],i)=>{const b=B[i];inner+=toMouth(px,py,-px,ty-py,b-.36,art);html+=crumbs(G.mx,G.mouth,4,cc,b+.08);bite(b)});
      for(let i=0;i<3;i++)inner+=at(-10+i*10,-12,`<path class="fx-steam" style="--d:${(.55+i*.18).toFixed(2)}s" d="M0 0q-4 -5 0 -10t0 -10" stroke="#e6f1ed" stroke-width="2" fill="none" stroke-linecap="round"/>`);
      inner+=`<g class="fx-lift"><path d="M-26 1a26 21 0 0 1 52 0z" fill="#d6dde0"/><path d="M-18 -8a18 13 0 0 1 14 -9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/><rect x="-28" y="-1" width="56" height="4" rx="2" fill="#aab6bb"/><circle cy="-22" r="3.6" fill="#f1c46b"/></g>`;
      html=at(G.mx,by,showG(0,2.7,zg(Z,inner)))+html;
      html+=burstAt(G.mx,G.mouth-6,8,26,2.62,'#f1c46b',STAR5(3.5));
      html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#f4a259" class="fx-glow2" style="--d:2.5s"/>`);
    }
  }

  if(mode==='pet'){
    const hearts=(n,from,step,col='#f28bb0')=>{let s='';for(let i=0;i<n;i++){const dx=[-14,12,0,-6,16,-18][i%6];s+=at(G.hx+dx*.6,G.head-6,`<path class="fx-rise" style="--dx:${dx}px;--d:${(from+i*step).toFixed(2)}s" d="${HEART}" fill="${col}"/>`)}return s};
    if(k===0){ // one fingertip, a quick scritch on the head
      html=at(G.hx+4,G.head+3,`<g class="fx-scritch" style="--t:.95s;--d:0s">${zg(Zh,FINGER)}</g>`)+hearts(1,.55,0);
    }
    if(k===1){
      html=at(G.hx,G.head-4,`<g class="fx-stroke">${zg(Zh,HAND)}</g>`)+hearts(3,0,.25);
    }
    if(k===2){ // one hand strokes the head while a fingertip scratches under the chin
      html=at(G.hx,G.head-4,`<g class="fx-stroke" style="animation-duration:1.6s">${zg(Zh,HAND)}</g>`);
      html+=at(100+G.w*.9,G.mid-G.h*.15,`<g transform="rotate(-62)"><g class="fx-scritch" style="--t:1.35s;--d:.2s">${zg(Zh,HAND)}</g></g>`); // the other hand cups a cheek
      html+=hearts(5,.2,.24);
    }
    if(k===3){ // spa massage: two hands knead both sides, warm glow, a ring of hearts
      const ox=G.w+8;
      html=at(100-ox,G.mid,`<g transform="rotate(90)"><g class="fx-knead" style="--kx:0px;--ky:-5px">${zg(Zh,HAND)}</g></g>`);
      html+=at(100+ox,G.mid,`<g transform="rotate(-90)"><g class="fx-knead" style="--kx:0px;--ky:-5px">${zg(Zh,HAND)}</g></g>`);
      html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#f28bb0" class="fx-glow2" style="--d:.5s;animation-duration:1.8s"/>`);
      html+=hearts(6,.3,.28);
      html+=burstAt(G.hx,G.head-4,8,34,1.85,'#f28bb0','M0 4C-6 0-5.4-4.6-2.3-4.6-1 -4.6 0-3.3 0-2.6 0-3.3 1-4.6 2.3-4.6 5.4-4.6 6 0 0 4z');
      html+=burstAt(G.hx,G.head-4,6,22,1.95,'#fff3b0');
    }
    if(k===4){ // golden hug (premium): two arms sweep in and wrap the pet, a big golden heart glows behind, hearts everywhere
      const ox=G.w+26,GH='M0 6 C-9 0 -8 -7 -3.5 -7 C-1.5 -7 0 -5 0 -4 C0 -5 1.5 -7 3.5 -7 C8 -7 9 0 0 6z';
      html=at(100,G.mid,`<g class="fx-gheart"><path d="${GH}" transform="scale(${(Math.max(G.w,G.h)/6.5).toFixed(2)})" fill="#f1c46b" opacity=".35"/></g>`);
      html+=at(100-ox,G.mid+G.h*.25,`<g class="fx-hug" style="--hx:${(G.w*.42).toFixed(0)}px"><g transform="rotate(90)">${zg(Zh*.85,HAND.replace(/#f6e1d3/g,'#ffe6a8').replace(/#8a5d4c/g,'#b98a2a'))}</g></g>`);
      html+=at(100+ox,G.mid+G.h*.25,`<g class="fx-hug" style="--hx:${(-G.w*.42).toFixed(0)}px"><g transform="rotate(-90)">${zg(Zh*.85,HAND.replace(/#f6e1d3/g,'#ffe6a8').replace(/#8a5d4c/g,'#b98a2a'))}</g></g>`);
      html+=at(100,G.mid,`<ellipse rx="${(G.w+18).toFixed(0)}" ry="${(G.h+16).toFixed(0)}" fill="#f1c46b" class="fx-glow2" style="--d:.55s;animation-duration:1.9s"/>`);
      html+=hearts(6,.6,.22,'#f1c46b')+hearts(4,.75,.3,'#f28bb0');
      html+=burstAt(100,G.mid-G.h*.2,10,G.w+30,1.7,'#f1c46b',GH);
      html+=burstAt(G.hx,G.head-6,8,28,1.9,'#fff6d6',STAR5(3.4));
    }
  }

  if(mode==='groom'){
    const sw=(G.w*.7).toFixed(0),by=G.mid-G.h*.3;
    const brush=(d,t)=>at(100,by,`<g class="fx-scrub" style="--w:${sw}px;--d:${d}s;--t:${t}s">${zg(Zh,BRUSH)}</g>`);
    const suds=(d0,end,n=9)=>{let s='';for(let i=0;i<n;i++){const x=100+(i-(n-1)/2)*G.w*1.5/n+(i%2?3:-3),y=G.mid-G.h*(.55-((i*37)%10)/14),d=d0+(i%5)*.08+Math.floor(i/5)*.12;
      s+=at(x,y,`<circle r="${(3+(i%3)*1.8).toFixed(1)}" fill="#ffffff" fill-opacity=".55" stroke="#e8f6ff" stroke-width="1.2" class="fx-suds" style="--d:${d.toFixed(2)}s;--t:${(end-d).toFixed(2)}s"/>`)}return s};
    if(k===0){
      html=brush(0,.9);
      html+=burstAt(100,G.mid-G.h*.2,5,G.w*.7,.75,'#cfeaf8','M0 -1.4a1.4 1.4 0 1 0 0.01 0z');
    }
    if(k>=1){
      html=brush(0,.75);
      html+=at(100,by+4,`<g class="fx-scrub" style="--w:${sw}px;--d:.62s;--t:.8s">${zg(Zh,SPONGE)}</g>`);
      const end=k===1?1.6:k===2?1.85:1.75;
      html+=suds(.7,end,k===1?8:11);
      if(k===1)for(let i=0;i<6;i++)html+=at(100+(i-2.5)*G.w*.3,G.mid-G.h*.1,`<circle r="${3+(i%3)*1.5}" fill="#cfeaf8" fill-opacity=".35" stroke="#e8f6ff" stroke-width="1.2" class="fx-pop" style="--d:${(1.25+i*.06).toFixed(2)}s"/>`);
    }
    if(k===3){ // rinse: a shower head pours warm water over everything
      const sy=Math.max(-4,G.head-40);
      html+=at(100,sy,showG(1.28,.82,zg(Zh,SHOWER)));
      for(let i=0;i<22;i++){const x=(((i*41)%34)-17),d=1.42+(i%11)*.055;
        html+=at(100+x,sy+2,`<path d="${DROP}" fill="#9fe0f5" class="fx-rain" style="--d:${d.toFixed(2)}s;--fall:${(G.mid+G.h*.3-sy).toFixed(0)}px"/>`)}
      for(let i=0;i<5;i++)html+=at(100+(i-2)*G.w*.45,G.mid+G.h*.75,`<ellipse rx="5" ry="1.6" fill="#9fe0f5" class="fx-pop" style="--d:${(1.6+i*.07).toFixed(2)}s"/>`);
    }
    if(k>=2){ // blow-dry from the side: warm air lines, fur ruffles, a fluffy shine
      const d0=k===2?1.32:2.0,dx=Math.min(100+G.w+30,232),dy=G.mid-G.h*.15;
      html+=at(dx,dy,`<g class="fx-dryer" style="--d:${d0}s;--t:1.05s">${zg(Zh,DRYER)}</g>`);
      for(let i=0;i<4;i++){const yy=-8+i*6,len=(dx-22-(100+G.w*.2)).toFixed(0);
        html+=at(dx-22,dy+yy-2,`<g class="fx-show" style="--d:${(d0+.12+i*.04).toFixed(2)}s;--t:.85s"><path d="M0 0q${-len/2} ${(i-1.5)*4} ${-len} ${(i-1.5)*9}" stroke="#fff3d6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="7 9" class="fx-dash" opacity=".75"/></g>`)}
      for(let i=0;i<7;i++){const a=Math.PI*(.7+i*.09);
        html+=at(100-G.w*.4,G.mid-G.h*.3,`<path d="M0 0q2 -3 0 -6" stroke="hsl(${h},55%,78%)" stroke-width="1.6" fill="none" stroke-linecap="round" class="fx-spark" style="--dx:${(Math.cos(a)*30).toFixed(1)}px;--dy:${(Math.sin(a)*-22).toFixed(1)}px;--d:${(d0+.3+i*.08).toFixed(2)}s"/>`)}
      const fin=d0+1.05;
      html+=burstAt(100,G.mid-G.h*.2,8,G.w*.9,fin-.05,'#fff3b0');
      if(k===3){html+=burstAt(G.hx,G.head-8,6,28,fin+.1,'#e8f6ff',STAR5(3.2));
        html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#79c6f2" class="fx-glow2" style="--d:${(fin-.15).toFixed(2)}s"/>`)}
    }
  }

  if(mode==='tend'){
    const nx=Math.min(100+G.w+22,228),ny=G.head-18;
    if(k===0){
      html=at(nx,ny,`<g class="fx-spray">${zg(Zh,SPRAY)}</g>`);
      for(let i=0;i<7;i++){const tx=-(G.w*.6+((i*13)%26)),ty=G.h*.2+((i*29)%34)-10;html+=at(nx-12,ny-2,`<circle r="${1.6+(i%3)*.7}" fill="#cdeef6" class="fx-mist" style="--dx:${tx.toFixed(0)}px;--dy:${ty.toFixed(0)}px;--d:${(.2+(i%4)*.09).toFixed(2)}s"/>`)}
      html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#8fd6a0" class="fx-glow"/>`);
    }
    if(k===1){ // pump mister: a pressure tank on the floor, a wand, two long fine clouds
      const tx0=Math.min(100+G.w+40,240);
      html=at(tx0,170,showG(0,1.45,`<rect x="-10" y="-30" width="20" height="30" rx="7" fill="#5ea873"/><rect x="-3" y="-38" width="6" height="9" rx="2" fill="#3f7a52"/><rect x="-8" y="-42" width="16" height="4" rx="2" fill="#3f7a52"/><path d="M-6 -20h12" stroke="#8fd6a0" stroke-width="2"/><path d="M-10 -12 C-30 -10 -24 ${(ny-170+10).toFixed(0)} ${(nx-tx0+4).toFixed(0)} ${(ny-170+6).toFixed(0)}" stroke="#2f5e40" stroke-width="2.4" fill="none"/>`));
      html+=at(nx,ny,`<g class="fx-show" style="--d:.05s;--t:1.35s"><g transform="rotate(-20)"><rect x="-4" y="-3" width="20" height="6" rx="3" fill="#8fd6a0"/><rect x="-14" y="-2" width="12" height="4" rx="2" fill="#5ea873"/><circle cx="-15" r="2.6" fill="#3f7a52"/></g></g>`);
      [.25,.75].forEach((w,j)=>{
        for(let q=0;q<4;q++)html+=at(nx-16,ny+4,`<circle r="${(6+q*2.5).toFixed(1)}" fill="#e2f6fb" fill-opacity=".45" class="fx-mist" style="--dx:${(-G.w*(.35+q*.25)).toFixed(0)}px;--dy:${(q*7-4).toFixed(0)}px;--d:${(w+q*.05).toFixed(2)}s"/>`);
        for(let i=0;i<10;i++){const tx=-(G.w*.7+((i*17)%36)),ty=G.h*.25+((i*29)%40)-14;html+=at(nx-16,ny+4,`<circle r="${1.4+(i%3)*.6}" fill="#e2f6fb" class="fx-mist" style="--dx:${tx.toFixed(0)}px;--dy:${ty.toFixed(0)}px;--d:${(w+(i%5)*.06).toFixed(2)}s"/>`)}});
      html+=at(100,G.mid,`<ellipse rx="${(G.w+14).toFixed(0)}" ry="${(G.h+12).toFixed(0)}" fill="#8fd6a0" class="fx-glow2" style="--d:.6s"/>`);
    }
    if(k===2){ // fog humidifier: a little leafy fogger on the floor fills the tank with soft cloud
      const fx0=Math.max(100-G.w-34,-26);
      html=at(fx0,170,showG(0,2.15,`<rect x="-15" y="-30" width="30" height="30" rx="10" fill="#e6f1ed"/><rect x="-15" y="-12" width="30" height="12" rx="6" fill="#8fd6a0"/><ellipse cy="-30" rx="9" ry="3" fill="#b9cfc8"/><path d="M-4 -19c0-5 4-7 8-7-1 5-3 7-8 7z" fill="#5ea873"/><circle cx="8" cy="-6" r="1.6" fill="#e6f1ed"/>`));

// ---------- care taps ----------
// A tap cares for the creature; a horizontal swipe moves to the neighbouring tank (no wrap-around at either end).
let swipe=null;
$('tank').addEventListener('pointerdown',e=>{

$('tank').addEventListener('pointercancel',()=>{swipe=null});
$('tank').addEventListener('pointerup',e=>{

});
function swipeTank(dir){

  if(to<0||to>=S.tanks.length){tk.classList.remove('edge-l','edge-r');void tk.offsetWidth;tk.classList.add(dir>0?'edge-r':'edge-l');return}
  S.active=to;save();render(true);

// XP per care tap: feeding is worth double the other actions
// It used to be a flat 3 (feeding 6), which meant almost nothing at high levels. Now each tap is a share of the
// current level: about 2% of a level (feeding about 4%), never less than 3 (6 for feeding).
const CARE_XP={feed:6,pet:3,groom:3,play:3,tend:3};
const careXP=(c,mode)=>{const k=mode==='feed'?2:1;return Math.max(CARE_XP[mode]||3,Math.round(need(c)*.02*k))};
function careLocked(){return Date.now()<careLock&&careLockK===S.active}
function careTap(e){if(e.target.closest('button'))return;const T=AT();if(!T.c&&T.egg){if(T.egg.left<=0){crackEgg(S.active);return}const g=$('stage').querySelector('.eggrock');if(g){g.classList.remove('eggtap');void g.getBBox();g.classList.add('eggtap')}SND.rock(false);return}doCare()}
function doCare(){
  S.mode=MODE;const T=AT(),c=T.c;if(!c)return;
  const rect=$('tank').getBoundingClientRect(),x=rect.width/2,y=rect.height*.32;
  const m=MODES.find(m=>m.id===MODE),pts=TOOLS[T.tool].pts,now=Date.now();
  const p=m.id==='play'?playOf(c):null,kk=kitOf(T,m.id),ms=p?p.ms:KIT_MS[m.id][kk];
  const extra=careLocked()&&careLockM===MODE+(p?p.id:''); // spam taps count right away; the running scene keeps playing with a sparkle on top
  if(!extra){careLock=now+ms;careLockK=S.active;careLockM=MODE+(p?p.id:'')}
  // the Golden hug fills 5% of Affection per hug, or the tool's flat amount if that's more
  const addPct=kk===4?Math.max(5,pts/needMax(c)*100):pts/needMax(c)*100;
  c.needs[m.need]=Math.min(100,c.needs[m.need]+addPct);const gain=addPct/100*needMax(c);
  if(extra){careFX(m.id,c,p,kk,true);if(p)SND.care('playtap',c);else SND.care(m.id,c,kk,true)}
  else if(p){careFX('play',c,p);SND.play(p.id,c)}
  else{careFX(m.id,c,null,kk);SND.care(m.id,c,kk)}
  if(!extra)starFX(c);
  if(m.id==='feed'&&!c.done){
    c.feeds++;const fx=careXP(c,'feed'),ups=gainXP(c,fx);float(x-30,y,`+${fmtN(fx)} XP`,'var(--bloom)',200);float(x+40,y+10,`${ic(m.ico)}+${fmtN(gain)} ${m.nn.toLowerCase()}`,m.col,300);
    if(c.feeds%10===0){const pay=tier(c)*2*RAR[c.r].mult;S.cash+=pay;float(x,y-24,`${ic('coin')}+${pay} bonus`,'var(--amber)',350);SND.coin(.35)}
    handleUps(ups,T);
  }else if(!c.done){
    const xp=careXP(c,m.id),ups=gainXP(c,xp);float(x-30,y,`+${fmtN(xp)} XP`,'var(--bloom)',200);float(x+40,y+10,`${ic(m.ico)}+${fmtN(gain)} ${m.nn.toLowerCase()}`,m.col,300);
    handleUps(ups,T);
  }else float(x+30,y,`${ic(m.ico)}+${fmtN(gain)} ${m.nn.toLowerCase()}`,m.col,350);
  render();

// Ascended pets add a little star flourish on top of each normal care animation, plus a soft chime.
// ★1–2: outline (and star mark) pulse · ★3: sparkle burst · ★4: trail swirl · ★5: nebula burst.
function starFX(c){
  const st=Math.min(5,c.star|0);if(!st)return;try{SND.star(st)}catch(e){}
  const fx=document.getElementById('fx');if(RM||!fx||!G.w)return;
  const cx=G.hx||100,cy=G.mid,w=G.w,hh=G.h;let h='';
  if(st>=5)h+=`<defs><radialGradient id="sfxNeb"><stop offset=".55" stop-color="#c79bf2" stop-opacity="0"/><stop offset=".72" stop-color="#c79bf2" stop-opacity=".38"/><stop offset=".86" stop-color="#79c6f2" stop-opacity=".22"/><stop offset="1" stop-color="#f28bb0" stop-opacity="0"/></radialGradient></defs><circle class="sfx-neb" cx="${cx}" cy="${cy}" r="${(w+18).toFixed(1)}" fill="url(#sfxNeb)"/>`;
  h+=`<ellipse class="sfx-pulse" cx="${cx}" cy="${cy}" rx="${(w+6).toFixed(1)}" ry="${(hh+6).toFixed(1)}" fill="none" stroke="#fff3b0" stroke-width="2.4"/>`;
  if(st>=2)h+=`<g class="sfx-pulse" style="animation-delay:.08s">${star5(+(cx+w*.75).toFixed(1),+(cy-hh*.8).toFixed(1),7,'#f6d98a','stroke="#b98a2a" stroke-width=".8"')}</g>`;
  if(st>=3)h+=burstAt(cx,cy-hh*.15,8,w+24,.12,'#fff8d0');
  if(st>=4){const rx=w+16,ry=hh+14;h+=`<path class="sfx-swirl" d="M${(cx+rx).toFixed(1)} ${cy} A${rx.toFixed(1)} ${ry.toFixed(1)} 0 1 1 ${(cx+rx-.5).toFixed(1)} ${(cy-4).toFixed(1)}" pathLength="100" stroke="#fff3b0" stroke-width="3" fill="none" stroke-linecap="round"/>`}
  const g=document.createElementNS(SVGNS,'g');g.setAttribute('class','starfx');g.innerHTML=h;fx.appendChild(g);
  const all=fx.querySelectorAll('.starfx');if(all.length>2)all[0].remove();
  setTimeout(()=>g.remove(),1500);

function bestTankFor(r){let best=-1;S.tanks.forEach((t,i)=>{if(!t.c&&!t.egg&&t.tier>=r&&(best<0||t.tier<S.tanks[best].tier))best=i});return best}
function hatchFromStasis(si,ti){

  else{t.c=kid;if(!quiet){toast(up?`${esc(p.name)}'s egg hatched a ${RAR[kid.r].k} ${what}! ${esc(p.name)} heads off into the wild.`:`${esc(p.name)}'s egg hatched a ${what}. ${esc(p.name)} heads off into the wild.`,icC('egg','var(--ink)'));if(t===AT()){SND.hatch(kid);bigSplash('Hatched!','Time to pick a name',icC('egg',`hsl(${kid.hue},65%,80%)`))}else SND.chime()}}

// Every mission comes home with a creature for stasis. The landing (and the reveal of what it found) plays right away when

function missionReturn(sh,quiet){

  const spec=rollSpec(r,{from:M.n});

// ---------- Growing up: the send-off celebration, ascension, and the Old friends album ----------
// At level 100 a pet is happy, healthy and ready to take on the world. Nothing is paid out yet: the player chooses
// what comes next (ascend by curling up into an egg again, stay as a plushie, or head off into the universe), and
// THAT moment is a big celebration that walks back through the pet's photos and then awards its Friendship badges.
// Ascension: the SAME pet curls up into an egg and hatches back at level 1, one star higher (max ★5). It keeps its
// name, history and its whole wardrobe of unlocked colours and accessories. Each star: +20% gold, +10% XP per level,
// needs 15% smaller, +1 badge at each level-100 celebration. The rebirth can bring a surprise: Striped (from Solid)
// or Prismatic (from Striped).
const EGG_HRS=[2,4,8,16,24];       // hatch time by rarity: Common 2 h, Uncommon 4, Rare 8, Epic 16, Legendary 24 (real hours at speed ×1)
const eggHrs=r=>EGG_HRS[Math.max(0,Math.min(4,r|0))];
const EGG_UP=[.15,.10];             // Solid→Striped, Striped→Prismatic, rolled at each rebirth
const STAR_MAX=5;
const gradBadges=c=>BADGE_BY_R[c.r]+(c.star|0);
const timesWord=n=>n===1?'once':n===2?'twice':n===3?'three times':`${n} times`;
const eggTaps=E=>6+2*Math.min(STAR_MAX,Math.max(1,E.star|0)); // 8 taps at ★1 … 16 at ★5
function snapPet(c,k){
  if(!c)return;if(!Array.isArray(c.snaps))c.snaps=[];const st=c.star|0;
  c.snaps=c.snaps.filter(x=>!(x.k===k&&(x.st|0)===st));
  c.snaps.push({k,st,L:c.level,hue:c.hue,acc:c.acc||'',pat:c.pat|0,alb:albOn(c),at:Date.now()});
}
const SNAP_CAP={hatch:'Hatched',molt1:'First molt',molt2:'Second molt',grown:'All grown up',last:'Last photo'};
const snapCap=s=>(s.st?'★'.repeat(s.st)+' ':'')+(s.k==='hatch'&&s.st?'Reborn':SNAP_CAP[s.k]||'');
// A photo is drawn from the pet's look at that moment.
const snapPet2=(e,s)=>({r:e.r,sp:e.sp,shape:e.shape,name:e.name,star:s.st!=null?s.st|0:e.star|0,hue:s.hue,acc:s.acc||'',pat:s.pat|0,alb:s.alb|0,level:s.L||1,needs:null});
const SNAP_ORD=['hatch','molt1','molt2','grown','last'];
function albumSnaps(c){
  const out=(c.snaps||[]).slice(),st=c.star|0;
  // pets from before photos existed: rebuild what we can
  if(!out.some(x=>x.k==='hatch'))out.unshift({k:'hatch',st:0,L:1,hue:c.hue0!=null?c.hue0:c.hue,acc:'',pat:c.pat|0,alb:0,at:c.born||Date.now()});
  MOLT_LV.forEach((L,i)=>{const k='molt'+(i+1);if(c.molts&&c.molts[L]&&!out.some(x=>x.k===k&&(x.st|0)===st))out.push({k,st,L,hue:c.hue,acc:i?c.acc||'':'',pat:c.pat|0,alb:albOn(c),at:Date.now()})});
  return out.sort((a,b)=>((a.st|0)-(b.st|0))||SNAP_ORD.indexOf(a.k)-SNAP_ORD.indexOf(b.k));
}
const lastGrown=e=>e.snaps.filter(x=>x.k==='grown').pop();
function albumEntry(c,end){
  return {id:nid(),name:c.name,r:c.r,sp:c.sp||'chillie',pat:c.pat|0,alb:albOn(c),shape:c.shape,hue:c.hue,acc:c.acc||'',star:c.star|0,
    level:c.level,feeds:c.feeds||0,asc:c.asc|0,born:c.born||null,at:Date.now(),end,snaps:albumSnaps(c)};
}
function albumAdd(c,end){
  if(!Array.isArray(S.album))S.album=[];
  const e=albumEntry(c,end);S.album.unshift(e);return e;
}
const SEP='sepia';
function polaroid(e,s,id,big){

  return `<figure class="pol${big?' big':''}"><div class="ph ${SEP}">${creatureSVG(cr,{thumb:1,still:1,id,mood})}</div><figcaption><b>${snapCap(s)}</b><span>Lv ${s.L}</span></figcaption></figure>`;
}

// ----- ascension: the pet becomes an egg again -----
function eggFrom(c){
  const star=Math.min(STAR_MAX,(c.star|0)+1),total=eggHrs(c.r)*3600*PACE;
  return {pet:c,r:c.r,sp:c.sp||'chillie',pat:c.pat|0,alb:albOn(c),hue:c.hue,shape:c.shape,star,parent:c.name,left:total,total,ads:0,rv:1,at:Date.now()};
}
// Eggs from the older "left an egg behind" version: turn them back into the pet that laid them.
function eggPet(E){

  const c=newCreature(E.r,E.parent||E.name,E.hue,E.shape,E.sp,E.pat);c.alb=E.alb|0;c.star=Math.max(0,(E.star|0)-1);c.asc=c.star;c.snaps=[];

// The egg's shell tells its story: plain stone at ★1, crystal veins from ★2, a glowing core from ★4.
function eggSVG(E,opts={}){
  const h=E.hue||0,ready=E.left<=0,id=opts.id||'eg',st=Math.min(STAR_MAX,Math.max(1,E.star|0));

  const stars=Array.from({length:st},(_,i)=>star5(100+(i-(st-1)/2)*12,58,4.2,'#f6d98a','stroke="#b98a2a" stroke-width=".6"')).join('');
  const shell='M100 66 C126 66 142 108 142 132 C142 156 124 170 100 170 C76 170 58 156 58 132 C58 108 74 66 100 66Z';
  const veins=st>=2?[`M70 112 L84 120 L80 136 L94 148`,`M128 96 L118 112 L130 124 L120 140`,`M96 78 L104 92 L98 104`,...(st>=3?[`M86 160 L96 150 L108 158 L118 150`,`M64 136 L74 132`]:[])]
    .map(d=>`<path d="${d}" stroke="${veinD}" stroke-width="5" fill="none" stroke-linejoin="round" opacity=".55"/><path d="${d}" stroke="${vein}" stroke-width="2.4" fill="none" stroke-linejoin="round"/><path d="${d}" stroke="#fff" stroke-width=".8" fill="none" opacity=".8"/>`).join(''):'';
  const core=st>=4?`<ellipse cx="100" cy="128" rx="${st>=5?28:22}" ry="${st>=5?32:26}" fill="url(#${id}C)"${opts.still?'':' class="glowpulse"'}/>`:'';

    <radialGradient id="${id}S" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="${stone}"/><stop offset="1" stop-color="${rim}"/></radialGradient>
    <radialGradient id="${id}C"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset=".45" stop-color="${vein}" stop-opacity=".7"/><stop offset="1" stop-color="${vein}" stop-opacity="0"/></radialGradient>
    <clipPath id="${id}K"><path d="${shell}"/></clipPath></defs>
    ${opts.thumb?'':`<ellipse cx="100" cy="169" rx="26" ry="5" fill="#000" opacity=".3"/>`}<g${opts.thumb?'':' transform="translate(100 169) scale(.74) translate(-100 -169)"'}>
    <circle cx="100" cy="112" r="${ready?78:64}" fill="url(#${id}G)" class="${opts.still?'':'glowpulse'}"/>

    <g clip-path="url(#${id}K)">${core}
    <ellipse cx="86" cy="104" rx="6" ry="7" fill="${spot}" opacity=".55"/><ellipse cx="118" cy="128" rx="7" ry="5" fill="${spot}" opacity=".5"/><circle cx="92" cy="150" r="4" fill="${spot}" opacity=".5"/><circle cx="124" cy="100" r="3" fill="${spot}" opacity=".45"/>
    ${veins}</g>

    ${opts.thumb?'':stars}
    ${opts.still?'':[[60,90,0],[142,80,-1.1],[150,140,-2.1],[52,150,-.6]].map(([x,y,d])=>star4(x,y,ready?6:4,'#fff8d0',`class="dk-tw" style="animation-delay:${d}s"`)).join('')}</g></svg>`;
}
function eggLeftTxt(E){return E.left<=0?'Ready to hatch!':`${dur(E.left/SPD())} left`}
function eggAd(ti){
  const T=S.tanks[ti],E=T&&T.egg;if(!E||E.left<=0||(E.ads|0)>=2)return;
  ADS.show('egg').then(ok=>{if(!ok||T.egg!==E)return;E.ads=(E.ads|0)+1;E.left=Math.max(0,E.left*.75);save();SND.chime();toast(`The egg warmed up: ${eggLeftTxt(E)}.`,icC('egg','var(--ink)'));const g=$('gate');if(g)g.dataset.k='';render(true)});

// Hatching again: the same pet, back at level 1 with its new star. Everything it unlocked stays.
function rebirth(E){

// Crack it open, the same way as the very first rock. Higher stars have a tougher shell.
function crackEgg(ti){
  const T=S.tanks[ti],E=T&&T.egg;if(!E||E.left>0)return;

        <span class="note">Back at level 1, and still the same ${esc(c.name)}: ${nc} colour${nc===1?'':'s'} and ${na} accessor${na===1?'y':'ies'} in its wardrobe.${r.newPat?` <b style="color:#f6d98a">And it hatched ${PATN[c.pat]}!</b>`:''} Now earns ${20*c.star}% more gold, and its needs are ${Math.round((1-Math.pow(.85,c.star))*100)}% smaller.</span></div>
        <button class="primary" data-close>${ic('heart')}Welcome back, ${esc(c.name)}</button>`;
      $('layer').querySelectorAll('[data-close]').forEach(x=>x.onclick=close);

  });

// ----- the send-off -----
// how: 'egg' (ascends: becomes an egg again), 'plush' (stays on the shelf), 'go' (heads off for good, with a cash gift)
function growUp(ti,how,swapId){
  const T=S.tanks[ti],c=T&&T.c;if(!c||!c.done||c.egg)return;
  if(how==='egg'&&(c.star|0)>=STAR_MAX)return;
  const R=RAR[c.r];let fb=0,extra={};
  const si=how==='plush'&&T.shelf.length>=SHELF_MAX?T.shelf.findIndex(p=>p.id===swapId):-1;
  if(how==='plush'&&T.shelf.length>=SHELF_MAX&&si<0){openPlushSwap();return}
  if(!c.fb){fb=gradBadges(c);c.fb=1;S.badges=(S.badges|0)+fb}
  c.level=100;snapPet(c,'grown');
  const e=how==='egg'?albumEntry(c,'asc'):albumAdd(c,how);
  if(how==='plush'){
    const pp=toPlush(c);
    if(si>=0){extra.gone=T.shelf[si].name;T.shelf[si]=pp}else T.shelf.push(pp);
    freshPlush=pp.id;shelfKey='';extra.plush=pp;
  }else if(how==='egg'){T.egg=eggFrom(c);extra.egg=T.egg}
  else{S.cash+=R.rel;extra.cash=R.rel}
  T.c=null;S.active=ti;artKey='';stripKey='';save();close();
  gradShow(c,e,how,fb,extra);
}
let GR=null;
function gradShow(c,e,how,fb,extra){
  const pet={...c,needs:{hunger:100,affection:100,clean:100,energy:100,comfort:100}};
  // the reel: this life's photos (for an ascension), or the last few of the whole story

  const molts=MOLT_LV.filter(L=>c.molts&&c.molts[L]).length;
  const conf=RM?'':Array.from({length:26},(_,i)=>`<i class="grc" style="left:${(i*37)%100}%;background:${['#f28bb0','#f5d65b','#7fd6c2','#c79bf2','#79c6f2'][i%5]};animation-delay:${(i%9)*.18}s;animation-duration:${2.6+(i%4)*.5}s"></i>`).join('');
  const ns=how==='egg'?extra.egg.star:0;
  const out=how==='egg'?`${icC('egg','#fff6d6')}<span><b>${esc(c.name)}</b> curled up into an egg again. It will hatch as the same ${esc(c.name)}, now ${'★'.repeat(ns)}, keeping its colours and accessories.</span>`
    :how==='plush'?`${icC('heart','#f28bb0')}<span><b>${esc(c.name)}</b> is staying with you as a plushie${extra.gone?`, taking ${esc(extra.gone)}'s spot`:''}. Take the plushies on adventures!</span>`
    :`${icC('sparkle','#c79bf2')}<span><b>${esc(c.name)}</b> headed off into the universe and left you a gift of ${fmt(extra.cash)} cash.</span>`;
  const d=document.createElement('div');d.className='gr';d.id='gr';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label',`${c.name} is ready to take on the world`);
  d.innerHTML=`<div class="grsky">${conf}</div><div class="grbox">
    <span class="greye">${ic('sparkle')}${how==='egg'?`Happy, healthy and ready to ascend`:`Happy, healthy and ready to take on the world`}</span>
    <h3 class="grname">${esc(c.name)}</h3>
    <div class="grstage"><div class="grpet${how==='plush'?' toplush':how==='egg'?' toegg':' fly'}">${creatureSVG(pet,{thumb:1,id:'grp',mood:'Thriving'})}</div>
      ${how==='egg'?`<div class="gregg">${eggSVG(extra.egg,{id:'gre',thumb:1})}</div>`:''}
      ${how==='plush'?`<div class="grplush">${plushSVG(extra.plush)}</div>`:''}</div>
    <div class="grreel">${snaps.map((s,i)=>`<div class="grp" style="--i:${i};--r:${[-6,4,-3,6][i%4]}deg">${polaroid(e,s,'grs'+i)}</div>`).join('')}</div>
    <div class="grstats">${[days?`${days} day${days>1?'s':''} together`:'',`${fmt(c.feeds||0)} feedings`,`${molts} molt${molts===1?'':'s'}`,c.asc?`reached level 100 ${timesWord((c.asc|0)+1)}`:''].filter(Boolean).join(' · ')}</div>
    ${fb?`<div class="grbadge">${ic('friend')}+${fb} ${badgeWord(fb)}</div>`:''}
    <div class="grout">${out}</div>
    <div class="grbtns"><button class="donebig" id="grGo">${ic('check')}Continue</button>${how==='egg'?'':`<button class="ghost small" id="grAlb">${ic('album')}Open the album</button>`}</div>
  </div>`;
  document.body.appendChild(d);GR={d,timers:[]};
  const T=(ms,f)=>GR.timers.push(setTimeout(f,RM?0:ms));
  SND.levelUp(true);T(500,()=>SND.hi(pet));
  snaps.forEach((s,i)=>T(1100+i*450,()=>SND.click()));
  if(fb)T(1300+snaps.length*450+400,()=>{SND.coin();SND.chime()});
  T(1300+snaps.length*450+1500,()=>{d.classList.add('act');if(how==='plush')SND.squeak(extra.plush);else if(how==='egg')SND.rock(true);else SND.bye(pet)});
  d.style.setProperty('--n',snaps.length);

  $('grGo').onclick=done;const ga=$('grAlb');if(ga)ga.onclick=()=>{done();openAlbumPage(e.id)};
  try{navigator.vibrate&&navigator.vibrate([20,80,30])}catch(err){}
}

// ----- molt wardrobe -----
// Every colour and accessory a pet unlocks through its molts stays in its wardrobe, across every ascension. The player
// picks which colour and accessory it shows. New molts never repeat a colour family or accessory the pet already has,
// until it has them all.
const HUE_FAM=12; // colour families of 30° each
const hueFam=h=>Math.floor((((h|0)%360)+360)%360/30);
function wardOf(c){
  if(!c.ward||typeof c.ward!=='object')c.ward={};
  const W=c.ward;if(!Array.isArray(W.hues))W.hues=[];if(!Array.isArray(W.accs))W.accs=[];
  const h0=c.hue0!=null?c.hue0:c.hue;
  for(const h of [h0,c.hue])if(h!=null&&!W.hues.includes(h))W.hues.push(h);
  if(c.acc&&ACCS[c.acc]&&!W.accs.includes(c.acc))W.accs.push(c.acc);
  if(c.alb)W.alb=1;
  return W;
}
function rollWardHue(c){
  const W=wardOf(c),used=new Set(W.hues.map(hueFam));
  let free=[...Array(HUE_FAM).keys()].filter(f=>!used.has(f));
  if(!free.length)free=[...Array(HUE_FAM).keys()].filter(f=>f!==hueFam(c.hue));
  const f=free[Math.floor(Math.random()*free.length)];return f*30+4+Math.floor(Math.random()*22);
}
function rollWardAcc(c){
  const W=wardOf(c);let ks=Object.keys(ACCS).filter(k=>!W.accs.includes(k));
  if(!ks.length)ks=Object.keys(ACCS).filter(k=>k!==c.acc);
  return ks[Math.floor(Math.random()*ks.length)];
}
function wardAdd(c,look){
  const W=wardOf(c);
  if(look.hue!=null&&!W.hues.includes(look.hue))W.hues.push(look.hue);
  if(look.acc&&!W.accs.includes(look.acc))W.accs.push(look.acc);
  if(look.alb)W.alb=1;
}
function wardHTML(c){
  const W=wardOf(c),cur=c.hue,a=c.acc||'';
  const sw=W.hues.map(h=>`<button class="wsw" data-wh="${h}" aria-pressed="${!albOn(c)&&h===cur}" style="--h:hsl(${h},${(spOf(c).pal||{}).s??55}%,${(spOf(c).pal||{}).l??62}%)" aria-label="Colour ${h}"></button>`).join('')
    +(W.alb?`<button class="wsw alb" data-walb="1" aria-pressed="${!!albOn(c)}" aria-label="Albino skin"></button>`:'');
  const ac=[['',`No accessory`],...W.accs.map(k=>[k,ACCS[k].n])].map(([k,n])=>`<button class="wac" data-wa="${k}" aria-pressed="${a===k}">${n}</button>`).join('');
  const nh=W.hues.length+(W.alb?1:0);
  return `<p class="note" style="margin:0">Every colour and accessory ${esc(c.name)} unlocks through molts stays here for good, even after ascending. Tap one to wear it.</p>
    <div class="wrow"><span class="wlab">Colours · ${nh}</span><div class="wsws">${sw}</div></div>
    <div class="wrow"><span class="wlab">Accessories · ${W.accs.length} of ${Object.keys(ACCS).length}</span><div class="wacs">${ac}</div></div>`;
}
function bindWard(el,c){
  el.querySelectorAll('[data-wh]').forEach(b=>b.onclick=()=>{c.hue=+b.dataset.wh;if(c.alb)c.albOff=1;wardChanged(c)});
  el.querySelectorAll('[data-walb]').forEach(b=>b.onclick=()=>{delete c.albOff;wardChanged(c)});
  el.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{c.acc=b.dataset.wa;wardChanged(c)});
}
function wardChanged(c){SND.click();save();artKey='';stripKey='';render(true);fillCard();fillWard()}
// The wardrobe opens from the little hanger next to the pet in the tank.
function openWardrobe(){
  const c=AT().c;if(!c)return;c.wardSeen=wardCount(c);save();wardBtn(true);
  sheet(`<div class="sheethead"><h2>${icC('hanger','#c79bf2')}Wardrobe</h2>${doneBtn}</div><div class="wardprev" id="wardPrev"></div><div id="wardBox" class="sec ward"></div>`,'ward');
  fillWard();
}
function fillWard(){
  const c=AT().c,w=$('wardBox');if(!w||!c)return;
  const k=JSON.stringify([c.ward,c.hue,c.acc,albOn(c)]);if(w.__k===k)return;w.__k=k;
  $('wardPrev').innerHTML=creatureSVG(c,{thumb:1,id:'wdp',still:1});
  w.innerHTML=wardHTML(c)+(wardCount(c)<=1?`<p class="note" style="margin:0">${esc(c.name)}'s molts at level ${MOLT_LV.join(' and ')} unlock new colours and accessories.</p>`:'');bindWard(w,c);
}
const wardCount=c=>{const W=wardOf(c);return W.hues.length+(W.alb?1:0)+W.accs.length};
// Place the hanger just beside the pet (right of its body), in screen pixels.
function wardBtn(force){
  const b=$('wardBtn'),T=AT(),c=T.c;if(!b)return;
  const show=!!c&&!$('stage').hidden;b.hidden=!show;if(!show)return;
  if(!b.__init){b.__init=1;b.innerHTML=ic('hanger');b.onclick=e=>{e.stopPropagation();SND.click();openWardrobe()}}
  b.classList.toggle('new',wardCount(c)>(c.wardSeen||1));
  const tk=$('tank'),W=tk.clientWidth,H=tk.clientHeight,sc=Math.min(W/200,H/210),ox=(W-200*sc)/2,oy=(H-210*sc)/2;
  if(!G||G.mid==null)return;
  let x=ox+(G.hx+G.w+12)*sc,y=oy+(G.mid+10+G.h*.35)*sc;
  x=Math.min(W-62,Math.max(24,x));y=Math.min(H-70,Math.max(150,y));
  b.style.left=x.toFixed(0)+'px';b.style.top=y.toFixed(0)+'px';
}

    <div class="albpage">${rest.map((s,i)=>`<div style="--r:${[-4,3,-2,4][i%4]}deg">${polaroid(e,s,'ap'+i)}<span class="albdate">${dt(s.at)}</span></div>`).join('')}</div>

      <div class="stat"><span>${ic('star')}Level</span><b class="num">${e.level}${e.asc?` · reached 100 ${timesWord(e.asc+(e.level>=100?1:0))}`:''}</b></div></div></div>`,'albpage:'+id);

// ---------- Plushies: the shelf viewer and idle adventures ----------
// Plushies no longer earn just by sitting there. Pick a team of up to 4 (from any tank's shelf) and send them on an
// adventure across the universe: they march along, bop the little evils they meet and pick up coins. One adventure at
// a time; it runs while the game is closed, and the coins are collected when the team gets home.
const ADV_ROUTES=[
 {id:'meadow',n:'Moonlit meadow',hrs:.5,mult:1,  ev:'goo',  col:'#8fd6a0',d:'A short stroll. Grumble goos hide in the grass.'},
 {id:'caves', n:'Crystal caves', hrs:2, mult:1.1,ev:'spark',col:'#7fb8f0',d:'Glittering tunnels full of static sprites.'},
 {id:'rift',  n:'The void rift', hrs:8, mult:1.25,ev:'moth', col:'#c79bf2',d:'A long trek to the edge of space. Void moths everywhere.'}];
const ADV_TEAM=[0,1,1.1,1.2,1.35];  // a bigger team works better together
const ADV_EVIL={
 goo:{n:'Grumble goo',svg:`<svg viewBox="-20 -20 40 40"><path d="M-15 12C-17 0-10-14 0-14S17 0 15 12Z" fill="#9a5ad8"/><path d="M-15 12q4-4 7 0q4-4 8 0q4-4 7 0q3-3 8 0" fill="#7a3ab8"/><path d="M-8-4l5 2M8-4l-5 2" stroke="#1b0e2a" stroke-width="2" stroke-linecap="round"/><circle cx="-5" cy="0" r="2" fill="#fff"/><circle cx="5" cy="0" r="2" fill="#fff"/><path d="M-4 6q4-3 8 0" stroke="#1b0e2a" stroke-width="1.6" fill="none"/></svg>`},
 spark:{n:'Static sprite',svg:`<svg viewBox="-20 -20 40 40"><path d="M0-17L5-6L16-8L8 1L14 12L2 7L-6 16L-5 4L-16 0L-5-4Z" fill="#f5d65b" stroke="#c99a1a" stroke-width="1.4" stroke-linejoin="round"/><path d="M-5-2l3 1M5-2l-3 1" stroke="#3a2a06" stroke-width="2" stroke-linecap="round"/><path d="M-3 5h6" stroke="#3a2a06" stroke-width="1.6" stroke-linecap="round"/></svg>`},
 moth:{n:'Void moth',svg:`<svg viewBox="-20 -20 40 40"><path d="M0 0C-8-16-20-12-17 0C-20 10-8 14 0 4C8 14 20 10 17 0C20-12 8-16 0 0Z" fill="#2a1d4a" stroke="#6a5ad8" stroke-width="1.2"/><ellipse cx="0" cy="2" rx="3" ry="8" fill="#151028"/><circle cx="-7" cy="-3" r="2.2" fill="#b6ff4a"/><circle cx="7" cy="-3" r="2.2" fill="#b6ff4a"/></svg>`}};
const allPlush=()=>{const out=[];S.tanks.forEach((t,ti)=>(t.shelf||[]).forEach(p=>out.push({p,ti})));return out};
const plushById=id=>{for(const t of S.tanks)for(const p of t.shelf||[])if(p.id===id)return p;return null};
const onAdv=p=>!!(S.adv&&S.adv.team.includes(p.id));
function advEstimate(ids,route){const R=ADV_ROUTES.find(r=>r.id===route)||ADV_ROUTES[0];let pw=0;for(const id of ids){const p=plushById(id);if(p)pw+=plushRate(p)}return Math.round(pw*R.hrs*R.mult*(ADV_TEAM[ids.length]||1))}
function advStart(ids,route){
  if(S.adv||!ids.length)return;const R=ADV_ROUTES.find(r=>r.id===route);if(!R)return;
  const total=R.hrs*3600*PACE,coins=Math.round(advEstimate(ids,route)*(.9+Math.random()*.2));
  // what happens on the way is decided now, so the log reads the same every time you look
  const n=Math.max(4,Math.round(R.hrs*3+3)),ev=[];
  for(let i=0;i<n;i++){const x=Math.random();ev.push({at:(i+.5+Math.random()*.4)/(n+.5),k:x<.62?'fight':x<.82?'find':'rest',who:ids[Math.floor(Math.random()*ids.length)]})}
  S.adv={team:ids.slice(0,4),route,left:total,total,coins,ev,at:Date.now()};save();SND.chime();
}
const advFrac=A=>A?Math.min(1,1-A.left/A.total):0;
function advLog(A){
  const R=ADV_ROUTES.find(r=>r.id===A.route),E=ADV_EVIL[R.ev],f=advFrac(A),nm=id=>{const p=plushById(id);return p?esc(p.name):'A plushie'};
  return A.ev.filter(e=>e.at<=f).map(e=>e.k==='fight'?`${icC('sword','#f28bb0')}<span>${nm(e.who)} bopped a ${E.n}!</span>`:e.k==='find'?`${ic('coin')}<span>${nm(e.who)} found a little pile of coins.</span>`:`${icC('moon','#c79bf2')}<span>The team rested by a campfire.</span>`).reverse();
}
function advCollect(){
  const A=S.adv;if(!A||A.left>0)return;S.cash+=A.coins;const c=A.coins;S.adv=null;save();SND.coin();SND.levelUp(false);
  toast(`The adventure team is home with ${fmt(c)} coins!`,icC('plush','#f28bb0'));openAdventure();
}
function advTick(dt){const A=S.adv;if(!A||A.left<=0)return false;A.left-=dt;if(A.left<=0){A.left=0;return true}return false}

// The tank's own shelf, big: swipe through the plushies one by one.

  sheet(`<div class="sheethead"><h2>${ic('plush')}Plushies</h2>${doneBtn}</div>
    ${sh.length?`<div class="pcar" id="pcar">${sh.map((p,i)=>`<div class="pslide" data-i="${i}"><button class="pbig" data-sq="${p.id}" aria-label="Squeeze ${esc(p.name)}">${plushSVG(p)}</button>
      <b class="pnm">${esc(p.name)}</b><span class="kind">${rlabel(p.r)}<span>${esc(spOf(p).n)}</span>${lookChips(p)}</span>

      <p class="note" style="text-align:center">Swipe to see every plushie on tank ${S.active+1}'s shelf. Tap one to squeeze it.</p>`
    :`<div class="emptybox" style="max-width:none;justify-self:stretch"><span class="bigic">${ic('plush')}</span><h4>No plushies in this tank</h4><span class="note">When a pet reaches level 100, you can keep it as a plushie on its tank's shelf.</span></div>`}
    <button class="primary" id="toAdv">${icC('sword','var(--dark)')}${advTxt}</button>`,'plushies');
  const car=$('pcar');
  if(car){const w=()=>car.clientWidth;requestAnimationFrame(()=>{car.scrollLeft=(start|0)*w()});
    car.addEventListener('scroll',()=>{const i=Math.round(car.scrollLeft/Math.max(1,w()));$('pdots').querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===i))},{passive:true});
    car.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{const p=sh.find(x=>x.id===b.dataset.sq);if(p)SND.squeak(p);b.classList.remove('squeeze');void b.offsetWidth;b.classList.add('squeeze')});
    car.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>openPlush(b.dataset.card))}
  $('toAdv').onclick=()=>openAdventure();
}

let advPick=null,advRoute='meadow',advFx=0;
function openAdventure(){
  clearInterval(advFx);
  const A=S.adv;
  if(A){
    const R=ADV_ROUTES.find(r=>r.id===A.route),E=ADV_EVIL[R.ev],home=A.left<=0;
    sheet(`<div class="sheethead"><h2>${icC('sword','#f28bb0')}Adventure</h2>${doneBtn}</div>
      <div class="advscene${home?' home':''}" id="advScene" style="--rc:${R.col}"><div class="advbg"></div><div class="advground"></div>
        <div class="advteam">${A.team.map(id=>{const p=plushById(id);return p?`<span class="advp">${plushSVG(p)}</span>`:''}).join('')}</div><div class="advfx" id="advFx"></div>
        <span class="advtag">${home?`${ic('check')}Home again!`:`${esc(R.n)} · ${Math.round(advFrac(A)*100)}%`}</span></div>
      <div class="prog"><i id="advProg" style="width:${advFrac(A)*100}%;background:${R.col}"></i></div>
      <div class="row"><span class="lead">${ic('coin')}</span><span class="grow"><b>${home?`Brought home ${fmt(A.coins)} coins`:`About ${fmt(A.coins)} coins`}</b><span class="d" id="advLeft">${home?'Tap collect to add them to your cash.':`Back in ${dur(A.left/SPD())}`}</span></span>${home?`<button class="primary small" id="advGet">${ic('coin')}Collect</button>`:''}</div>
      <div class="sec"><h3>${ic('book')}Adventure log</h3><div class="advlog" id="advLog">${advLog(A).map(x=>`<div>${x}</div>`).join('')||'<div class="muted">Just set off…</div>'}</div></div>`,'adv');
    const g=$('advGet');if(g)g.onclick=advCollect;
    if(!home&&!RM){let n=0;advFx=setInterval(()=>{const fx=$('advFx');if(!fx){clearInterval(advFx);return}
      const A2=S.adv;if(!A2){clearInterval(advFx);return}
      $('advProg').style.width=advFrac(A2)*100+'%';$('advLeft').textContent=A2.left>0?`Back in ${dur(A2.left/SPD())}`:'Home!';
      if(A2.left<=0){clearInterval(advFx);openAdventure();return}
      n++;if(n%2)return; // a new little encounter every ~3 s
      const e=document.createElement('span');e.className='advevil';e.innerHTML=E.svg;fx.appendChild(e);
      setTimeout(()=>{const pow=document.createElement('span');pow.className='advpow';pow.textContent=['POW!','BOP!','BONK!','ZAP!'][Math.floor(Math.random()*4)];fx.appendChild(pow);
        const cn=document.createElement('span');cn.className='advcoin';cn.innerHTML=ic('coin');fx.appendChild(cn);SND.click();
        setTimeout(()=>{pow.remove();cn.remove()},900)},1250);
      setTimeout(()=>e.remove(),1500);
      const lg=$('advLog');if(lg){const h=advLog(A2).map(x=>`<div>${x}</div>`).join('');if(lg.__h!==h){lg.__h=h;lg.innerHTML=h||'<div class="muted">Just set off…</div>'}}
    },1500)}
    return;
  }
  const all=allPlush();
  if(!advPick)advPick=all.slice(0,4).map(x=>x.p.id);
  advPick=advPick.filter(id=>plushById(id));
  const est=advEstimate(advPick,advRoute);
  sheet(`<div class="sheethead"><h2>${icC('sword','#f28bb0')}New adventure</h2>${doneBtn}</div>
    <p class="note">Pick up to 4 plushies from any shelf. They head out together, bop the evils of the universe and bring home coins. This is how plushies earn now.</p>
    ${all.length?`<div class="advpick">${all.map(({p,ti})=>{const on=advPick.includes(p.id);return `<button class="advc" data-pk="${p.id}" aria-pressed="${on}"><span class="pl">${plushSVG(p)}</span><b>${esc(p.name)}</b><span>${fmt(plushRate(p))} power · tank ${ti+1}</span></button>`}).join('')}</div>`
      :`<div class="emptybox" style="max-width:none;justify-self:stretch"><span class="bigic">${ic('plush')}</span><h4>No plushies yet</h4><span class="note">Grow a pet to level 100 and keep it as a plushie to start adventuring.</span></div>`}
    <div class="sec"><h3>${ic('rocket')}Where to?</h3><div class="list">${ADV_ROUTES.map(r=>`<button class="row" data-rt="${r.id}" aria-pressed="${advRoute===r.id}" style="${advRoute===r.id?`border-color:${r.col};box-shadow:0 0 0 1px ${r.col} inset`:''}"><span class="lead" style="width:34px;height:34px;display:block">${ADV_EVIL[r.ev].svg}</span><span class="grow"><b>${r.n}</b><span class="d">${r.d}</span></span><span class="amt">${ic('clock')}${dur(r.hrs*3600*PACE/SPD())}</span></button>`).join('')}</div></div>
    ${(AT().shelf||[]).length?`<button class="ghost" id="advShelf">${icC('plush','#f28bb0')}See this tank's plushies</button>`:''}
    <button class="primary" id="advGo" ${advPick.length?'':'disabled'}>${icC('sword','var(--dark)')}Set off with ${advPick.length||'no'} plushie${advPick.length===1?'':'s'} · about ${coin(est)}</button>`,'advnew');
  $('layer').querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{const id=b.dataset.pk,i=advPick.indexOf(id);if(i>=0)advPick.splice(i,1);else{if(advPick.length>=4){toast('A team has room for 4 plushies.',icC('plush','var(--muted)'));return}advPick.push(id)}SND.click();openAdventure()});
  $('layer').querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{advRoute=b.dataset.rt;SND.click();openAdventure()});
  {const sb=$('advShelf');if(sb)sb.onclick=()=>openPlushies()}
  const go=$('advGo');if(go)go.onclick=()=>{if(!advPick.length)return;advStart(advPick,advRoute);stripKey='';shelfKey='';openAdventure()};
}
// Adventure lives in the header next to Missions. A red dot shows when the team is home with coins to collect.
function plushBtn(){
  const b=$('openAdv');if(!b)return;const A=S.adv,home=!!A&&A.left<=0;
  const k=(A?(home?'h':Math.ceil(A.left/SPD()/60)):'-')+'|'+allPlush().length;if(b.dataset.k===k)return;b.dataset.k=k;
  b.classList.toggle('ping',home);const bd=$('advBadge');bd.hidden=!home;bd.textContent='!';

// ---------- Mission control: one ship per mission, with launch and landing scenes ----------
const SHIP_COL={survey:'#7fd6c2',deep:'#f1b35b',core:'#c79bf2'};
// A ship drawn with its engine nozzles at 0,0, pointing up. The hatch (class lx-door) opens on landing.
function shipArt(type){
  if(type==='deep')return `<rect x="-33" y="-72" width="11" height="52" rx="5.5" fill="#c97a2a"/><rect x="22" y="-72" width="11" height="52" rx="5.5" fill="#c97a2a"/>
    <path d="M-20 -98 L0 -140 L20 -98Z" fill="#aab3be"/><path d="M-13 -112 L9 -102 M-8 -124 L5 -118 M-15 -101 L14 -99" stroke="#6c7480" stroke-width="2.4"/>

let onSheetClose=null;
// key: when the same menu is redrawn (e.g. after a purchase) its scroll position is kept instead of jumping to the top.
function sheet(html,key){
  const l=$('layer'),old=l.querySelector('.sheet'),keep=key&&old&&l.dataset.key===key?old.scrollTop:0;l.dataset.key=key||'';
  // A screen being replaced (e.g. by the Back button) still gets its closing step: an uncracked rock cracks on its own,
  // an unnamed pet keeps the name typed so far. Without this, the next rock bought overwrote the first one's creature.
  if(onSheetClose){const f=onSheetClose;onSheetClose=null;try{f()}catch(e){console.error(e)}}

    S.stasis.push(spec);dexAdd(spec);save();return spec};
  onSheetClose=()=>{if(!done){const sp=finish();
    // the starter pet goes straight into the empty starter tank
    if(free){const si=S.stasis.indexOf(sp),ti=bestTankFor(sp.r);if(si>=0&&ti>=0){S.stasis.splice(si,1);const t=S.tanks[ti];t.c=newCreature(sp.r,sp.name,sp.hue,sp.shape,sp.sp,sp.pat);t.c.unnamed=true;S.active=ti;save();toast('The rock cracked on its own. Say hello!',icC('rock',rock.col));return}}

  const cracks=['M92 30 l-6 22 l8 14','M70 62 l-14 20 l4 18','M118 60 l10 24 l-6 16','M60 120 l18 -14 l14 6','M140 96 l-18 6 l-6 18','M44 70 l20 8','M100 80 l-8 22 l12 14','M128 120 l-10 -14'];
  $('rockSvg').addEventListener('pointerdown',()=>{
    if(done)return;hits++;SND.rock(hits>=total);$('cracks').innerHTML=cracks.slice(0,hits).map(d=>`<path d="${d}"/>`).join('');
    $('taps').querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k<hits));
    const rs=$('rockSvg');rs.style.transform=`rotate(${hits%2?3:-3}deg)`;setTimeout(()=>{const r=$('rockSvg');if(r)r.style.transform=''},90);

// ---------- motion & battery ----------
// The looping scenery and idle pet motion were the biggest battery cost: every animation frame the phone had to
// recompute and repaint the whole SVG tank, 60 times a second, even while the phone just sat there. Looping
// animations are taken over here and stepped at a calmer frame rate. One-off care animations, the minigames and
// the splash are left alone, so tapping still feels instant and smooth.
const MOTION={
  smooth:{n:'Smooth',d:'Full frame rate all the time. Uses the most battery.'},
  balanced:{n:'Balanced',d:'Scenery moves at a calmer frame rate, and slows right down when you stop touching the screen.'},
  saver:{n:'Saver',d:'Scenery holds still. Your pet still breathes and blinks, gently. Easiest on the battery.'}};
const motion=()=>MOTION[S.motion]?S.motion:'balanced';
const IDLE_MS=40000;

function ambFps(){const idle=performance.now()-AMB.touch>IDLE_MS;return motion()==='saver'||idle?8:24}
function ambAdopt(){
  for(const a of document.getAnimations()){
    if(AMB.set.has(a)||typeof CSSAnimation==='undefined'||!(a instanceof CSSAnimation)||a.playState!=='running')continue;
    const ef=a.effect;if(!ef||!ef.getTiming||ef.getTiming().iterations!==Infinity)continue;
    const tg=ef.target;if(tg&&tg.closest&&tg.closest('#fz,#ml,#lx'))continue;
    a.__decor=!!(tg&&tg.closest&&tg.closest('#decor'));
    a.__base=performance.now()-(a.currentTime||0);
    a.pause();AMB.set.add(a);a.addEventListener('cancel',()=>AMB.set.delete(a),{once:true});
  }
  for(const a of AMB.set){const tg=a.effect&&a.effect.target;if(!tg||!tg.isConnected)AMB.set.delete(a)}
}
function ambRelease(){const now=performance.now();{const sv=$('stage')&&$('stage').firstElementChild;if(sv&&sv.__amb&&sv.unpauseAnimations){sv.__amb=0;sv.unpauseAnimations()}}for(const a of AMB.set){try{if(a.playState!=='idle'){a.currentTime=now-a.__base;a.play()}}catch(e){}}AMB.set.clear()}
function ambStep(){
  clearTimeout(AMB.timer);AMB.timer=0;
  if(document.hidden||RETIRED)return;
  if(motion()==='smooth'){ambRelease();return}
  const now=performance.now();
  if(now>=AMB.scanAt){AMB.scanAt=now+600;try{ambAdopt()}catch(e){}}
  const still=motion()==='saver';
  for(const a of AMB.set){if(still&&a.__decor)continue;try{a.currentTime=now-a.__base}catch(e){AMB.set.delete(a)}}
  // Prismatic pets shimmer with an SVG (SMIL) animation, which the loop above can't see: step that one by hand too.
  const sv=$('stage')&&$('stage').firstElementChild;
  if(sv&&sv.pauseAnimations&&sv.querySelector('animate,animateTransform')){if(!sv.__amb){sv.__amb=1;sv.pauseAnimations()}try{sv.setCurrentTime(now/1000)}catch(e){}}

}

// ---------- back button ----------
// The phone/browser Back button used to leave (and reload) the page. Now it steps back inside the game:
// open menu -> previous menu screen (e.g. creature page -> Critterpedia) -> closes the menu -> previous tank you visited.
// A history "guard" entry is kept on top so Back never navigates the page away.
const screenStack=[];let screen=null,screenBacking=false;
function trackScreen(name,fn){
  return function(...a){
    if(name==='hub'&&a[0]==null)a=[hubTab];   // remember which tab, so going back reopens that exact tab
    const key=name+':'+(a[0]==null?(name==='hub'?hubTab:''):a[0]),open=!!$('layer').innerHTML;
    if(!screenBacking&&open&&screen&&screen.key!==key){
      const top=screenStack[screenStack.length-1];
      if(top&&top.key===key)screenStack.pop();          // an in-menu "Back" button: treat as stepping back
      else{screenStack.push(screen);if(screenStack.length>20)screenStack.shift()}
    }
    if(!open)screenStack.length=0;
    screen={key,go:()=>fn(...a)};
    return fn(...a);
  };
}
